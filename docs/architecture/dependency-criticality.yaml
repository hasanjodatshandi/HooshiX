version: 2
classes:
  - AUTHORITATIVE_SECURITY
  - AUTHORITATIVE_STATE
  - DURABLE_COMMAND
  - EXTERNAL_SIDE_EFFECT
  - OPTIONAL_READ
  - OBSERVABILITY

edges:
  - operation_id: protected-resource.check-permission
    caller_owner: resource-owning service
    dependency_id: authorization.CheckPermission
    class: AUTHORITATIVE_SECURITY
    failure_action: "UNAVAILABLE / AUTHORIZATION_UNAVAILABLE; fail closed"
    retry_owner: none
    fallback: "none; no permission cache/stale allow"
    owner: Platform Authorization
    policy_refs:
      - docs/adr/0013-use-online-authorization-without-cache-or-kafka-v1.md
      - docs/adr/0026-harden-online-authorization-overload-and-slo-v1.md
      - docs/adr/0032-finalize-authorization-slo-alerting-and-breaker-recovery-v1.md
      - docs/adr/0036-refine-authorization-breaker-recovery-and-dependency-policy-governance-v1.md

  - operation_id: identity.security-semantic-quota
    caller_owner: Identity
    dependency_id: security-redis.semantic-quota
    class: AUTHORITATIVE_SECURITY
    failure_action: "fail closed; distinguish quota denial from time/capacity/transport unavailability"
    retry_owner: none
    fallback: none
    owner: Identity
    policy_refs:
      - docs/adr/0024-harden-semantic-quota-time-safety-v1.md
      - docs/architecture/services/identity-service.md

  - operation_id: identity.password-credential-write
    caller_owner: Identity
    dependency_id: compromised-password.LookupCompromisedPasswordRange
    class: AUTHORITATIVE_SECURITY
    failure_action: "reject unchecked password; stale/corrupt/missing/incompatible dataset never becomes clean result"
    retry_owner: none
    fallback: "none; no runtime HIBP/provider/Redis/PostgreSQL fallback"
    owner: Identity
    policy_refs:
      - docs/adr/0040-define-self-contained-compromised-password-sqlite-v1.md
      - docs/architecture/services/identity-service.md
      - docs/architecture/services/compromised-password-service.md

  - operation_id: web-bff.authenticated-session-lookup
    caller_owner: Web BFF
    dependency_id: security-redis.bff-session
    class: AUTHORITATIVE_SECURITY
    failure_action: "session unavailable; never reconstruct authority from browser state"
    retry_owner: none
    fallback: none
    owner: Web BFF
    policy_refs:
      - docs/adr/0016-define-web-bff-browser-oidc-and-session-security-v1.md
      - docs/architecture/services/web-bff.md

  - operation_id: web-bff.security-semantic-quota
    caller_owner: Web BFF
    dependency_id: security-redis.semantic-quota
    class: AUTHORITATIVE_SECURITY
    failure_action: "OIDC security operation unavailable; fail closed; distinguish denial from time/capacity/transport failure"
    retry_owner: none
    fallback: none
    owner: Web BFF
    policy_refs:
      - docs/adr/0024-harden-semantic-quota-time-safety-v1.md
      - docs/architecture/services/web-bff.md

  - operation_id: service.normal-transaction-or-query
    caller_owner: owning service
    dependency_id: owning-postgresql
    class: AUTHORITATIVE_STATE
    failure_action: "abort/unavailable; no fabricated state"
    retry_owner: transaction-safe owner only
    fallback: none
    owner: owning service
    policy_refs:
      - docs/adr/0027-require-production-postgresql-physical-isolation-and-tenant-rls-v1.md
      - docs/architecture/data-and-messaging.md

  - operation_id: identity.notification-handoff-dispatch
    caller_owner: Identity
    dependency_id: notification.SubmitNotification
    class: DURABLE_COMMAND
    failure_action: "local outbox remains pending"
    retry_owner: caller durable dispatcher
    fallback: none
    owner: Identity
    policy_refs:
      - docs/adr/0006-finalize-notification-v1-handoff-and-semantic-contract.md

  - operation_id: identity.authorization-tenant-permission-check
    caller_owner: Identity
    dependency_id: authorization.CheckPermission
    class: AUTHORITATIVE_SECURITY
    failure_action: "tenant lifecycle administration unavailable; fail closed"
    retry_owner: none
    fallback: "none; no permission cache/stale allow"
    owner: Identity
    policy_refs:
      - docs/adr/0012-define-identity-tenant-session-external-and-mfa-v1.md
      - docs/adr/0013-use-online-authorization-without-cache-or-kafka-v1.md
      - docs/adr/0026-harden-online-authorization-overload-and-slo-v1.md
      - docs/architecture/services/identity-service.md
      - docs/architecture/services/authorization-service.md

  - operation_id: identity.authorization-owner-provisioning
    caller_owner: Identity
    dependency_id: authorization.ProvisionTenantOwner
    class: DURABLE_COMMAND
    failure_action: "keep tenant PROVISIONING/outbox pending"
    retry_owner: caller durable dispatcher
    fallback: none
    owner: Identity
    policy_refs:
      - docs/adr/0012-define-identity-tenant-session-external-and-mfa-v1.md
      - docs/architecture/services/authorization-service.md

  - operation_id: identity.authorization-member-provisioning
    caller_owner: Identity
    dependency_id: authorization.ProvisionTenantMember
    class: DURABLE_COMMAND
    failure_action: "keep provisioning outbox pending; Authorization default deny"
    retry_owner: caller durable dispatcher
    fallback: none
    owner: Identity
    policy_refs:
      - docs/adr/0012-define-identity-tenant-session-external-and-mfa-v1.md
      - docs/architecture/services/authorization-service.md

  - operation_id: identity.authorization-membership-removal-prepare
    caller_owner: Identity
    dependency_id: authorization.PrepareMembershipRemoval
    class: AUTHORITATIVE_SECURITY
    failure_action: "fail closed; Membership removal cannot commit"
    retry_owner: none
    fallback: none
    owner: Identity
    policy_refs:
      - docs/adr/0012-define-identity-tenant-session-external-and-mfa-v1.md
      - docs/architecture/services/authorization-service.md

  - operation_id: identity.authorization-membership-removal-resolution
    caller_owner: Identity
    dependency_id: authorization.FinalizeOrCancelMembershipRemoval
    class: DURABLE_COMMAND
    failure_action: "keep owner-safety reservation and resolution outbox pending"
    retry_owner: caller durable dispatcher
    fallback: none
    owner: Identity
    policy_refs:
      - docs/adr/0012-define-identity-tenant-session-external-and-mfa-v1.md
      - docs/architecture/services/authorization-service.md

  - operation_id: identity.authorization-tenant-lifecycle-sync
    caller_owner: Identity
    dependency_id: authorization.ApplyTenantLifecycle
    class: DURABLE_COMMAND
    failure_action: "keep tenant lifecycle pending; never fabricate Authorization state"
    retry_owner: caller durable dispatcher
    fallback: none
    owner: Identity
    policy_refs:
      - docs/adr/0012-define-identity-tenant-session-external-and-mfa-v1.md
      - docs/architecture/services/authorization-service.md

  - operation_id: identity.authorization-platform-permission-check
    caller_owner: Identity
    dependency_id: authorization.CheckPlatformPermission
    class: AUTHORITATIVE_SECURITY
    failure_action: "platform-only operation unavailable; fail closed"
    retry_owner: none
    fallback: none
    owner: Identity
    policy_refs:
      - docs/adr/0013-use-online-authorization-without-cache-or-kafka-v1.md
      - docs/architecture/services/authorization-service.md

  - operation_id: notification.result-callback-dispatch
    caller_owner: Notification
    dependency_id: identity.ReportNotificationResult
    class: DURABLE_COMMAND
    failure_action: "result outbox remains pending"
    retry_owner: Notification durable callback dispatcher
    fallback: none
    owner: Notification
    policy_refs:
      - docs/adr/0006-finalize-notification-v1-handoff-and-semantic-contract.md
      - docs/architecture/services/notification-service.md

  - operation_id: notification.provider-dispatch
    caller_owner: Notification
    dependency_id: email-or-sms-provider
    class: EXTERNAL_SIDE_EFFECT
    failure_action: "preserve ambiguity and reconcile"
    retry_owner: Notification worker/lifecycle
    fallback: "never fabricate ACCEPTED/DELIVERED"
    owner: Notification
    policy_refs:
      - docs/adr/0006-finalize-notification-v1-handoff-and-semantic-contract.md
      - docs/adr/0007-define-notification-v1-runtime.md
      - docs/adr/0020-select-ippanel-webservice-sms-for-iran.md

  - operation_id: web-bff.google-oidc-login
    caller_owner: Web BFF
    dependency_id: google-oidc
    class: AUTHORITATIVE_SECURITY
    failure_action: "login unavailable"
    retry_owner: protocol-defined safe flow only
    fallback: "no alternate identity auto-link"
    owner: Web BFF
    policy_refs:
      - docs/adr/0016-define-web-bff-browser-oidc-and-session-security-v1.md

  - operation_id: web-bff.identity-oidc-evidence-submit
    caller_owner: Web BFF
    dependency_id: identity.ExternalIdentitySessionEstablishment
    class: AUTHORITATIVE_SECURITY
    failure_action: "login unavailable"
    retry_owner: none
    fallback: none
    owner: Web BFF
    policy_refs:
      - docs/adr/0012-define-identity-tenant-session-external-and-mfa-v1.md
      - docs/adr/0016-define-web-bff-browser-oidc-and-session-security-v1.md

  - operation_id: web-bff.identity-local-password-authentication
    caller_owner: Web BFF
    dependency_id: identity.AuthenticateLocal
    class: AUTHORITATIVE_SECURITY
    failure_action: "login unavailable; fail closed; no alternate credential acceptance"
    retry_owner: none
    fallback: none
    owner: Web BFF
    policy_refs:
      - docs/adr/0012-define-identity-tenant-session-external-and-mfa-v1.md
      - docs/adr/0016-define-web-bff-browser-oidc-and-session-security-v1.md
      - docs/architecture/services/identity-service.md
      - docs/architecture/services/web-bff.md

  - operation_id: web-bff.identity-session-refresh
    caller_owner: Web BFF
    dependency_id: identity.RefreshSession
    class: AUTHORITATIVE_SECURITY
    failure_action: "session refresh unavailable; fail closed; no browser reconstruction"
    retry_owner: none
    fallback: none
    owner: Web BFF
    policy_refs:
      - docs/adr/0012-define-identity-tenant-session-external-and-mfa-v1.md
      - docs/adr/0016-define-web-bff-browser-oidc-and-session-security-v1.md
      - docs/architecture/services/identity-service.md
      - docs/architecture/services/web-bff.md

  - operation_id: web-bff.identity-session-revocation
    caller_owner: Web BFF
    dependency_id: identity.LogoutCurrentOrAll
    class: AUTHORITATIVE_SECURITY
    failure_action: "Identity revocation outcome unavailable; BFF may discard its browser session but must not claim global family revocation"
    retry_owner: none
    fallback: none
    owner: Web BFF
    policy_refs:
      - docs/adr/0012-define-identity-tenant-session-external-and-mfa-v1.md
      - docs/adr/0016-define-web-bff-browser-oidc-and-session-security-v1.md
      - docs/architecture/services/identity-service.md
      - docs/architecture/services/web-bff.md
  - operation_id: web-bff.identity-audience-token-broker
    caller_owner: Web BFF
    dependency_id: identity.IssueAudienceAccessToken
    class: AUTHORITATIVE_SECURITY
    failure_action: "token brokerage unavailable; fail closed"
    retry_owner: none
    fallback: none
    owner: Web BFF
    policy_refs:
      - docs/adr/0016-define-web-bff-browser-oidc-and-session-security-v1.md
      - docs/architecture/services/web-bff.md

  - operation_id: web-bff.authorization-tenant-management
    caller_owner: Web BFF
    dependency_id: authorization.TenantManagement
    class: AUTHORITATIVE_SECURITY
    failure_action: "management unavailable; fail closed; no fabricated local authority"
    retry_owner: none
    fallback: none
    owner: Web BFF
    policy_refs:
      - docs/adr/0013-use-online-authorization-without-cache-or-kafka-v1.md
      - docs/adr/0016-define-web-bff-browser-oidc-and-session-security-v1.md
      - docs/architecture/services/authorization-service.md
      - docs/architecture/services/web-bff.md

  - operation_id: web-bff.resource-api-dispatch
    caller_owner: Web BFF
    dependency_id: registered-resource-service
    class: AUTHORITATIVE_STATE
    failure_action: "abort request/resource unavailable; no fabricated business data"
    retry_owner: none
    fallback: none
    owner: Web BFF
    policy_refs:
      - docs/adr/0016-define-web-bff-browser-oidc-and-session-security-v1.md
      - docs/architecture/services/web-bff.md

  - operation_id: business.optional-enrichment
    caller_owner: owning bounded context
    dependency_id: explicitly-approved-enrichment-service
    class: OPTIONAL_READ
    failure_action: "use only explicit bounded degraded result"
    retry_owner: none
    fallback: "bounded-context-defined only"
    owner: owning bounded context
    policy_refs:
      - docs/adr/0033-define-operation-level-dependency-criticality-and-degradation-v1.md
      - docs/adr/0036-refine-authorization-breaker-recovery-and-dependency-policy-governance-v1.md

  - operation_id: platform.non-audit-telemetry-export
    caller_owner: any service
    dependency_id: observability.otel-collector-or-metrics-scrape
    class: OBSERVABILITY
    failure_action: "bounded buffer/drop; ordinary business request continues"
    retry_owner: exporter
    fallback: "bounded ordinary telemetry loss allowed"
    owner: Platform Observability
    policy_refs:
      - docs/adr/0044-define-day-one-observability-runtime-v1.md
      - docs/architecture/reliability-and-observability.md

  - operation_id: service.required-security-audit-evidence
    caller_owner: owning service
    dependency_id: audit-persistence-or-outbox
    class: AUTHORITATIVE_STATE
    failure_action: "durable contract; do not silently drop or reclassify as ordinary telemetry"
    retry_owner: owning service
    fallback: "none unless explicit current decision"
    owner: owning service
    policy_refs:
      - docs/adr/0033-define-operation-level-dependency-criticality-and-degradation-v1.md
      - docs/architecture/security-architecture.md
