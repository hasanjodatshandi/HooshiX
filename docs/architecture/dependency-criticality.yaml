version: 2
classes:
  - AUTHORITATIVE_SECURITY
  - AUTHORITATIVE_STATE
  - DURABLE_COMMAND
  - EXTERNAL_SIDE_EFFECT
  - OPTIONAL_READ
  - OBSERVABILITY
edges:
  - operation_id: protected-resource.check-permission
    caller_owner: resource-owning-service
    dependency_id: authorization.check-permission
    class: AUTHORITATIVE_SECURITY
    failure_action: fail_closed_authorization_unavailable
    retry_owner: none
    fallback: none
    owner: platform-authorization
    policy_refs:
      - ADR-0013
      - ADR-0026
      - ADR-0032
      - ADR-0036

  - operation_id: identity.security-semantic-quota
    caller_owner: identity-service
    dependency_id: semantic-quota.redis
    class: AUTHORITATIVE_SECURITY
    failure_action: fail_closed_security_dependency_unavailable
    retry_owner: none
    fallback: none
    owner: identity
    policy_refs:
      - ADR-0024

  - operation_id: identity.password-credential-write
    caller_owner: identity-service
    dependency_id: compromised-password-service
    class: AUTHORITATIVE_SECURITY
    failure_action: reject_unchecked_password
    retry_owner: none
    fallback: none
    owner: identity
    policy_refs:
      - docs/architecture/security-architecture.md#4-passwords-external-identity-and-mfa
      - docs/architecture/services/identity-service.md#7-password-credential-and-compromised-password-baseline

  - operation_id: web-bff.authenticated-session-lookup
    caller_owner: web-bff
    dependency_id: bff-session.redis
    class: AUTHORITATIVE_SECURITY
    failure_action: session_unavailable
    retry_owner: none
    fallback: none
    owner: web-bff
    policy_refs:
      - ADR-0016
      - docs/architecture/services/web-bff.md#5-completed-browser-session

  - operation_id: web-bff.security-semantic-quota
    caller_owner: web-bff
    dependency_id: semantic-quota.redis
    class: AUTHORITATIVE_SECURITY
    failure_action: fail_closed_security_dependency_unavailable
    retry_owner: none
    fallback: none
    owner: web-bff
    policy_refs:
      - ADR-0024
      - docs/architecture/services/web-bff.md#9-semantic-oidc-abuse-quotas

  - operation_id: service.normal-transaction-or-query
    caller_owner: owning-service
    dependency_id: owning-postgresql
    class: AUTHORITATIVE_STATE
    failure_action: abort_or_unavailable
    retry_owner: transaction-safe-owner-only
    fallback: none
    owner: owning-service
    policy_refs:
      - ADR-0027
      - docs/architecture/data-and-messaging.md#1-data-ownership-and-isolation

  - operation_id: identity.notification-handoff-dispatch
    caller_owner: identity-service
    dependency_id: notification.submit-notification
    class: DURABLE_COMMAND
    failure_action: keep_local_outbox_pending
    retry_owner: caller-durable-dispatcher
    fallback: none
    owner: identity
    policy_refs:
      - ADR-0006

  - operation_id: identity.authorization-owner-provisioning
    caller_owner: identity-service
    dependency_id: authorization.provision-tenant-owner
    class: DURABLE_COMMAND
    failure_action: keep_tenant_provisioning_and_local_outbox_pending
    retry_owner: caller-durable-dispatcher
    fallback: none
    owner: identity
    policy_refs:
      - ADR-0012
      - docs/architecture/services/authorization-service.md#10-identity-provisioning-and-tenant-lifecycle

  - operation_id: identity.authorization-member-provisioning
    caller_owner: identity-service
    dependency_id: authorization.provision-tenant-member
    class: DURABLE_COMMAND
    failure_action: keep_member_provisioning_outbox_pending_and_default_deny
    retry_owner: caller-durable-dispatcher
    fallback: none
    owner: identity
    policy_refs:
      - ADR-0012
      - docs/architecture/services/authorization-service.md#10-identity-provisioning-and-tenant-lifecycle

  - operation_id: identity.authorization-membership-removal-prepare
    caller_owner: identity-service
    dependency_id: authorization.prepare-membership-removal
    class: AUTHORITATIVE_SECURITY
    failure_action: fail_closed_membership_removal_unavailable
    retry_owner: none
    fallback: none
    owner: identity
    policy_refs:
      - ADR-0012
      - docs/architecture/services/authorization-service.md#9-owner-safety-membership-and-role-mutation-protocol

  - operation_id: identity.authorization-membership-removal-resolution
    caller_owner: identity-service
    dependency_id: authorization.finalize-or-cancel-membership-removal
    class: DURABLE_COMMAND
    failure_action: keep_owner_safety_reservation_and_resolution_outbox_pending
    retry_owner: caller-durable-dispatcher
    fallback: none
    owner: identity
    policy_refs:
      - ADR-0012
      - docs/architecture/services/authorization-service.md#9-owner-safety-membership-and-role-mutation-protocol

  - operation_id: identity.authorization-tenant-lifecycle-sync
    caller_owner: identity-service
    dependency_id: authorization.apply-tenant-lifecycle
    class: DURABLE_COMMAND
    failure_action: keep_tenant_lifecycle_pending_without_fabricated_authorization_state
    retry_owner: caller-durable-dispatcher
    fallback: none
    owner: identity
    policy_refs:
      - ADR-0012
      - docs/architecture/services/authorization-service.md#10-identity-provisioning-and-tenant-lifecycle

  - operation_id: identity.authorization-platform-permission-check
    caller_owner: identity-service
    dependency_id: authorization.check-platform-permission
    class: AUTHORITATIVE_SECURITY
    failure_action: fail_closed_platform_authorization_unavailable
    retry_owner: none
    fallback: none
    owner: identity
    policy_refs:
      - ADR-0013
      - docs/architecture/services/authorization-service.md#11-platform-capability-authority

  - operation_id: notification.result-callback-dispatch
    caller_owner: notification-service
    dependency_id: identity.report-notification-result
    class: DURABLE_COMMAND
    failure_action: keep_result_outbox_pending
    retry_owner: notification-durable-callback-dispatcher
    fallback: none
    owner: notification
    policy_refs:
      - ADR-0006
      - docs/architecture/services/notification-service.md#14-result-callback

  - operation_id: notification.provider-dispatch
    caller_owner: notification-service
    dependency_id: external-email-or-sms-provider
    class: EXTERNAL_SIDE_EFFECT
    failure_action: preserve_ambiguity_and_reconcile
    retry_owner: notification-worker-lifecycle
    fallback: never_fabricate_acceptance_or_delivery
    owner: notification
    policy_refs:
      - ADR-0006
      - ADR-0007
      - ADR-0020

  - operation_id: web-bff.google-oidc-login
    caller_owner: web-bff
    dependency_id: google-oidc-endpoints
    class: AUTHORITATIVE_SECURITY
    failure_action: login_unavailable
    retry_owner: protocol-defined-safe-flow-only
    fallback: no_alternate_identity_auto_link
    owner: web-bff
    policy_refs:
      - ADR-0016
      - docs/architecture/services/web-bff.md#3-oidc-and-pre-auth-browser-transaction

  - operation_id: web-bff.identity-oidc-evidence-submit
    caller_owner: web-bff
    dependency_id: identity.external-identity-establish
    class: AUTHORITATIVE_SECURITY
    failure_action: login_unavailable
    retry_owner: none
    fallback: none
    owner: web-bff
    policy_refs:
      - ADR-0012
      - ADR-0016
      - docs/architecture/services/web-bff.md#3-oidc-and-pre-auth-browser-transaction

  - operation_id: web-bff.identity-audience-token-broker
    caller_owner: web-bff
    dependency_id: identity.issue-audience-access-token
    class: AUTHORITATIVE_SECURITY
    failure_action: fail_closed_token_broker_unavailable
    retry_owner: none
    fallback: none
    owner: web-bff
    policy_refs:
      - ADR-0016
      - docs/architecture/services/web-bff.md#4-identity-audience-specific-token-brokerage

  - operation_id: web-bff.authorization-tenant-management
    caller_owner: web-bff
    dependency_id: authorization.tenant-management
    class: AUTHORITATIVE_SECURITY
    failure_action: management_unavailable_fail_closed
    retry_owner: none
    fallback: none
    owner: web-bff
    policy_refs:
      - ADR-0013
      - ADR-0016
      - docs/architecture/services/web-bff.md#10-internal-calls-and-tenant-authorization-administration
      - docs/architecture/services/authorization-service.md#7-tenant-management-authentication-and-authorization

  - operation_id: web-bff.resource-api-dispatch
    caller_owner: web-bff
    dependency_id: registered-resource-service
    class: AUTHORITATIVE_STATE
    failure_action: abort_request_or_resource_unavailable
    retry_owner: none
    fallback: none
    owner: web-bff
    policy_refs:
      - ADR-0016
      - docs/architecture/services/web-bff.md#10-internal-calls-and-tenant-authorization-administration
      - docs/architecture/services/web-bff.md#11-final-authorization-boundary

  - operation_id: business.optional-enrichment
    caller_owner: owning-bounded-context
    dependency_id: approved-enrichment-service
    class: OPTIONAL_READ
    failure_action: use_explicit_bounded_degraded_result
    retry_owner: none
    fallback: bounded_context_defined_only
    owner: owning-bounded-context
    policy_refs:
      - ADR-0033
      - ADR-0036

  - operation_id: platform.non-audit-telemetry-export
    caller_owner: any-service
    dependency_id: observability-backend
    class: OBSERVABILITY
    failure_action: bounded_buffer_or_drop
    retry_owner: exporter
    fallback: bounded_loss_allowed
    owner: platform-observability
    policy_refs:
      - ADR-0033
      - docs/architecture/reliability-and-observability.md#10-observability

  - operation_id: service.required-security-audit-evidence
    caller_owner: owning-service
    dependency_id: audit-persistence-or-outbox
    class: AUTHORITATIVE_STATE
    failure_action: do_not_silently_drop
    retry_owner: owning-service
    fallback: none_unless_explicit_current_decision
    owner: owning-service
    policy_refs:
      - ADR-0033
      - docs/architecture/security-architecture.md#13-loggingpii-and-privileged-access
