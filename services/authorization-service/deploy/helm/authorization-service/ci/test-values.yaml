image:
  repository: registry.invalid/hooshix/authorization-service
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
runtime:
  enabled: true
  checkPermission:
    globalConcurrency: 8
    perCallerConcurrency: 4
    globalQueueCapacity: 8
    perCallerQueueCapacity: 2
    maxCallerBuckets: 64
    queueWait: PT0.025S
quota:
  maxActiveBuckets: 10000
  maxNewBucketsPerMinute: 1000
  minimumMemoryHeadroomPercent: 30
  redis:
    connectionSecretName: authorization-quota-redis
  hostTimeStatus:
    configMapName: authorization-host-time
database:
  jdbcUrl: jdbc:postgresql://authorization-postgresql.platform-data.svc.cluster.local:5432/authorization
  runtimeSecretName: authorization-db-runtime
  migrationSecretName: authorization-db-migration
secrets:
  fingerprintSecretName: authorization-fingerprint
  quotaKeySecretName: authorization-quota-key
identity:
  jwtVerifierConfigMapName: identity-jwt-verifier
webBff:
  principal: prod.sajtech.internal/ns/platform-apps/sa/web-bff
resourceCallers:
  - namespace: platform-apps
    podLabels:
      app.kubernetes.io/name: workflow-service
    principal: prod.sajtech.internal/ns/platform-apps/sa/workflow-service
    callerId: workflow-service
observability:
  tracing:
    enabled: true
    otlpEndpoint: http://otel-collector.platform-observability.svc.cluster.local:4318
    collector:
      namespace: platform-observability
      podLabels:
        app.kubernetes.io/name: otel-collector
      port: 4318
  metrics:
    enabled: true
    prometheus:
      namespace: platform-observability
      podLabels:
        app.kubernetes.io/name: prometheus
      principal: prod.sajtech.internal/ns/platform-observability/sa/prometheus
