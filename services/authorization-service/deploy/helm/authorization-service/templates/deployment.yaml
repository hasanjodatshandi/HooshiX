{{- $repository := required "image.repository is required" .Values.image.repository -}}
{{- $digest := required "image.digest is required" .Values.image.digest -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $digest) }}{{ fail "image.digest must be an immutable sha256 digest" }}{{ end -}}
{{- if ne (int .Values.replicaCount) 1 }}{{ fail "Authorization single-server profile must render exactly one replica" }}{{ end -}}
{{- if le (int .Values.quota.maxActiveBuckets) 0 }}{{ fail "quota.maxActiveBuckets must be measured and positive" }}{{ end -}}
{{- if le (int .Values.quota.maxNewBucketsPerMinute) 0 }}{{ fail "quota.maxNewBucketsPerMinute must be measured and positive" }}{{ end -}}
{{- if lt (int .Values.quota.minimumMemoryHeadroomPercent) 30 }}{{ fail "quota.minimumMemoryHeadroomPercent must be at least 30" }}{{ end -}}
{{- if .Values.runtime.enabled }}
{{- if le (int .Values.runtime.checkPermission.globalConcurrency) 0 }}{{ fail "runtime.checkPermission.globalConcurrency must be measured and positive" }}{{ end -}}
{{- if le (int .Values.runtime.checkPermission.perCallerConcurrency) 0 }}{{ fail "runtime.checkPermission.perCallerConcurrency must be measured and positive" }}{{ end -}}
{{- if gt (int .Values.runtime.checkPermission.perCallerConcurrency) (int .Values.runtime.checkPermission.globalConcurrency) }}{{ fail "per-caller concurrency must not exceed global concurrency" }}{{ end -}}
{{- if le (int .Values.runtime.checkPermission.globalQueueCapacity) 0 }}{{ fail "runtime.checkPermission.globalQueueCapacity must be bounded and positive" }}{{ end -}}
{{- if le (int .Values.runtime.checkPermission.perCallerQueueCapacity) 0 }}{{ fail "runtime.checkPermission.perCallerQueueCapacity must be bounded and positive" }}{{ end -}}
{{- if gt (int .Values.runtime.checkPermission.perCallerQueueCapacity) (int .Values.runtime.checkPermission.globalQueueCapacity) }}{{ fail "per-caller queue capacity must not exceed global queue capacity" }}{{ end -}}
{{- if ne .Values.runtime.checkPermission.queueWait "PT0.025S" }}{{ fail "single-server CheckPermission queueWait must remain exactly PT0.025S" }}{{ end -}}
{{- end -}}
{{- $callerIds := dict -}}
{{- $_ := set $callerIds "identity-service" true -}}
{{- range .Values.resourceCallers }}
{{- $callerId := required "resource caller callerId is required" .callerId -}}
{{- if not (regexMatch "^[a-z][a-z0-9-]{0,63}$" $callerId) }}{{ fail "resource caller callerId is invalid" }}{{ end -}}
{{- if hasKey $callerIds $callerId }}{{ fail "resource caller callerId must be unique and must not reuse identity-service" }}{{ end -}}
{{- $_ := set $callerIds $callerId true -}}
{{- end }}
{{- if and .Values.runtime.enabled (lt (int .Values.runtime.checkPermission.maxCallerBuckets) (len $callerIds)) }}{{ fail "maxCallerBuckets must cover every configured CheckPermission caller" }}{{ end -}}
{{- $jdbcUrl := required "database.jdbcUrl is required" .Values.database.jdbcUrl -}}
{{- $runtimeDb := required "database.runtimeSecretName is required" .Values.database.runtimeSecretName -}}
{{- $migrationDb := required "database.migrationSecretName is required" .Values.database.migrationSecretName -}}
{{- if eq $runtimeDb $migrationDb }}{{ fail "runtime and migration database credentials must be distinct" }}{{ end -}}
{{- $kafkaSecret := "" -}}
{{- if .Values.runtime.erasureRuntimeEnabled }}
{{- $kafkaSecret = required "kafka.connectionSecretName is required when erasure runtime is enabled" .Values.kafka.connectionSecretName -}}
{{- end -}}
{{- $fingerprint := required "secrets.fingerprintSecretName is required" .Values.secrets.fingerprintSecretName -}}
{{- $quotaKey := required "secrets.quotaKeySecretName is required" .Values.secrets.quotaKeySecretName -}}
{{- $quotaRedis := required "quota.redis.connectionSecretName is required" .Values.quota.redis.connectionSecretName -}}
{{- $hostTime := required "quota.hostTimeStatus.configMapName is required" .Values.quota.hostTimeStatus.configMapName -}}
{{- $jwtBundle := required "identity.jwtVerifierConfigMapName is required" .Values.identity.jwtVerifierConfigMapName -}}
{{- if or (not .Values.identity.jwtIssuer) (contains "*" .Values.identity.jwtIssuer) }}{{ fail "identity.jwtIssuer must be exact" }}{{ end -}}
{{- if not .Values.observability.tracing.enabled }}{{ fail "Day-One tracing must remain enabled" }}{{ end -}}
{{- if not .Values.observability.metrics.enabled }}{{ fail "Day-One metrics must remain enabled" }}{{ end -}}
{{- $traceEndpoint := required "observability.tracing.otlpEndpoint is required" .Values.observability.tracing.otlpEndpoint -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "authorization-service.name" . }}
  labels:
    {{- include "authorization-service.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 0}
  selector:
    matchLabels:
      {{- include "authorization-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "authorization-service.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 15
      initContainers:
        - name: migrate
          image: "{{ $repository }}@{{ $digest }}"
          args: ["--spring.profiles.active=migration"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - {name: AUTHORIZATION_DATABASE_URL, value: {{ $jdbcUrl | quote }}}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: migration-db, mountPath: /run/secrets/authorization-db-migration, readOnly: true}
            - {name: temporary, mountPath: /tmp}
      containers:
        - name: application
          image: "{{ $repository }}@{{ $digest }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {name: grpc, containerPort: {{ .Values.service.grpcPort }}, protocol: TCP}
            - {name: management, containerPort: {{ .Values.service.managementPort }}, protocol: TCP}
          env:
            - {name: AUTHORIZATION_DATABASE_URL, value: {{ $jdbcUrl | quote }}}
            - {name: AUTHORIZATION_GRPC_PORT, value: {{ .Values.service.grpcPort | quote }}}
            - {name: AUTHORIZATION_RUNTIME_ENABLED, value: {{ .Values.runtime.enabled | quote }}}
            - {name: AUTHORIZATION_ERASURE_RUNTIME_ENABLED, value: {{ .Values.runtime.erasureRuntimeEnabled | quote }}}
            - {name: AUTHORIZATION_IDENTITY_ERASURE_TARGET, value: {{ .Values.identity.erasureTarget | quote }}}
            - {name: AUTHORIZATION_MAX_CONCURRENT_CALLS_PER_CONNECTION, value: {{ .Values.runtime.maxConcurrentCallsPerConnection | quote }}}
            - {name: AUTHORIZATION_CHECK_PERMISSION_GLOBAL_CONCURRENCY, value: {{ .Values.runtime.checkPermission.globalConcurrency | quote }}}
            - {name: AUTHORIZATION_CHECK_PERMISSION_PER_CALLER_CONCURRENCY, value: {{ .Values.runtime.checkPermission.perCallerConcurrency | quote }}}
            - {name: AUTHORIZATION_CHECK_PERMISSION_GLOBAL_QUEUE_CAPACITY, value: {{ .Values.runtime.checkPermission.globalQueueCapacity | quote }}}
            - {name: AUTHORIZATION_CHECK_PERMISSION_PER_CALLER_QUEUE_CAPACITY, value: {{ .Values.runtime.checkPermission.perCallerQueueCapacity | quote }}}
            - {name: AUTHORIZATION_CHECK_PERMISSION_MAX_CALLER_BUCKETS, value: {{ .Values.runtime.checkPermission.maxCallerBuckets | quote }}}
            - {name: AUTHORIZATION_CHECK_PERMISSION_QUEUE_WAIT, value: {{ .Values.runtime.checkPermission.queueWait | quote }}}
            - {name: AUTHORIZATION_FINGERPRINT_KEY_RING_PATH, value: /run/secrets/authorization-fingerprint/fingerprint.properties}
            - {name: AUTHORIZATION_QUOTA_KEY_RING_PATH, value: /run/secrets/authorization-quota-key/quota.properties}
            - {name: AUTHORIZATION_IDENTITY_JWT_VERIFIER_BUNDLE_PATH, value: /run/config/authorization-identity-jwt/verifier.properties}
            - {name: AUTHORIZATION_IDENTITY_JWT_ISSUER, value: {{ .Values.identity.jwtIssuer | quote }}}
            - {name: AUTHORIZATION_QUOTA_MAX_ACTIVE_BUCKETS, value: {{ .Values.quota.maxActiveBuckets | quote }}}
            - {name: AUTHORIZATION_QUOTA_MAX_NEW_BUCKETS_PER_MINUTE, value: {{ .Values.quota.maxNewBucketsPerMinute | quote }}}
            - {name: AUTHORIZATION_QUOTA_MINIMUM_MEMORY_HEADROOM_PERCENT, value: {{ .Values.quota.minimumMemoryHeadroomPercent | quote }}}
            - {name: AUTHORIZATION_HOST_TIME_STATUS_PATH, value: /run/status/authorization/host-time-synchronized}
            - {name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT, value: {{ $traceEndpoint | quote }}}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe: {httpGet: {path: /actuator/health/readiness, port: management}, periodSeconds: 10, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: management}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: management}, periodSeconds: 20, timeoutSeconds: 2, failureThreshold: 3}
          volumeMounts:
            - {name: runtime-db, mountPath: /run/secrets/authorization-db-runtime, readOnly: true}
            {{- if .Values.runtime.erasureRuntimeEnabled }}
            - {name: kafka, mountPath: /run/secrets/authorization-kafka, readOnly: true}
            {{- end }}
            - {name: fingerprint-key, mountPath: /run/secrets/authorization-fingerprint, readOnly: true}
            - {name: quota-key, mountPath: /run/secrets/authorization-quota-key, readOnly: true}
            - {name: identity-jwt-bundle, mountPath: /run/config/authorization-identity-jwt, readOnly: true}
            - {name: quota-redis, mountPath: /run/secrets/authorization-quota-redis, readOnly: true}
            - {name: host-time-status, mountPath: /run/status/authorization, readOnly: true}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: runtime-db
          secret: {secretName: {{ $runtimeDb | quote }}, defaultMode: 0440}
        - name: migration-db
          secret: {secretName: {{ $migrationDb | quote }}, defaultMode: 0440}
        {{- if .Values.runtime.erasureRuntimeEnabled }}
        - name: kafka
          secret: {secretName: {{ $kafkaSecret | quote }}, defaultMode: 0440}
        {{- end }}
        - name: fingerprint-key
          secret: {secretName: {{ $fingerprint | quote }}, defaultMode: 0440, items: [{key: fingerprint.properties, path: fingerprint.properties}]}
        - name: quota-key
          secret: {secretName: {{ $quotaKey | quote }}, defaultMode: 0440, items: [{key: quota.properties, path: quota.properties}]}
        - name: identity-jwt-bundle
          configMap: {name: {{ $jwtBundle | quote }}, items: [{key: verifier.properties, path: verifier.properties}]}
        - name: quota-redis
          secret: {secretName: {{ $quotaRedis | quote }}, defaultMode: 0440}
        - name: host-time-status
          configMap: {name: {{ $hostTime | quote }}, items: [{key: host-time-synchronized, path: host-time-synchronized}]}
        - name: temporary
          emptyDir: {sizeLimit: {{ .Values.runtime.temporaryStorageLimit }}}
