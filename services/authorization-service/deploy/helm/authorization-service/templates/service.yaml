apiVersion: v1
kind: Service
metadata:
  name: {{ include "authorization-service.name" . }}
  labels:
    {{- include "authorization-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "authorization-service.selectorLabels" . | nindent 4 }}
  ports:
    - {name: grpc, port: {{ .Values.service.grpcPort }}, targetPort: grpc, protocol: TCP}
    - {name: management, port: {{ .Values.service.managementPort }}, targetPort: management, protocol: TCP}
