spring:
  application:
    name: conversation-service
  main:
    banner-mode: "off"
  threads:
    virtual:
      enabled: true
  config:
    import: optional:configtree:/run/secrets/conversation-db-runtime/
  datasource:
    url: ${CONVERSATION_DATABASE_URL:jdbc:postgresql://localhost:5432/conversation}
    hikari:
      maximum-pool-size: 6
      minimum-idle: 1
      connection-timeout: 250
      validation-timeout: 250
      max-lifetime: 1800000
  flyway:
    enabled: false

conversation:
  provider-runtime-enabled: ${CONVERSATION_PROVIDER_RUNTIME_ENABLED:false}
  content-key-ring-path: ${CONVERSATION_CONTENT_KEY_RING_PATH:/run/secrets/conversation-content/content.properties}
  key-ring-refresh-interval: 30s
  key-ring-maximum-staleness: 2m
  authorization-target: ${CONVERSATION_AUTHORIZATION_TARGET:dns:///authorization-service.platform-apps.svc.cluster.local:9090}
  authorization-maximum-concurrent-checks: ${CONVERSATION_AUTHORIZATION_MAXIMUM_CONCURRENT_CHECKS:4}
  identity-jwt-verifier-bundle-path: ${CONVERSATION_IDENTITY_JWT_VERIFIER_BUNDLE_PATH:/run/config/conversation-identity-jwt/verifier.properties}
  identity-jwt-issuer: ${CONVERSATION_IDENTITY_JWT_ISSUER:https://identity.sajtech.internal}
  jwt-verifier-refresh-interval: 30s
  jwt-verifier-maximum-staleness: 5m

server:
  port: -1
  shutdown: graceful

hooshix:
  conversation:
    grpc-bind-address: ${CONVERSATION_GRPC_BIND_ADDRESS:0.0.0.0}
    grpc-port: ${CONVERSATION_GRPC_PORT:9090}
    grpc-maximum-concurrent-calls: ${CONVERSATION_GRPC_MAXIMUM_CONCURRENT_CALLS:32}

management:
  server:
    port: 9092
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,conversationReadiness
  metrics:
    distribution:
      percentiles-histogram:
        conversation.grpc.duration: true
      slo:
        conversation.grpc.duration: 100ms,500ms,900ms
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        max-queue-size: 512
        max-batch-size: 128
        schedule-delay: 5s
        timeout: 2s
        otlp:
          connect-timeout: 1s
          timeout: 2s
      limits:
        max-attributes: 32
        max-attribute-value-length: 128
        max-events: 32
        max-links: 16

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
