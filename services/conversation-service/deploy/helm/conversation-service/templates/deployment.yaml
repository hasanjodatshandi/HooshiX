{{- $repository := required "image.repository is required" .Values.image.repository -}}
{{- $digest := required "image.digest is required" .Values.image.digest -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $digest) }}{{ fail "image.digest must be an immutable sha256 digest" }}{{ end -}}
{{- if ne (int .Values.replicaCount) 1 }}{{ fail "Conversation single-server profile must render exactly one replica" }}{{ end -}}
{{- $jdbcUrl := required "database.jdbcUrl is required" .Values.database.jdbcUrl -}}
{{- $runtimeDbSecret := required "database.runtimeSecretName is required" .Values.database.runtimeSecretName -}}
{{- $migrationDbSecret := required "database.migrationSecretName is required" .Values.database.migrationSecretName -}}
{{- if eq $runtimeDbSecret $migrationDbSecret }}{{ fail "runtime and migration database credentials must use distinct Secrets" }}{{ end -}}
{{- $contentSecret := required "secrets.contentKeyRingSecretName is required" .Values.secrets.contentKeyRingSecretName -}}
{{- $jwtVerifierConfigMap := required "identity.jwtVerifierConfigMapName is required" .Values.identity.jwtVerifierConfigMapName -}}
{{- $authorizationTarget := required "authorization.target is required" .Values.authorization.target -}}
{{- if lt (int .Values.authorization.maximumConcurrentChecks) 1 }}{{ fail "authorization.maximumConcurrentChecks must be positive" }}{{ end -}}
{{- if lt (int .Values.runtime.grpcMaximumConcurrentCalls) 1 }}{{ fail "runtime.grpcMaximumConcurrentCalls must be positive" }}{{ end -}}
{{- if not .Values.observability.tracing.enabled }}{{ fail "Day-One tracing must remain enabled" }}{{ end -}}
{{- if not .Values.observability.metrics.enabled }}{{ fail "Day-One metrics must remain enabled" }}{{ end -}}
{{- $traceEndpoint := required "observability.tracing.otlpEndpoint is required" .Values.observability.tracing.otlpEndpoint -}}
{{- if not (regexMatch "^https?://[^[:space:]]+/v1/traces$" $traceEndpoint) }}{{ fail "observability tracing endpoint must be an explicit /v1/traces endpoint" }}{{ end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "conversation-service.name" . }}
  labels:
    {{- include "conversation-service.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      {{- include "conversation-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "conversation-service.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 15
      initContainers:
        - name: migrate
          image: "{{ $repository }}@{{ $digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--spring.profiles.active=migration"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONVERSATION_DATABASE_URL
              value: {{ $jdbcUrl | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: migration-db-credentials
              mountPath: /run/secrets/conversation-db-migration
              readOnly: true
            - name: temporary
              mountPath: /tmp
      containers:
        - name: application
          image: "{{ $repository }}@{{ $digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            - name: management
              containerPort: {{ .Values.service.managementPort }}
              protocol: TCP
          env:
            - name: CONVERSATION_DATABASE_URL
              value: {{ $jdbcUrl | quote }}
            - name: CONVERSATION_PROVIDER_RUNTIME_ENABLED
              value: {{ .Values.runtime.providerRuntimeEnabled | quote }}
            - name: CONVERSATION_GRPC_PORT
              value: {{ .Values.service.grpcPort | quote }}
            - name: CONVERSATION_GRPC_MAXIMUM_CONCURRENT_CALLS
              value: {{ .Values.runtime.grpcMaximumConcurrentCalls | quote }}
            - name: CONVERSATION_AUTHORIZATION_TARGET
              value: {{ $authorizationTarget | quote }}
            - name: CONVERSATION_AUTHORIZATION_MAXIMUM_CONCURRENT_CHECKS
              value: {{ .Values.authorization.maximumConcurrentChecks | quote }}
            - name: CONVERSATION_IDENTITY_JWT_VERIFIER_BUNDLE_PATH
              value: /run/config/conversation-identity-jwt/verifier.properties
            - name: CONVERSATION_IDENTITY_JWT_ISSUER
              value: {{ required "identity.jwtIssuer is required" .Values.identity.jwtIssuer | quote }}
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: {{ $traceEndpoint | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: runtime-db-credentials
              mountPath: /run/secrets/conversation-db-runtime
              readOnly: true
            - name: content-key-ring
              mountPath: /run/secrets/conversation-content
              readOnly: true
            - name: identity-jwt-bundle
              mountPath: /run/config/conversation-identity-jwt
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: runtime-db-credentials
          secret:
            secretName: {{ $runtimeDbSecret | quote }}
            defaultMode: 0440
        - name: migration-db-credentials
          secret:
            secretName: {{ $migrationDbSecret | quote }}
            defaultMode: 0440
        - name: content-key-ring
          secret:
            secretName: {{ $contentSecret | quote }}
            defaultMode: 0440
            items:
              - key: content.properties
                path: content.properties
        - name: identity-jwt-bundle
          configMap:
            name: {{ $jwtVerifierConfigMap | quote }}
            items:
              - key: verifier.properties
                path: verifier.properties
        - name: temporary
          emptyDir:
            sizeLimit: {{ .Values.runtime.temporaryStorageLimit }}
