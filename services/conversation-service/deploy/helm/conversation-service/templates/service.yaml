apiVersion: v1
kind: Service
metadata:
  name: {{ include "conversation-service.name" . }}
  labels:
    {{- include "conversation-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "conversation-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management
      protocol: TCP
