apiVersion: v1
kind: Service
metadata:
  name: {{ include "conversation-service.name" . }}
  labels:
    {{- include "conversation-service.labels" . | nindent 4 }}
    istio.io/use-waypoint: {{ required "ambient.waypointName is required" .Values.ambient.waypointName | quote }}
spec:
  type: ClusterIP
  selector:
    {{- include "conversation-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management
      protocol: TCP
