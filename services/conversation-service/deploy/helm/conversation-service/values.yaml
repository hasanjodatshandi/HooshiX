replicaCount: 1

image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  name: conversation-service

service:
  grpcPort: 9090
  managementPort: 9092

webBff:
  namespace: platform-apps
  podLabels:
    app.kubernetes.io/name: web-bff
  principal: ""

runtime:
  grpcMaximumConcurrentCalls: 32
  eventRuntimeEnabled: false
  providerRuntimeEnabled: false
  providerCanaryPercent: 0
  temporaryStorageLimit: 256Mi
  providerMaximumConcurrentCalls: 4
  providerMaximumConcurrentPerTenant: 1
  providerHost: api.openai.com

authorization:
  target: dns:///authorization-service.platform-apps.svc.cluster.local:9090
  namespace: platform-apps
  podLabels:
    app.kubernetes.io/name: authorization-service
  port: 9090
  maximumConcurrentChecks: 4

identity:
  jwtVerifierConfigMapName: ""
  jwtIssuer: https://identity.sajtech.internal
  erasureTarget: dns:///identity-service.platform-apps.svc.cluster.local:9090
  namespace: platform-apps
  podLabels:
    app.kubernetes.io/name: identity-service
  port: 9090

kafka:
  bootstrapServers: ""
  namespace: platform-data
  podLabels:
    app.kubernetes.io/name: kafka
  port: 9092
  connectionSecretName: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "1"
    memory: 768Mi
    ephemeral-storage: 512Mi

database:
  jdbcUrl: ""
  namespace: platform-data
  podLabels:
    app.kubernetes.io/name: conversation-postgresql
  port: 5432
  runtimeSecretName: ""
  migrationSecretName: ""

secrets:
  contentKeyRingSecretName: ""
  providerApiKeySecretName: ""

observability:
  tracing:
    enabled: true
    otlpEndpoint: ""
    collector:
      namespace: ""
      podLabels: {}
      port: 4318
  metrics:
    enabled: true
    prometheus:
      namespace: ""
      podLabels: {}
      principal: ""
