groups:
  - name: notification-service
    rules:
      - alert: NotificationSubmitUnavailableRateHigh
        expr: |
          sum(rate(notification_submit_duration_seconds_count{outcome=~"NOTIFICATION_UNAVAILABLE|TEMPLATE_NOT_ACTIVE|UNAVAILABLE"}[5m]))
          /
          clamp_min(sum(rate(notification_submit_duration_seconds_count[5m])), 0.001)
          > 0.01
        for: 10m
        labels:
          severity: page
          service: notification-service
        annotations:
          summary: Notification durable handoff unavailable rate is above 1%
      - alert: NotificationSubmitAdmissionRejected
        expr: rate(notification_submit_admission_rejected_total[5m]) > 0
        for: 5m
        labels:
          severity: page
          service: notification-service
        annotations:
          summary: Notification submission admission is rejecting work
      - alert: NotificationSubmitSaturationHigh
        expr: notification_submit_in_flight > 100
        for: 5m
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: Notification submission in-flight work is near the transport concurrency bound
      - alert: NotificationErasureWorkExhausted
        expr: increase(notification_erasure_exhausted_total{job="notification-service"}[5m]) > 0
        for: 0m
        labels:
          severity: page
          service: notification-service
        annotations:
          summary: Notification erasure participant exhausted finite retries
      - alert: NotificationErasureReceiptPublicationFailing
        expr: increase(notification_erasure_receipt_outbox_failures_total{job="notification-service"}[5m]) > 3
        for: 2m
        labels:
          severity: warning
          service: notification-service
        annotations:
          summary: Notification erasure receipt publication is repeatedly failing
