{{- if .Values.runtime.deliveryRuntimeEnabled }}
{{- $emailHost := required "providers.email.host is required when delivery runtime is enabled" .Values.providers.email.host -}}
{{- $smsHost := required "providers.sms.host is required when delivery runtime is enabled" .Values.providers.sms.host -}}
{{- if not (regexMatch "^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)+[A-Za-z]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$" $emailHost) }}{{ fail "providers.email.host must be a DNS name" }}{{ end -}}
{{- if not (regexMatch "^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)+[A-Za-z]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$" $smsHost) }}{{ fail "providers.sms.host must be a DNS name" }}{{ end -}}
{{- if or (lt (int .Values.providers.email.port) 1) (gt (int .Values.providers.email.port) 65535) }}{{ fail "providers.email.port is invalid" }}{{ end -}}
{{- if or (lt (int .Values.providers.sms.port) 1) (gt (int .Values.providers.sms.port) 65535) }}{{ fail "providers.sms.port is invalid" }}{{ end -}}
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: {{ include "notification-service.name" . }}-email-provider
spec:
  hosts: [{{ $emailHost | quote }}]
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: {{ .Values.providers.email.port }}
      name: smtp-starttls
      protocol: TCP
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: {{ include "notification-service.name" . }}-sms-provider
spec:
  hosts: [{{ $smsHost | quote }}]
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: {{ .Values.providers.sms.port }}
      name: https
      protocol: TLS
{{- end }}
