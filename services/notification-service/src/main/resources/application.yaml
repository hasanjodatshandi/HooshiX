spring:
  application:
    name: notification-service
  main:
    banner-mode: "off"
  threads:
    virtual:
      enabled: true
  config:
    import: optional:configtree:/run/secrets/notification-db-runtime/
  datasource:
    url: ${NOTIFICATION_DATABASE_URL:jdbc:postgresql://localhost:5432/notification}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 250
      validation-timeout: 250
      max-lifetime: 1800000
  flyway:
    enabled: false
  jooq:
    sql-dialect: POSTGRES

notification:
  grpc-port: 9090
  max-concurrent-calls-per-connection: 128
  caller-service: identity-service
  fingerprint-key-ring-path: ${NOTIFICATION_FINGERPRINT_KEY_RING_PATH:/run/secrets/notification-fingerprint/fingerprint.properties}
  delivery-key-ring-path: ${NOTIFICATION_DELIVERY_KEY_RING_PATH:/run/secrets/notification-delivery/delivery.properties}
  key-ring-maximum-staleness: 2m

server:
  port: -1
  shutdown: graceful

management:
  server:
    port: 9092
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,notificationReadiness
  metrics:
    distribution:
      percentiles-histogram:
        notification.submit.duration: true
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        max-queue-size: 512
        max-batch-size: 128
        schedule-delay: 5s
        timeout: 2s
        otlp:
          connect-timeout: 1s
          timeout: 2s
      limits:
        max-attributes: 32
        max-attribute-value-length: 128
        max-events: 32
        max-links: 16

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
