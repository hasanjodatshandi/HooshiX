spring:
  application:
    name: web-bff
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
      fail-on-unknown-properties: true
    mapper:
      allow-coercion-of-scalars: false
    read:
      strict-duplicate-detection: true
  main:
    banner-mode: "off"
  threads:
    virtual:
      enabled: true
  config:
    import:
      - optional:configtree:/run/secrets/web-bff-redis/
      - optional:configtree:/run/secrets/web-bff-db-runtime/
      - optional:configtree:/run/secrets/web-bff-kafka/
  datasource:
    url: ${WEB_BFF_DATABASE_URL:jdbc:postgresql://localhost:5432/web_bff}
    username: ${WEB_BFF_DATABASE_USERNAME:web_bff_runtime}
    password: ${WEB_BFF_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 250
      validation-timeout: 250
  flyway:
    enabled: false
  jooq:
    sql-dialect: POSTGRES
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      acks: all
      retries: 2147483647
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
server:
  port: ${WEB_BFF_HTTP_PORT:-1}
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 256KB
management:
  server:
    port: ${WEB_BFF_MANAGEMENT_PORT:9092}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,webBffReadiness
web-bff:
  runtime-enabled: ${WEB_BFF_RUNTIME_ENABLED:false}
  erasure-runtime-enabled: ${WEB_BFF_ERASURE_RUNTIME_ENABLED:false}
  erasure-command-topic: ${WEB_BFF_ERASURE_COMMAND_TOPIC:hooshix.identity.erasure.command.v1}
  erasure-consumer-group: ${WEB_BFF_ERASURE_CONSUMER_GROUP:hooshix-web-bff-erasure-v1}
  erasure-receipt-topic: ${WEB_BFF_ERASURE_RECEIPT_TOPIC:hooshix.identity.erasure.receipt.v1}
  require-fetch-metadata: ${WEB_BFF_REQUIRE_FETCH_METADATA:true}
  public-origin: ${WEB_BFF_PUBLIC_ORIGIN:https://localhost}
  identity-target: ${WEB_BFF_IDENTITY_TARGET:dns:///identity-service.platform-apps.svc.cluster.local:9090}
  authorization-target: ${WEB_BFF_AUTHORIZATION_TARGET:dns:///authorization-service.platform-apps.svc.cluster.local:9090}
  redis-uri: ${WEB_BFF_REDIS_URI:redis://localhost:6379}
  locator-key-ring-path: ${WEB_BFF_LOCATOR_KEY_RING_PATH:/var/run/secrets/hooshix/web-bff-locator.properties}
  csrf-key-ring-path: ${WEB_BFF_CSRF_KEY_RING_PATH:/var/run/secrets/hooshix/web-bff-csrf.properties}
  refresh-encryption-key-ring-path: ${WEB_BFF_REFRESH_ENCRYPTION_KEY_RING_PATH:/var/run/secrets/hooshix/web-bff-refresh.properties}
  hmac-key-maximum-staleness: ${WEB_BFF_HMAC_KEY_MAXIMUM_STALENESS:PT5M}
  encryption-key-maximum-staleness: ${WEB_BFF_ENCRYPTION_KEY_MAXIMUM_STALENESS:PT1H}
  identity-maximum-concurrent-calls: ${WEB_BFF_IDENTITY_MAXIMUM_CONCURRENT_CALLS:128}
  authorization-maximum-concurrent-calls: ${WEB_BFF_AUTHORIZATION_MAXIMUM_CONCURRENT_CALLS:128}
  google-oidc-enabled: ${WEB_BFF_GOOGLE_OIDC_ENABLED:false}
  google-authorization-endpoint: https://accounts.google.com/o/oauth2/v2/auth
  google-token-endpoint: https://oauth2.googleapis.com/token
  google-jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  google-client-id: ${WEB_BFF_GOOGLE_CLIENT_ID:disabled.apps.googleusercontent.com}
  google-client-secret-path: ${WEB_BFF_GOOGLE_CLIENT_SECRET_PATH:/var/run/secrets/hooshix/web-bff-google-client-secret}
  google-maximum-concurrent-calls: ${WEB_BFF_GOOGLE_MAXIMUM_CONCURRENT_CALLS:16}
  quota-key-ring-path: ${WEB_BFF_QUOTA_KEY_RING_PATH:/var/run/secrets/hooshix/web-bff-quota.properties}
  oidc-quota:
    max-active-buckets: ${WEB_BFF_OIDC_QUOTA_MAX_ACTIVE_BUCKETS:0}
    max-new-buckets-per-minute: ${WEB_BFF_OIDC_QUOTA_MAX_NEW_BUCKETS_PER_MINUTE:0}
    minimum-memory-headroom-percent: ${WEB_BFF_OIDC_QUOTA_MINIMUM_MEMORY_HEADROOM_PERCENT:30}
    host-time-status-path: ${WEB_BFF_OIDC_QUOTA_HOST_TIME_STATUS_PATH:/run/status/web-bff/host-time-synchronized}
  route-audiences:
    "[/api/v1/authorization]": authorization-service
logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
