spring:
  application:
    name: web-bff
  main:
    banner-mode: "off"
  threads:
    virtual:
      enabled: true
  config:
    import: optional:configtree:/run/secrets/web-bff-redis/
server:
  port: ${WEB_BFF_HTTP_PORT:-1}
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 256KB
management:
  server:
    port: ${WEB_BFF_MANAGEMENT_PORT:9092}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,webBffReadiness
web-bff:
  runtime-enabled: ${WEB_BFF_RUNTIME_ENABLED:false}
  require-fetch-metadata: ${WEB_BFF_REQUIRE_FETCH_METADATA:true}
  public-origin: ${WEB_BFF_PUBLIC_ORIGIN:https://localhost}
  identity-target: ${WEB_BFF_IDENTITY_TARGET:dns:///identity-service.platform-apps.svc.cluster.local:9090}
  authorization-target: ${WEB_BFF_AUTHORIZATION_TARGET:dns:///authorization-service.platform-apps.svc.cluster.local:9090}
  redis-uri: ${WEB_BFF_REDIS_URI:redis://localhost:6379}
  locator-key-ring-path: ${WEB_BFF_LOCATOR_KEY_RING_PATH:/var/run/secrets/hooshix/web-bff-locator.properties}
  csrf-key-ring-path: ${WEB_BFF_CSRF_KEY_RING_PATH:/var/run/secrets/hooshix/web-bff-csrf.properties}
  refresh-encryption-key-ring-path: ${WEB_BFF_REFRESH_ENCRYPTION_KEY_RING_PATH:/var/run/secrets/hooshix/web-bff-refresh.properties}
  hmac-key-maximum-staleness: ${WEB_BFF_HMAC_KEY_MAXIMUM_STALENESS:PT5M}
  encryption-key-maximum-staleness: ${WEB_BFF_ENCRYPTION_KEY_MAXIMUM_STALENESS:PT1H}
  route-audiences:
    /api/v1/authorization: authorization-service
logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
