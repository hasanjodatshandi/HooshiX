groups:
  - name: web-bff
    rules:
      - alert: WebBffUnavailable
        expr: up{job="web-bff"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: Web BFF scrape target is unavailable
      - alert: WebBffHttp5xxRatioHigh
        expr: |
          sum(rate(http_server_requests_seconds_count{job="web-bff",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="web-bff"}[5m])), 0.001)
          > 0.02
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Web BFF HTTP 5xx ratio is elevated
      - alert: WebBffDependencyAdmissionRejected
        expr: increase(web_bff_dependency_admission_rejected_total{job="web-bff"}[5m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Web BFF downstream dependency admission is shedding requests
      - alert: WebBffGoogleOidcProviderUnavailable
        expr: increase(web_bff_oidc_provider_duration_seconds_count{job="web-bff",outcome="OIDC_UNAVAILABLE"}[5m]) > 5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Web BFF Google OIDC provider calls are repeatedly unavailable
      - alert: WebBffOidcQuotaSecurityHealthFailure
        expr: increase(web_bff_oidc_quota_total{job="web-bff",outcome=~"time_unhealthy|capacity_unhealthy|unavailable"}[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: Web BFF OIDC semantic quota failed closed on time, capacity, or transport health
      - alert: WebBffOidcQuotaDenialSpike
        expr: rate(web_bff_oidc_quota_total{job="web-bff",outcome="denied"}[5m]) > 5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Web BFF OIDC exact-client quota denial rate is elevated
      - alert: WebBffErasureWorkExhausted
        expr: increase(web_bff_erasure_exhausted_total{job="web-bff"}[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: Web BFF erasure participant exhausted finite retries
      - alert: WebBffErasureReceiptPublicationFailing
        expr: increase(web_bff_erasure_receipt_outbox_failures_total{job="web-bff"}[5m]) > 3
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Web BFF erasure receipt publication is repeatedly failing
