        '503': { $ref: '#/components/responses/DependencyUnavailable' }
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: __Host-sajtech-session
      description: HttpOnly same-origin session. Its value is never exposed in this contract or browser storage.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      description: Caller-generated UUIDv4 idempotency identity. Replays use the same value.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    ContactId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Current session-bound synchronizer token returned by a reviewed BFF response; do not persist it.
      schema: { type: string, minLength: 32, maxLength: 512 }
    OptionalCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required only when the anonymous-capable request carries an existing BFF session cookie; do not persist it.
      schema: { type: string, minLength: 32, maxLength: 512 }
    MembershipId: { name: membershipId, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV4' } }
    RoleId: { name: roleId, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV4' } }
    InvitationId: { name: invitationId, in: path, required: true, schema: { $ref: '#/components/schemas/UuidV4' } }
    PermissionKey: { name: permissionKey, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    ExpectedVersion: { name: expectedVersion, in: query, required: true, schema: { type: integer, minimum: 1, format: int64 } }
    PageSize: { name: pageSize, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
    PageToken: { name: pageToken, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 2048 } }
  schemas:
    UuidV4:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      example: 11111111-1111-4111-8111-111111111111
    LocalLoginRequest:
      type: object
      additionalProperties: false
      required: [channel, contact, password]
      example: { channel: EMAIL, contact: person@example.test, password: CorrectHorseBatteryStaple!2026 }
      properties:
        channel: { $ref: '#/components/schemas/RegistrationChannel' }
        contact: { type: string, minLength: 1, maxLength: 254, example: person@example.test }
        password: { type: string, minLength: 1, maxLength: 4096, writeOnly: true, example: CorrectHorseBatteryStaple!2026 }
    MfaProofRequest:
      example: { type: TOTP, code: '123456' }
      discriminator: { propertyName: type }
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, code]
          properties:
            type: { type: string, const: TOTP, example: TOTP }
            code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true, example: '123456' }
        - type: object
          additionalProperties: false
          required: [type, code]
          properties:
            type: { type: string, const: RECOVERY_CODE, example: RECOVERY_CODE }
            code: { type: string, pattern: '^[A-Z2-7]{4}(?:-[A-Z2-7]{4}){3}$', writeOnly: true, example: AAAA-BBBB-CCCC-DDDD }
    StartTotpEnrollmentRequest:
      type: object
      additionalProperties: false
      example: { currentProof: { type: TOTP, code: '123456' } }
      properties:
        currentProof:
          anyOf:
            - { $ref: '#/components/schemas/MfaProofRequest' }
            - { type: 'null' }
    ConfirmTotpEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [enrollmentChallenge, totpCode]
      example: { enrollmentChallenge: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY, totpCode: '123456' }
      properties:
        enrollmentChallenge: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true, example: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY }
        totpCode: { type: string, pattern: '^[0-9]{6}$', writeOnly: true, example: '123456' }
    MfaStatusResponse:
      type: object
      additionalProperties: false
      required: [totpEnabled, recoveryCodesRemaining]
      example: { totpEnabled: true, recoveryCodesRemaining: 10 }
      properties:
        totpEnabled: { type: boolean, example: true }
        recoveryCodesRemaining: { type: integer, minimum: 0, maximum: 10, example: 10 }
    TotpEnrollmentResponse:
      type: object
      additionalProperties: false
      required: [enrollmentChallenge, base32Secret, otpauthUri, expiresAt]
      example: { enrollmentChallenge: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY, base32Secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA, otpauthUri: 'otpauth://totp/SajTech%3Asynthetic?secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA&issuer=SajTech&algorithm=SHA256&digits=6&period=30', expiresAt: '2026-01-01T00:10:00Z' }
      properties:
        enrollmentChallenge: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', readOnly: true }
        base32Secret: { type: string, pattern: '^[A-Z2-7]{52}$', readOnly: true }
        otpauthUri: { type: string, pattern: '^otpauth://totp/', maxLength: 512, readOnly: true }
        expiresAt: { type: string, format: date-time }
    RecoveryCodesResponse:
      type: object
      additionalProperties: false
      required: [recoveryCodes]
      example: { recoveryCodes: [AAAA-BBBB-CCCC-DDDD, EEEE-FFFF-GGGG-HHHH, IIII-JJJJ-KKKK-LLLL, MMMM-NNNN-OOOO-PPPP, QQQQ-RRRR-SSSS-TTTT, UUUU-VVVV-WWWW-XXXX, YYYY-ZZZZ-2222-3333, '4444-5555-6666-7777', ABCD-EFGH-IJKL-MNOP, QRST-UVWX-YZ23-4567] }
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          readOnly: true
          items: { type: string, pattern: '^[A-Z2-7]{4}(?:-[A-Z2-7]{4}){3}$' }
    CreateTenantRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      example: { name: Sample Tenant, slug: sample-tenant }
      properties:
        name: { type: string, minLength: 1, maxLength: 120, example: Sample Tenant }
        slug:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])$'
          example: sample-tenant
    SelectTenantRequest:
      type: object
      additionalProperties: false
      required: [membershipId]
      example: { membershipId: 11111111-1111-4111-8111-111111111111 }
      properties: { membershipId: { $ref: '#/components/schemas/UuidV4' } }
    InviteRequest:
      type: object
      additionalProperties: false
      required: [targetContactId]
      example: { targetContactId: 11111111-1111-4111-8111-111111111111 }
      properties: { targetContactId: { $ref: '#/components/schemas/UuidV4' } }
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required: [name, permissionKeys]
      example: { name: Sample role, description: Synthetic role, permissionKeys: [document.read] }
      properties:
        name: { type: string, minLength: 1, maxLength: 80, example: Sample role }
        description:
          anyOf:
            - { type: string, maxLength: 500 }
            - { type: 'null' }
          example: Synthetic role
        permissionKeys: { type: array, maxItems: 200, items: { type: string, minLength: 1, maxLength: 128 }, example: [document.read] }
    UpdateRoleRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, name]
      example: { expectedVersion: 1, name: Sample role, description: Synthetic role }
      properties:
        expectedVersion: { type: integer, minimum: 1, format: int64, example: 1 }
        name: { type: string, minLength: 1, maxLength: 80, example: Sample role }
        description:
          anyOf:
            - { type: string, maxLength: 500 }
            - { type: 'null' }
          example: Synthetic role
    ReplacePermissionsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, permissionKeys, reason]
      example: { expectedVersion: 1, permissionKeys: [document.read], reason: Synthetic access review }
      properties:
        expectedVersion: { type: integer, minimum: 1, format: int64, example: 1 }
        permissionKeys: { type: array, maxItems: 200, items: { type: string, minLength: 1, maxLength: 128 }, example: [document.read] }
        reason: { type: string, minLength: 1, maxLength: 500, example: Synthetic access review }
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      example: { reason: Synthetic access review }
      properties: { reason: { type: string, minLength: 1, maxLength: 500, example: Synthetic access review } }
    OverrideRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      example: { decision: GRANT, reason: Synthetic access review }
      properties:
        decision: { type: string, enum: [GRANT, DENY], example: GRANT }
        reason: { type: string, minLength: 1, maxLength: 500, example: Synthetic access review }
    RegistrationChannel:
      type: string
      enum: [EMAIL, PHONE]
      example: EMAIL
    RegistrationLocale:
      type: string
      enum: [fa, en]
      example: en
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [channel, contact, password, locale, firstName, lastName]
      example: { channel: EMAIL, contact: person@example.test, password: CorrectHorseBatteryStaple!2026, locale: en, firstName: Sample, lastName: Person }
      properties:
        channel: { $ref: '#/components/schemas/RegistrationChannel' }
        contact:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: NFC-normalized Unicode code-point policy. No composition rule is imposed.
        locale: { $ref: '#/components/schemas/RegistrationLocale' }
        firstName:
          type: string
          minLength: 1
          maxLength: 120
        lastName:
          type: string
          minLength: 1
          maxLength: 120
        fatherName:
          anyOf:
            - { type: string, maxLength: 120 }
            - { type: 'null' }
    ResendRequest:
      type: object
      additionalProperties: false
      required: [channel, contact]
      example: { channel: EMAIL, contact: person@example.test }
      properties:
        channel: { $ref: '#/components/schemas/RegistrationChannel' }
        contact:
          type: string
          minLength: 1
          maxLength: 254
    ConfirmRequest:
      type: object
      additionalProperties: false
      required: [channel, contact, code]
      example: { channel: EMAIL, contact: person@example.test, code: '12345678' }
      properties:
        channel: { $ref: '#/components/schemas/RegistrationChannel' }
        contact:
          type: string
          minLength: 1
          maxLength: 254
        code:
          type: string
          minLength: 8
          maxLength: 8
          pattern: '^[0-9]{8}$'
          writeOnly: true
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      example: { currentPassword: ExistingPassword!2025, newPassword: CorrectHorseBatteryStaple!2026 }
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: NFC-normalized Unicode code-point policy. No composition rule is imposed.
    PasswordRecoveryRequest:
      type: object
      additionalProperties: false
      required: [channel, contact]
      example: { channel: EMAIL, contact: person@example.test }
      properties:
        channel: { $ref: '#/components/schemas/RegistrationChannel' }
        contact:
          type: string
          minLength: 1
          maxLength: 254
    PasswordRecoveryConfirmRequest:
      type: object
      additionalProperties: false
      required: [channel, contact, code, newPassword]
      example: { channel: EMAIL, contact: person@example.test, code: '12345678', newPassword: CorrectHorseBatteryStaple!2026 }
      properties:
        channel: { $ref: '#/components/schemas/RegistrationChannel' }
        contact:
          type: string
          minLength: 1
          maxLength: 254
        code:
          type: string
          minLength: 8
          maxLength: 8
          pattern: '^[0-9]{8}$'
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: NFC-normalized Unicode code-point policy. No composition rule is imposed.
        mfaProof:
          anyOf:
            - { $ref: '#/components/schemas/MfaProofRequest' }
            - { type: 'null' }
    ProfileResponse:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName]
      example: { id: 11111111-1111-4111-8111-111111111111, firstName: Sample, lastName: Person, fatherName: Example }
      properties:
        id: { $ref: '#/components/schemas/UuidV4' }
        firstName: { type: string, minLength: 1, maxLength: 120 }
        lastName: { type: string, minLength: 1, maxLength: 120 }
        fatherName:
          anyOf:
            - { type: string, maxLength: 120 }
            - { type: 'null' }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName]
      example: { firstName: Sample, lastName: Person, fatherName: Example }
      properties:
        firstName: { type: string, minLength: 1, maxLength: 120 }
        lastName: { type: string, minLength: 1, maxLength: 120 }
        fatherName:
          anyOf:
            - { type: string, maxLength: 120 }
            - { type: 'null' }
    ContactResponse:
      type: object
      additionalProperties: false
      required: [id, type, value, verified, primary]
      example: { id: 11111111-1111-4111-8111-111111111111, type: EMAIL, value: person@example.test, verified: true, primary: true }
      properties:
        id: { $ref: '#/components/schemas/UuidV4' }
        type: { $ref: '#/components/schemas/RegistrationChannel' }
        value: { type: string, minLength: 1, maxLength: 254 }
        verified: { type: boolean }
        primary: { type: boolean }
    AddContactRequest:
      type: object
      additionalProperties: false
      required: [type, value, locale]
      example: { type: EMAIL, value: alternate@example.test, locale: en }
      properties:
        type: { $ref: '#/components/schemas/RegistrationChannel' }
        value: { type: string, minLength: 1, maxLength: 254 }
        locale: { $ref: '#/components/schemas/RegistrationLocale' }
    VerifyContactRequest:
      type: object
      additionalProperties: false
      required: [code]
      example: { code: '12345678' }
      properties:
        code: { type: string, pattern: '^[0-9]{8}$', minLength: 8, maxLength: 8, writeOnly: true }
    CreatedContactResponse:
      type: object
      additionalProperties: false
      required: [id]
      example: { id: 11111111-1111-4111-8111-111111111111 }
      properties:
        id: { $ref: '#/components/schemas/UuidV4' }
    VerifiedResponse:
      type: object
      additionalProperties: false
      required: [verified]
      example: { verified: true }
      properties:
        verified: { type: boolean }
    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [accepted]
      example: { accepted: true }
      properties:
        accepted: { type: boolean }
    ConfirmedResponse:
      type: object
      additionalProperties: false
      required: [confirmed]
      example: { confirmed: true }
      properties:
        confirmed: { type: boolean }
    PasswordChangedResponse:
      type: object
      additionalProperties: false
      required: [changed, csrfToken]
      example: { changed: true, csrfToken: synthetic-csrf-token-not-a-secret }
      properties:
        changed: { type: boolean }
        csrfToken:
          type: string
          minLength: 32
          maxLength: 512
          description: Rotated in-memory CSRF token. It is not a refresh credential and must not be persisted.
    SessionResponse:
      type: object
      additionalProperties: false
      required: [csrfToken, mode]
      example: { csrfToken: synthetic-csrf-token-not-a-secret, mode: PREAUTH }
      properties:
        csrfToken: { type: string, minLength: 32, maxLength: 512, description: In-memory CSRF token; do not persist., example: synthetic-csrf-token-not-a-secret }
        mode: { type: string, enum: [PREAUTH, MFA_PREAUTH, AUTHENTICATED_ONBOARDING, TENANT_AUTHENTICATED], example: PREAUTH }
    SessionStateResponse:
      type: object
      additionalProperties: false
      required: [mode, authenticated, tenantSelected]
      example: { mode: TENANT_AUTHENTICATED, authenticated: true, tenantSelected: true }
      properties:
        mode: { type: string, enum: [PREAUTH, MFA_PREAUTH, AUTHENTICATED_ONBOARDING, TENANT_AUTHENTICATED], example: TENANT_AUTHENTICATED }
        authenticated: { type: boolean, example: true }
        tenantSelected: { type: boolean, example: true }
    TenantChoice:
      type: object
      additionalProperties: false
      required: [tenantId, membershipId, name, slug]
      example: { tenantId: 11111111-1111-4111-8111-111111111111, membershipId: 22222222-2222-4222-8222-222222222222, name: Sample Tenant, slug: sample-tenant }
      properties:
        tenantId: { $ref: '#/components/schemas/UuidV4' }
        membershipId: { $ref: '#/components/schemas/UuidV4' }
        name: { type: string, maxLength: 120, example: Sample Tenant }
        slug: { type: string, maxLength: 63, example: sample-tenant }
    TenantListResponse:
      type: object
      additionalProperties: false
      required: [tenants]
      example: { tenants: [{ tenantId: 11111111-1111-4111-8111-111111111111, membershipId: 22222222-2222-4222-8222-222222222222, name: Sample Tenant, slug: sample-tenant }], suggestedMembershipId: 22222222-2222-4222-8222-222222222222 }
      properties:
        tenants: { type: array, items: { $ref: '#/components/schemas/TenantChoice' } }
        suggestedMembershipId: { anyOf: [{ $ref: '#/components/schemas/UuidV4' }, { type: 'null' }] }
    TenantCreatedResponse:
      type: object
      additionalProperties: false
      required: [tenantId, membershipId, lifecycle]
      example: { tenantId: 11111111-1111-4111-8111-111111111111, membershipId: 22222222-2222-4222-8222-222222222222, lifecycle: ACTIVE }
      properties:
        tenantId: { $ref: '#/components/schemas/UuidV4' }
        membershipId: { $ref: '#/components/schemas/UuidV4' }
        lifecycle: { type: string, example: ACTIVE }
    TenantSelectionResponse:
      type: object
      additionalProperties: false
      required: [csrfToken, tenantId, membershipId, mode]
      example: { csrfToken: synthetic-csrf-token-not-a-secret, tenantId: 11111111-1111-4111-8111-111111111111, membershipId: 22222222-2222-4222-8222-222222222222, mode: TENANT_AUTHENTICATED }
      properties:
        csrfToken: { type: string, minLength: 32, maxLength: 512, example: synthetic-csrf-token-not-a-secret }
        tenantId: { $ref: '#/components/schemas/UuidV4' }
        membershipId: { $ref: '#/components/schemas/UuidV4' }
        mode: { type: string, enum: [TENANT_AUTHENTICATED], example: TENANT_AUTHENTICATED }
    InvitationCreatedResponse:
      type: object
      additionalProperties: false
      required: [invitationId, expiresAt]
      example: { invitationId: 11111111-1111-4111-8111-111111111111, expiresAt: '2030-01-01T00:00:00Z' }
      properties:
        invitationId: { $ref: '#/components/schemas/UuidV4' }
        expiresAt: { type: string, format: date-time, example: '2030-01-01T00:00:00Z' }
    AcceptedInvitationResponse:
      type: object
      additionalProperties: false
      required: [tenantId, membershipId]
      example: { tenantId: 11111111-1111-4111-8111-111111111111, membershipId: 22222222-2222-4222-8222-222222222222 }
      properties:
        tenantId: { $ref: '#/components/schemas/UuidV4' }
        membershipId: { $ref: '#/components/schemas/UuidV4' }
    RemovalResultResponse:
      type: object
      additionalProperties: false
      required: [accepted, mode]
      example: { accepted: true, csrfToken: synthetic-csrf-token-not-a-secret, mode: AUTHENTICATED_ONBOARDING }
      properties:
        accepted: { type: boolean, example: true }
        csrfToken:
          anyOf:
            - { type: string, minLength: 32, maxLength: 512 }
            - { type: 'null' }
          example: synthetic-csrf-token-not-a-secret
        mode: { type: string, enum: [AUTHENTICATED_ONBOARDING, TENANT_AUTHENTICATED], example: AUTHENTICATED_ONBOARDING }
    PermissionResponse:
      type: object
      additionalProperties: false
      required: [key, scope, lifecycle]
      example: { key: document.read, scope: TENANT, lifecycle: ACTIVE }
      properties:
        key: { type: string, maxLength: 128, example: document.read }
        scope: { type: string, example: TENANT }
        lifecycle: { type: string, example: ACTIVE }
    RoleResponse:
      type: object
      additionalProperties: false
      required: [roleId, name, kind, lifecycle, version, permissions]
      example: { roleId: 11111111-1111-4111-8111-111111111111, name: Sample role, description: Synthetic role, kind: CUSTOM, lifecycle: ACTIVE, version: 1, permissions: [document.read] }
      properties:
        roleId: { $ref: '#/components/schemas/UuidV4' }
        name: { type: string, maxLength: 80, example: Sample role }
        description:
          anyOf:
            - { type: string, maxLength: 500 }
            - { type: 'null' }
          example: Synthetic role
        kind: { type: string, example: CUSTOM }
        lifecycle: { type: string, example: ACTIVE }
        version: { type: integer, minimum: 1, format: int64, example: 1 }
        permissions: { type: array, maxItems: 200, items: { type: string, minLength: 1, maxLength: 128 }, example: [document.read] }
    RolePageResponse:
      type: object
      additionalProperties: false
      required: [roles, nextPageToken]
      example: { roles: [{ roleId: 11111111-1111-4111-8111-111111111111, name: Sample role, kind: CUSTOM, lifecycle: ACTIVE, version: 1, permissions: [document.read] }], nextPageToken: next-page }
      properties:
        roles: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/RoleResponse' } }
        nextPageToken: { type: string, maxLength: 2048, example: next-page }
    OverrideResponse:
      type: object
      additionalProperties: false
      required: [permissionKey, decision]
      example: { permissionKey: document.read, decision: GRANT }
      properties:
        permissionKey: { type: string, maxLength: 128, example: document.read }
        decision: { type: string, enum: [GRANT, DENY], example: GRANT }
    MembershipAuthorizationResponse:
      type: object
      additionalProperties: false
      required: [membershipId, roleIds, overrides]
      example: { membershipId: 11111111-1111-4111-8111-111111111111, roleIds: [22222222-2222-4222-8222-222222222222], overrides: [{ permissionKey: document.read, decision: GRANT }] }
      properties:
        membershipId: { $ref: '#/components/schemas/UuidV4' }
        roleIds: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/UuidV4' } }
        overrides: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/OverrideResponse' } }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      example: { type: urn:hooshix:problem:invalid-request, title: Invalid request, status: 400, code: INVALID_REQUEST, instance: /api/v1/example }
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,63}$'
        instance:
          type: string
          maxLength: 1024
  responses:
    InvalidRequest:
      description: Request validation failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidSession:
      description: A supplied browser session is invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Browser-origin or session-bound request protection rejected the request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RegistrationRejected:
      description: Registration precondition was not satisfied. Response is non-enumerating.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PasswordRejected:
      description: Password lifecycle precondition was not satisfied without exposing account existence or credential details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Request exceeded the public body bound.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Multipart public requests are not supported.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: The applicable semantic security quota was exceeded.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DependencyUnavailable:
      description: The BFF runtime or an authoritative downstream dependency is unavailable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: Unexpected BFF failure with no implementation detail exposure.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
