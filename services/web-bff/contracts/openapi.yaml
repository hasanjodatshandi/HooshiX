openapi: 3.1.0
info:
  title: HooshiX Web BFF Public API
  version: 1.3.0
  description: Canonical browser-facing REST contract owned by Web BFF. All examples use synthetic .test identities and non-production placeholder credentials.
servers:
  - url: /
security:
  - BrowserSession: []
paths:
  /api/v1/identity/registration:
    post:
      operationId: registerLocalIdentity
      summary: Start local account registration
      x-hooshix-consumer-example: { method: POST, path: /api/v1/identity/registration, body: { channel: EMAIL, contact: person@example.test, password: CorrectHorseBatteryStaple!2026, locale: en, firstName: Sample, lastName: Person } }
      description: Same-origin browser request. Trusted client-address context is injected by the approved edge.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OptionalCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Registration handoff accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/RegistrationRejected' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/identity/registration/resend:
    post:
      operationId: resendRegistrationVerification
      summary: Request another registration verification challenge
      security: []
      x-hooshix-consumer-example: { method: POST, path: /api/v1/identity/registration/resend, body: { channel: EMAIL, contact: person@example.test } }
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OptionalCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendRequest'
      responses:
        '202':
          description: Resend request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/RegistrationRejected' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/identity/registration/confirm:
    post:
      operationId: confirmRegistration
      summary: Confirm registration verification challenge
      security: []
      x-hooshix-consumer-example: { method: POST, path: /api/v1/identity/registration/confirm, body: { channel: EMAIL, contact: person@example.test, code: '12345678' } }
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OptionalCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmedResponse'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/RegistrationRejected' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/identity/profile:
    get:
      operationId: getIdentityProfile
      summary: Read the authenticated user's profile
      security: [{ BrowserSession: [] }]
      x-hooshix-consumer-example: { method: GET, path: /api/v1/identity/profile }
      responses:
        '200':
          description: Current profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    put:
      operationId: updateIdentityProfile
      summary: Canonically update the authenticated user's profile
      security: [{ BrowserSession: [] }]
      x-hooshix-consumer-example: { method: PUT, path: /api/v1/identity/profile, body: { firstName: Sample, lastName: Person } }
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Profile updated idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/identity/contacts:
    get:
      operationId: listIdentityContacts
      summary: List the authenticated user's bounded active contact set
      security: [{ BrowserSession: [] }]
      x-hooshix-consumer-example: { method: GET, path: /api/v1/identity/contacts }
      responses:
        '200':
          description: Active contacts.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items: { $ref: '#/components/schemas/ContactResponse' }
                example:
                  - id: 11111111-1111-4111-8111-111111111111
                    type: EMAIL
                    value: person@example.test
                    verified: true
                    primary: true
        '401': { $ref: '#/components/responses/InvalidSession' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    post:
      operationId: addIdentityContact
      summary: Add an unverified contact and enqueue its verification challenge
      security: [{ BrowserSession: [] }]
      x-hooshix-consumer-example: { method: POST, path: /api/v1/identity/contacts, body: { type: EMAIL, value: alternate@example.test, locale: en } }
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddContactRequest' }
      responses:
        '200':
          description: Contact challenge accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedContactResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/RegistrationRejected' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/identity/contacts/{id}/resend:
    post:
      operationId: resendIdentityContactVerification
      summary: Replace an eligible contact verification challenge
      security: [{ BrowserSession: [] }]
      x-hooshix-consumer-example: { method: POST, path: /api/v1/identity/contacts/11111111-1111-4111-8111-111111111111/resend }
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          description: Resend accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/RegistrationRejected' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/identity/contacts/{id}/verify:
    post:
      operationId: verifyIdentityContact
      summary: Confirm an eight-digit contact verification challenge
      security: [{ BrowserSession: [] }]
      x-hooshix-consumer-example: { method: POST, path: /api/v1/identity/contacts/11111111-1111-4111-8111-111111111111/verify, body: { code: '12345678' } }
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ContactId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyContactRequest' }
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifiedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/RegistrationRejected' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/identity/contacts/{id}/primary:
    post:
      operationId: setPrimaryIdentityContact
      summary: Set a verified contact primary with recent authentication
      security: [{ BrowserSession: [] }]
      x-hooshix-consumer-example: { method: POST, path: /api/v1/identity/contacts/11111111-1111-4111-8111-111111111111/primary }
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          description: Primary contact changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/RegistrationRejected' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/identity/contacts/{id}:
    delete:
      operationId: removeIdentityContact
      summary: Remove a non-primary contact while retaining a verified contact
      security: [{ BrowserSession: [] }]
      x-hooshix-consumer-example: { method: DELETE, path: /api/v1/identity/contacts/11111111-1111-4111-8111-111111111111 }
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          description: Contact removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/RegistrationRejected' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/identity/mfa:
    get:
      operationId: getIdentityMfaStatus
      summary: Read the authenticated user's MFA state
      security: [{ BrowserSession: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      x-hooshix-consumer-example: { method: GET, path: /api/v1/identity/mfa }
      responses:
        '200': { description: Current MFA state., content: { application/json: { schema: { $ref: '#/components/schemas/MfaStatusResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/identity/mfa/totp/enrollment:
    post:
      operationId: startIdentityTotpEnrollment
      summary: Start initial TOTP enrollment or an authenticated replacement
      description: Returns the Base32 secret once for authenticator configuration. Replacing active TOTP requires a current MFA proof.
      security: [{ BrowserSession: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StartTotpEnrollmentRequest' } } }
      x-hooshix-consumer-example: { method: POST, path: /api/v1/identity/mfa/totp/enrollment, body: { currentProof: { type: TOTP, code: '123456' } } }
      responses:
        '200': { description: Pending TOTP enrollment., content: { application/json: { schema: { $ref: '#/components/schemas/TotpEnrollmentResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/identity/mfa/totp/enrollment/confirm:
    post:
      operationId: confirmIdentityTotpEnrollment
      summary: Confirm a pending TOTP enrollment
      description: Recovery codes are returned exactly once and must be stored offline by the user.
      security: [{ BrowserSession: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConfirmTotpEnrollmentRequest' } } } }
      x-hooshix-consumer-example: { method: POST, path: /api/v1/identity/mfa/totp/enrollment/confirm, body: { enrollmentChallenge: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY, totpCode: '123456' } }
      responses:
        '200': { description: TOTP enabled and recovery codes issued once., content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCodesResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/identity/mfa/totp:
    delete:
      operationId: disableIdentityTotp
      summary: Disable TOTP after a current MFA proof
      security: [{ BrowserSession: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaProofRequest' } } } }
      x-hooshix-consumer-example: { method: DELETE, path: /api/v1/identity/mfa/totp, body: { type: TOTP, code: '123456' } }
      responses:
        '200': { description: TOTP disabled and browser security state rotated. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/identity/mfa/recovery-codes/rotate:
    post:
      operationId: rotateIdentityMfaRecoveryCodes
      summary: Revoke and replace all unused MFA recovery codes
      description: The replacement codes are returned exactly once.
      security: [{ BrowserSession: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaProofRequest' } } } }
      x-hooshix-consumer-example: { method: POST, path: /api/v1/identity/mfa/recovery-codes/rotate, body: { type: TOTP, code: '123456' } }
      responses:
        '200': { description: Replacement recovery codes issued once., content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCodesResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/password/change:
    post:
      operationId: changePassword
      summary: Change the authenticated user's local password
      x-hooshix-consumer-example: { method: POST, path: /api/v1/password/change, body: { currentPassword: ExistingPassword!2025, newPassword: CorrectHorseBatteryStaple!2026 } }
      description: The browser supplies no refresh credential. The BFF uses and atomically rotates its server-held refresh credential and CSRF state.
      security: [{ BrowserSession: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Password and browser security state changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordChangedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/PasswordRejected' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/password/recovery/request:
    post:
      operationId: requestPasswordRecovery
      summary: Request a non-enumerating password-recovery challenge
      x-hooshix-consumer-example: { method: POST, path: /api/v1/password/recovery/request, body: { channel: EMAIL, contact: person@example.test } }
      description: The trusted edge injects exact client-address context; browser input cannot supply it.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OptionalCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordRecoveryRequest' }
      responses:
        '200':
          description: Request accepted regardless of account existence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/password/recovery/confirm:
    post:
      operationId: confirmPasswordRecovery
      summary: Confirm a password-recovery challenge and reset the password
      security: []
      x-hooshix-consumer-example: { method: POST, path: /api/v1/password/recovery/confirm, body: { channel: EMAIL, contact: person@example.test, code: '12345678', newPassword: CorrectHorseBatteryStaple!2026 } }
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OptionalCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordRecoveryConfirmRequest' }
      responses:
        '200':
          description: Password reset result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/PasswordRejected' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/session/bootstrap:
    post:
      operationId: bootstrapBrowserSession
      summary: Create a pre-authentication browser session
      description: Creates an HttpOnly session cookie and returns an in-memory CSRF token. Origin and Fetch Metadata are required.
      security: []
      parameters: [{ $ref: '#/components/parameters/OptionalCsrfToken' }]
      x-hooshix-consumer-example: { method: POST, path: /api/v1/auth/session/bootstrap }
      responses:
        '201':
          description: Pre-authentication session created.
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/session/csrf:
    post:
      operationId: rotateBrowserCsrf
      summary: Recover an in-memory CSRF token after browser document reload
      description: Rotates the server-side browser session and CSRF state under exact same-origin Origin and Fetch Metadata checks. Existing Identity refresh credentials and MFA challenges remain encrypted server-side and are never returned to browser JavaScript.
      security: []
      parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/OptionalCsrfToken' }]
      x-hooshix-consumer-example: { method: POST, path: /api/v1/auth/session/csrf }
      responses:
        '200':
          description: Rotated browser session and in-memory CSRF token.
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/local:
    post:
      operationId: loginWithLocalPassword
      summary: Authenticate a pre-authentication browser session with a local password
      description: Browser JavaScript sends neither trusted client address nor refresh credential; the approved edge and BFF retain those authorities.
      security: [{ BrowserSession: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocalLoginRequest' } } } }
      x-hooshix-consumer-example: { method: POST, path: /api/v1/auth/local, body: { channel: EMAIL, contact: person@example.test, password: CorrectHorseBatteryStaple!2026 } }
      responses:
        '200': { description: Authenticated session state., content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/RegistrationRejected' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/auth/mfa/complete:
    post:
      operationId: completeBrowserMfaAuthentication
      summary: Complete a cookie-bound MFA login challenge
      description: The opaque Identity challenge remains encrypted in the server-side BFF session and is never returned to browser JavaScript.
      security: [{ BrowserSession: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }, { $ref: '#/components/parameters/CsrfToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaProofRequest' } } } }
      x-hooshix-consumer-example: { method: POST, path: /api/v1/auth/mfa/complete, body: { type: TOTP, code: '123456' } }
      responses:
        '200': { description: MFA-authenticated browser session state., content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/auth/logout:
    post:
