apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "web-bff.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "web-bff.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-apps
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: {{ required "ambient.waypointName is required" .Values.ambient.waypointName | quote }}
      ports: [{protocol: TCP, port: 15008}]
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "edge.namespace is required" .Values.edge.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml (required "edge.podLabels is required" .Values.edge.podLabels) | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.service.applicationPort }}}, {protocol: TCP, port: 15008}]
    {{- if .Values.observability.metrics.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "metrics namespace is required" .Values.observability.metrics.prometheus.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.observability.metrics.prometheus.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.service.managementPort }}}, {protocol: TCP, port: 15008}]
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-apps
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: platform-apps-waypoint
      ports: [{protocol: TCP, port: 15008}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.identity.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.identity.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.identity.port }}}, {protocol: TCP, port: 15008}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.authorization.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.authorization.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.authorization.port }}}, {protocol: TCP, port: 15008}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.redis.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.redis.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.redis.port }}}, {protocol: TCP, port: 15008}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.database.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.database.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.database.port }}}, {protocol: TCP, port: 15008}]
    {{- if .Values.runtime.erasureRuntimeEnabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.kafka.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.kafka.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.kafka.port }}}, {protocol: TCP, port: 15008}]
    {{- end }}
    {{- if .Values.googleOidc.enabled }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["0.0.0.0/8", "10.0.0.0/8", "100.64.0.0/10", "127.0.0.0/8", "169.254.0.0/16", "172.16.0.0/12", "192.0.0.0/24", "192.168.0.0/16", "198.18.0.0/15", "224.0.0.0/4", "240.0.0.0/4"]
        - ipBlock:
            cidr: ::/0
            except: ["::/128", "::1/128", "fc00::/7", "fe80::/10", "ff00::/8"]
      ports: [{protocol: TCP, port: 443}]
    {{- end }}
    {{- if .Values.observability.tracing.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "tracing namespace is required" .Values.observability.tracing.collector.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.observability.tracing.collector.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.observability.tracing.collector.port }}}, {protocol: TCP, port: 15008}]
    {{- end }}
