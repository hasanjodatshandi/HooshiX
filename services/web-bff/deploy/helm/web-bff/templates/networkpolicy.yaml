apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "web-bff.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "web-bff.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "edge.namespace is required" .Values.edge.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml (required "edge.podLabels is required" .Values.edge.podLabels) | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.service.applicationPort }}}]
    {{- if .Values.observability.metrics.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "metrics namespace is required" .Values.observability.metrics.prometheus.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.observability.metrics.prometheus.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.service.managementPort }}}]
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.identity.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.identity.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.identity.port }}}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.authorization.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.authorization.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.authorization.port }}}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.redis.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.redis.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.redis.port }}}]
    {{- if .Values.observability.tracing.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "tracing namespace is required" .Values.observability.tracing.collector.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.observability.tracing.collector.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.observability.tracing.collector.port }}}]
    {{- end }}