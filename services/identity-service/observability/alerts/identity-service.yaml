groups:
  - name: identity-service
    rules:
      - alert: IdentityRegistrationUnavailableRateHigh
        expr: |
          sum(rate(identity_registration_duration_seconds_count{outcome=~"DEPENDENCY_UNAVAILABLE|QUOTA_UNAVAILABLE|QUOTA_TIME_SOURCE_UNHEALTHY|QUOTA_CAPACITY_UNHEALTHY"}[5m]))
          /
          clamp_min(sum(rate(identity_registration_duration_seconds_count[5m])), 0.001)
          > 0.01
        for: 10m
        labels:
          severity: page
          service: identity-service
        annotations:
          summary: Identity registration security-dependency unavailable rate is above 1%
      - alert: IdentityRegistrationQuotaDenialSpike
        expr: sum(rate(identity_registration_duration_seconds_count{outcome="QUOTA_EXCEEDED"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: Identity semantic quota denial rate is elevated
      - alert: IdentityRegistrationSaturationHigh
        expr: identity_registration_in_flight > 100
        for: 5m
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: Identity registration in-flight work is near the configured transport bound
      - alert: IdentityPasswordHashSaturationHigh
        expr: identity_password_hash_in_flight > 0
        for: 10m
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: Identity password hashing remains continuously occupied
      - alert: IdentityAuthenticationUnavailableRateHigh
        expr: |
          sum(rate(identity_authentication_duration_seconds_count{outcome=~"QUOTA_UNAVAILABLE|QUOTA_TIME_SOURCE_UNHEALTHY|QUOTA_CAPACITY_UNHEALTHY|AUTHENTICATION_OVERLOADED|SIGNING_KEY_UNAVAILABLE|SESSION_STATE_INVALID"}[5m]))
          /
          clamp_min(sum(rate(identity_authentication_duration_seconds_count[5m])), 0.001)
          > 0.01
        for: 10m
        labels:
          severity: page
          service: identity-service
        annotations:
          summary: Identity authentication security dependency or capacity unavailable rate is above 1%
      - alert: IdentityAuthenticationSaturationHigh
        expr: identity_authentication_in_flight > 100
        for: 5m
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: Identity authentication in-flight work is near the configured transport bound
      - alert: IdentityPasswordVerificationSaturationHigh
        expr: identity_password_verify_in_flight > 0
        for: 10m
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: Identity password verification remains continuously occupied
      - alert: IdentityPasswordLifecycleUnavailableRateHigh
        expr: |
          sum(rate(identity_password_lifecycle_duration_seconds_count{outcome=~"DEPENDENCY_UNAVAILABLE|QUOTA_UNAVAILABLE|QUOTA_TIME_SOURCE_UNHEALTHY|QUOTA_CAPACITY_UNHEALTHY|SESSION_STATE_INVALID|INTERNAL"}[5m]))
          /
          clamp_min(sum(rate(identity_password_lifecycle_duration_seconds_count[5m])), 0.001)
          > 0.01
        for: 10m
        labels:
          severity: page
          service: identity-service
        annotations:
          summary: Identity password lifecycle unavailable or internal-error rate is above 1%
      - alert: IdentityPasswordLifecycleSaturationHigh
        expr: identity_password_lifecycle_in_flight > 100
        for: 5m
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: Identity password lifecycle in-flight work is near the transport bound
      - alert: IdentityProfileInternalErrorRateHigh
        expr: |
          sum(rate(identity_profile_duration_seconds_count{outcome="INTERNAL"}[5m]))
          /
          clamp_min(sum(rate(identity_profile_duration_seconds_count[5m])), 0.001)
          > 0.01
        for: 10m
        labels:
          severity: page
          service: identity-service
        annotations:
          summary: Identity Profile/Contact internal-error rate is above 1%
      - alert: IdentityProfileSaturationHigh
        expr: identity_profile_in_flight > 100
        for: 5m
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: Identity Profile/Contact in-flight work is near the transport bound
      - alert: IdentityMfaUnavailableRateHigh
        expr: |
          sum(rate(identity_mfa_duration_seconds_count{outcome=~"QUOTA_UNAVAILABLE|QUOTA_TIME_SOURCE_UNHEALTHY|QUOTA_CAPACITY_UNHEALTHY|STATE_CONFLICT|INTERNAL"}[5m]))
          /
          clamp_min(sum(rate(identity_mfa_duration_seconds_count[5m])), 0.001)
          > 0.01
        for: 10m
        labels:
          severity: page
          service: identity-service
        annotations:
          summary: Identity MFA security dependency or state unavailable rate is above 1%
      - alert: IdentityMfaProofRejectionSpike
        expr: rate(identity_mfa_proof_rejections_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: Identity MFA proof rejection rate is elevated
      - alert: IdentityMfaSaturationHigh
        expr: identity_mfa_in_flight > 100
        for: 5m
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: Identity MFA in-flight work is near the transport bound
      - alert: IdentityExternalIdentityInternalErrorRateHigh
        expr: |
          sum(rate(identity_external_identity_duration_seconds_count{outcome=~"SESSION_STATE_INVALID|INTERNAL"}[5m]))
          /
          clamp_min(sum(rate(identity_external_identity_duration_seconds_count[5m])), 0.001)
          > 0.01
        for: 10m
        labels:
          severity: page
          service: identity-service
        annotations:
          summary: Identity external-identity state or internal-error rate is above 1%
      - alert: IdentityExternalIdentitySaturationHigh
        expr: identity_external_identity_in_flight > 100
        for: 5m
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: Identity external-identity in-flight work is near the transport bound
      - alert: IdentityGrpcAdmissionRejected
        expr: rate(identity_grpc_admission_rejected_total[5m]) > 0
        for: 5m
        labels:
          severity: page
          service: identity-service
        annotations:
          summary: Identity global gRPC admission is rejecting work
      - alert: IdentityTenantUnavailableRateHigh
        expr: |
          sum(rate(identity_tenant_duration_seconds_count{outcome=~"AUTHORIZATION_UNAVAILABLE|SESSION_STATE_INVALID"}[5m]))
          /
          clamp_min(sum(rate(identity_tenant_duration_seconds_count[5m])), 0.001)
          > 0.01
        for: 10m
        labels:
          severity: page
          service: identity-service
        annotations:
          summary: Identity tenant lifecycle unavailable rate is above 1%
      - alert: IdentityGrpcAdmissionSaturationHigh
        expr: identity_grpc_admission_in_flight / clamp_min(identity_grpc_admission_limit, 1) > 0.8
        for: 5m
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: Identity global gRPC admission utilization is above 80%
      - alert: IdentityRefreshReuseDetected
        expr: increase(identity_refresh_reuse_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: Identity detected reuse of a rotated refresh credential
      - alert: IdentityAuthorizationOutboxPending15Minutes
        expr: identity_authorization_outbox_oldest_pending_age_seconds >= 900
        for: 0m
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: Identity Authorization outbox has unresolved work older than 15 minutes
      - alert: IdentityAuthorizationOutboxPendingOneHour
        expr: identity_authorization_outbox_oldest_pending_age_seconds >= 3600
        for: 0m
        labels:
          severity: page
          service: identity-service
        annotations:
          summary: Identity Authorization outbox has unresolved work older than one hour
      - alert: IdentityAuthorizationOutboxDefinitiveFailure
        expr: sum(increase(identity_authorization_outbox_definitive_failures_total[5m])) > 0
        for: 0m
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: Identity Authorization outbox recorded a definitive command failure
      - alert: IdentityInvitationExpiryWorkerFailures
        expr: increase(identity_invitation_expiry_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: Identity invitation expiry worker failed during the last five minutes
      - alert: IdentityErasureWorkExhausted
        expr: |
          sum(increase({job="identity-service",__name__=~"identity_erasure_(outbox|participant|receipt)_exhausted_total"}[5m])) > 0
        for: 0m
        labels:
          severity: page
          service: identity-service
        annotations:
          summary: Identity erasure coordination or participant work exhausted finite retries
      - alert: IdentityErasureReceiptPublicationFailing
        expr: increase(identity_erasure_receipt_outbox_failures_total{job="identity-service"}[5m]) > 3
        for: 2m
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: Identity erasure receipt publication is repeatedly failing
      - alert: IdentityErasureRequestInFlightTooLong
        expr: identity_erasure_in_flight{job="identity-service"} > 0
        for: 1h
        labels:
          severity: warning
          service: identity-service
        annotations:
          summary: At least one Identity erasure request has remained in flight for one hour
