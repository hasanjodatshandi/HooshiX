replicaCount: 1
image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent
serviceAccount:
  name: identity-service
service:
  grpcPort: 9090
  managementPort: 9092
runtime:
  registrationRuntimeEnabled: false
  maxConcurrentCallsPerConnection: 128
  argon2MaxConcurrentHashes: 0
  compromisedPasswordMaxInFlight: 32
  phoneRegistrationEnabled: false
  notificationDispatchEnabled: true
  temporaryStorageLimit: 256Mi
resources:
  requests:
    cpu: 200m
    memory: 384Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "2"
    memory: 1Gi
    ephemeral-storage: 512Mi
database:
  jdbcUrl: ""
  namespace: platform-data
  podLabels:
    app.kubernetes.io/name: identity-postgresql
  port: 5432
  runtimeSecretName: ""
  migrationSecretName: ""
quota:
  redis:
    namespace: platform-data
    podLabels:
      app.kubernetes.io/name: security-redis
    port: 6379
    connectionSecretName: ""
  maxActiveBuckets: 0
  maxNewBucketsPerMinute: 0
  minimumMemoryHeadroomPercent: 30
  hostTimeStatus:
    configMapName: ""
secrets:
  fingerprintSecretName: ""
  challengeSecretName: ""
  handoffSecretName: ""
  quotaKeySecretName: ""
webBff:
  namespace: platform-apps
  podLabels:
    app.kubernetes.io/name: web-bff
  principal: prod.sajtech.internal/ns/platform-apps/sa/web-bff
compromisedPassword:
  namespace: platform-apps
  podLabels:
    app.kubernetes.io/name: compromised-password-service
  port: 9090
  target: dns:///compromised-password-service.platform-apps.svc.cluster.local:9090
notification:
  namespace: platform-apps
  podLabels:
    app.kubernetes.io/name: notification-service
  port: 9090
  target: dns:///notification-service.platform-apps.svc.cluster.local:9090
observability:
  tracing:
    enabled: true
    otlpEndpoint: ""
    collector:
      namespace: ""
      podLabels: {}
      port: 4318
  metrics:
    enabled: true
    prometheus:
      namespace: ""
      podLabels: {}
      principal: ""
