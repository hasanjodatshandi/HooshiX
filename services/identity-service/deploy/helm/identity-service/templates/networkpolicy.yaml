apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "identity-service.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "identity-service.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.webBff.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.webBff.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.grpcPort }}
        - protocol: TCP
          port: 15008
    {{- if .Values.observability.metrics.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "metrics namespace is required" .Values.observability.metrics.prometheus.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.observability.metrics.prometheus.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.managementPort }}
        - protocol: TCP
          port: 15008
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-apps
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: platform-apps-waypoint
      ports: [{protocol: TCP, port: 15008}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.database.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.database.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.database.port }}}, {protocol: TCP, port: 15008}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.quota.redis.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.quota.redis.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.quota.redis.port }}}, {protocol: TCP, port: 15008}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.compromisedPassword.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.compromisedPassword.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.compromisedPassword.port }}}, {protocol: TCP, port: 15008}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.notification.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.notification.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.notification.port }}}, {protocol: TCP, port: 15008}]
    {{- if .Values.runtime.tenantRuntimeEnabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.authorization.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.authorization.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.authorization.port }}}, {protocol: TCP, port: 15008}]
    {{- end }}
    {{- if .Values.observability.tracing.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "tracing namespace is required" .Values.observability.tracing.collector.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.observability.tracing.collector.podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.observability.tracing.collector.port }}}, {protocol: TCP, port: 15008}]
    {{- end }}
