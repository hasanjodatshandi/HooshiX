apiVersion: v1
kind: Service
metadata:
  name: {{ include "identity-service.name" . }}
  labels:
    {{- include "identity-service.labels" . | nindent 4 }}
    istio.io/use-waypoint: {{ required "ambient.waypointName is required" .Values.ambient.waypointName | quote }}
spec:
  type: ClusterIP
  selector:
    {{- include "identity-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
    {{- if .Values.runtime.notificationResultRuntimeEnabled }}
    - name: notification-result
      port: {{ .Values.service.notificationResultGrpcPort }}
      targetPort: notification-result
      protocol: TCP
    {{- end }}
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management
      protocol: TCP
