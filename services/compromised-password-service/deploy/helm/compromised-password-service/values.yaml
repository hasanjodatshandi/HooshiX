replicaCount: 1

image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  name: compromised-password-service

service:
  grpcPort: 9090
  managementPort: 9091

runtime:
  maxConcurrentLookups: 32
  temporaryStorageLimit: 256Mi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "1"
    memory: 768Mi
    ephemeral-storage: 512Mi

dataset:
  existingClaim: ""
  filename: corpus.sqlite
  manifestFilename: release-manifest.json
  requiredSourceKind: HIBP_PWNED_PASSWORDS_COMPLETE_DOWNLOAD
  maxPrefixCardinality: 0
  maxSerializedResponseBytes: 0

identity:
  namespace: platform-apps
  podLabels:
    app.kubernetes.io/name: identity-service
  principal: prod.sajtech.internal/ns/platform-apps/sa/identity-service

observability:
  tracing:
    enabled: true
    otlpEndpoint: ""
    collector:
      namespace: ""
      podLabels: {}
      port: 4318
  metrics:
    enabled: true
    prometheus:
      namespace: ""
      podLabels: {}
      principal: ""
