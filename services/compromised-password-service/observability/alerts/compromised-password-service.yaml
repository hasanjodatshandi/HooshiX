groups:
  - name: compromised-password-service
    rules:
      - alert: CompromisedPasswordDatasetUnavailable
        expr: max(compromised_password_dataset_ready) != 1 or absent(compromised_password_dataset_ready)
        for: 2m
        labels:
          severity: critical
          service: compromised-password-service
        annotations:
          summary: Compromised Password dataset is unavailable
          description: The approved immutable dataset is not ready. Password screening must remain fail closed.

      - alert: CompromisedPasswordLookupCapacityRejected
        expr: sum(rate(compromised_password_lookup_rejected_total{reason="capacity"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: compromised-password-service
        annotations:
          summary: Compromised Password lookup capacity is rejecting work
          description: The zero-queue lookup concurrency limit is saturated and callers are receiving overload failures.

      - alert: CompromisedPasswordLookupFailureRatioHigh
        expr: sum(rate(compromised_password_lookup_duration_seconds_count{outcome="failure"}[5m])) / clamp_min(sum(rate(compromised_password_lookup_duration_seconds_count[5m])), 0.001) > 0.01
        for: 5m
        labels:
          severity: warning
          service: compromised-password-service
        annotations:
          summary: Compromised Password lookup failure ratio is high
          description: More than one percent of observed lookup executions are failing over the last five minutes.
