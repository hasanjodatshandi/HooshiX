rules:
  - id: compromised-password-no-thread-sleep
    languages: [java]
    severity: ERROR
    message: Thread.sleep is prohibited for coordination or polling.
    patterns:
      - pattern: Thread.sleep(...)
  - id: compromised-password-no-load-extension
    languages: [java]
    severity: ERROR
    message: SQLite extension loading must never be enabled at runtime.
    patterns:
      - pattern: $CONFIG.enableLoadExtension(true)
  - id: compromised-password-no-runtime-http-client
    languages: [java]
    severity: ERROR
    message: Compromised Password has no runtime Internet/provider dependency.
    patterns:
      - pattern-either:
          - pattern: java.net.http.HttpClient.newHttpClient()
          - pattern: java.net.http.HttpClient.newBuilder()
          - pattern: new java.net.URL(...)
  - id: compromised-password-dataset-builder-no-network-api
    languages: [java]
    severity: ERROR
    message: The offline dataset builder accepts local files only and must not gain a network API.
    paths:
      include:
        - /services/compromised-password-service/src/main/java/com/sajtech/compromisedpassword/infrastructure/lookup/datasetbuild
    patterns:
      - pattern-regex: 'java\.net(?:\.[A-Za-z_][A-Za-z0-9_]*)+'
  - id: compromised-password-dataset-builder-no-process-exec
    languages: [java]
    severity: ERROR
    message: The offline dataset builder must not shell out to download or acquisition tools.
    paths:
      include:
        - /services/compromised-password-service/src/main/java/com/sajtech/compromisedpassword/infrastructure/lookup/datasetbuild
    patterns:
      - pattern-either:
          - pattern: new ProcessBuilder(...)
          - pattern: Runtime.getRuntime().exec(...)
  - id: compromised-password-dataset-builder-no-spring-http-client
    languages: [java]
    severity: ERROR
    message: The offline dataset builder must not use Spring HTTP clients.
    paths:
      include:
        - /services/compromised-password-service/src/main/java/com/sajtech/compromisedpassword/infrastructure/lookup/datasetbuild
    patterns:
      - pattern-either:
          - pattern: org.springframework.web.client.RestClient.$METHOD(...)
          - pattern: new org.springframework.web.client.RestTemplate(...)
  - id: compromised-password-no-system-output
    languages: [java]
    severity: ERROR
    message: Production code must use structured allow-listed logging.
    paths:
      include:
        - /services/compromised-password-service/src/main/java
    patterns:
      - pattern-either:
          - pattern: System.out.$METHOD(...)
          - pattern: System.err.$METHOD(...)
  - id: compromised-password-no-request-prefix-logging
    languages: [java]
    severity: ERROR
    message: Lookup request prefixes must not be written to logs.
    paths:
      include:
        - /services/compromised-password-service/src/main/java
    patterns:
      - pattern: $LOGGER.$METHOD(..., $REQUEST.getPrefix(), ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: '(?i)trace|debug|info|warn|error|log'
  - id: compromised-password-no-suffix-logging
    languages: [java]
    severity: ERROR
    message: Compromised-password suffixes must not be written to logs.
    paths:
      include:
        - /services/compromised-password-service/src/main/java
    patterns:
      - pattern: $LOGGER.$METHOD(..., $MATCH.suffix(), ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: '(?i)trace|debug|info|warn|error|log'
  - id: compromised-password-no-request-prefix-trace-attribute
    languages: [java]
    severity: ERROR
    message: Lookup request prefixes must not be copied into trace attributes.
    paths:
      include:
        - /services/compromised-password-service/src/main/java
    patterns:
      - pattern: $SPAN.setAttribute(..., $REQUEST.getPrefix())
  - id: compromised-password-no-suffix-trace-attribute
    languages: [java]
    severity: ERROR
    message: Compromised-password suffixes must not be copied into trace attributes.
    paths:
      include:
        - /services/compromised-password-service/src/main/java
    patterns:
      - pattern: $SPAN.setAttribute(..., $MATCH.suffix())
  - id: compromised-password-no-raw-observation-error
    languages: [java]
    severity: ERROR
    message: Raw exceptions must not be attached to Compromised Password observations because exception detail can contain sensitive runtime paths or data.
    paths:
      include:
        - /services/compromised-password-service/src/main/java
    patterns:
      - pattern: $OBSERVATION.error(...)
  - id: compromised-password-no-field-injection
    languages: [java]
    severity: ERROR
    message: Required dependencies use constructor injection.
    patterns:
      - pattern: |
          @Autowired
          $TYPE $FIELD;
