rules:
  - id: compromised-password-no-thread-sleep
    languages: [java]
    severity: ERROR
    message: Thread.sleep is prohibited for coordination or polling.
    patterns:
      - pattern: Thread.sleep(...)
  - id: compromised-password-no-load-extension
    languages: [java]
    severity: ERROR
    message: SQLite extension loading must never be enabled at runtime.
    patterns:
      - pattern: $CONFIG.enableLoadExtension(true)
  - id: compromised-password-no-runtime-http-client
    languages: [java]
    severity: ERROR
    message: Compromised Password has no runtime Internet/provider dependency.
    patterns:
      - pattern-either:
          - pattern: java.net.http.HttpClient.newHttpClient()
          - pattern: java.net.http.HttpClient.newBuilder()
          - pattern: new java.net.URL(...)
  - id: compromised-password-dataset-builder-no-network-api
    languages: [java]
    severity: ERROR
    message: The offline dataset builder accepts local files only and must not gain a network API.
    paths:
      include:
        - /services/compromised-password-service/src/main/java/com/sajtech/compromisedpassword/infrastructure/lookup/datasetbuild
    patterns:
      - pattern-regex: 'java\.net(?:\.[A-Za-z_][A-Za-z0-9_]*)+'
  - id: compromised-password-no-system-output
    languages: [java]
    severity: ERROR
    message: Production code must use structured allow-listed logging.
    paths:
      include:
        - /services/compromised-password-service/src/main/java
    patterns:
      - pattern-either:
          - pattern: System.out.$METHOD(...)
          - pattern: System.err.$METHOD(...)
  - id: compromised-password-no-field-injection
    languages: [java]
    severity: ERROR
    message: Required dependencies use constructor injection.
    patterns:
      - pattern: |
          @Autowired
          $TYPE $FIELD;