syntax = "proto3";
package hooshix.identity.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "hooshix/identity/v1/identity_authentication.proto";
import "hooshix/identity/v1/identity_mfa.proto";

option java_multiple_files = true;
option java_package = "com.sajtech.identity.contract.v1";

service IdentityPasswordService {
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc RequestPasswordRecovery(RequestPasswordRecoveryRequest) returns (RequestPasswordRecoveryResponse);
  rpc ConfirmPasswordRecovery(ConfirmPasswordRecoveryRequest) returns (ConfirmPasswordRecoveryResponse);
}

message ChangePasswordRequest {
  string refresh_credential = 1 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9_-]{43}$"}];
  string current_password = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    max_bytes: 4096
  }];
  string new_password = 3 [(buf.validate.field).string = {
    min_len: 12
    max_len: 128
    max_bytes: 4096
  }];
  string request_id = 4 [(buf.validate.field).string = {pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"}];
}

message ChangePasswordResponse {
  bool changed = 1;
  string refresh_credential = 2;
  google.protobuf.Timestamp refresh_idle_expires_at = 3;
  google.protobuf.Timestamp refresh_absolute_expires_at = 4;
}

message RequestPasswordRecoveryRequest {
  string primary_contact = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 254
  }];
  string request_id = 2 [(buf.validate.field).string = {pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"}];
  PasswordTrustedClientAddress client_address = 3 [(buf.validate.field).required = true];
  AuthenticationChannel channel = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}

message RequestPasswordRecoveryResponse {
  bool accepted = 1;
}

message ConfirmPasswordRecoveryRequest {
  string primary_contact = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 254
  }];
  string code = 2 [(buf.validate.field).string = {pattern: "^[0-9]{8}$"}];
  string new_password = 3 [(buf.validate.field).string = {
    min_len: 12
    max_len: 128
    max_bytes: 4096
  }];
  string request_id = 4 [(buf.validate.field).string = {pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"}];
  PasswordTrustedClientAddress client_address = 5 [(buf.validate.field).required = true];
  AuthenticationChannel channel = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  MfaProof mfa_proof = 7;
}

message ConfirmPasswordRecoveryResponse {
  bool changed = 1;
}

message PasswordTrustedClientAddress {
  option (buf.validate.message).cel = {
    id: "password_trusted_client_address.address_length"
    message: "address must contain exactly one IPv4 or IPv6 address"
    expression: "size(this.address) == 4 || size(this.address) == 16"
  };

  bytes address = 1;
}
