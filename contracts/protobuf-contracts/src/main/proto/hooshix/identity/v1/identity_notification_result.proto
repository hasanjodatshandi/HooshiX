syntax = "proto3";

package hooshix.identity.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "hooshix/notification/v1/notification.proto";

option java_multiple_files = true;
option java_package = "com.sajtech.identity.contract.v1";

service IdentityNotificationResultService {
  rpc ReportNotificationResult(ReportNotificationResultRequest) returns (ReportNotificationResultResponse);
}

message ReportNotificationResultRequest {
  string notification_id = 1 [(buf.validate.field).string = {pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"}];
  hooshix.notification.v1.NotificationLifecycle terminal_lifecycle = 2 [(buf.validate.field).enum = {
    defined_only: true
    in: [
      5,
      6,
      7,
      8
    ]
  }];
  google.protobuf.Timestamp occurred_at = 3 [(buf.validate.field).required = true];
}

message ReportNotificationResultResponse {
  bool accepted = 1;
}
