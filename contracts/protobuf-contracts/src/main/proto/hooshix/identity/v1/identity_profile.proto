syntax = "proto3";
package hooshix.identity.v1;
option java_multiple_files = true;
option java_package = "com.sajtech.identity.contract.v1";
service IdentityProfileService {
 rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
 rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
 rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
 rpc AddContact(AddContactRequest) returns (AddContactResponse);
 rpc VerifyContact(VerifyContactRequest) returns (VerifyContactResponse);
 rpc SetPrimaryContact(SetPrimaryContactRequest) returns (SetPrimaryContactResponse);
 rpc RemoveContact(RemoveContactRequest) returns (RemoveContactResponse);
}
message GetProfileRequest { string refresh_credential=1; }
message GetProfileResponse { string profile_id=1; string first_name=2; string last_name=3; string father_name=4; }
message UpdateProfileRequest { string refresh_credential=1; string first_name=2; string last_name=3; string father_name=4; }
message UpdateProfileResponse { bool updated=1; }
message Contact { string contact_id=1; string value=2; string type=3; bool verified=4; bool primary=5; }
message ListContactsRequest { string refresh_credential=1; }
message ListContactsResponse { repeated Contact contacts=1; }
message AddContactRequest { string refresh_credential=1; string value=2; string type=3; }
message AddContactResponse { string contact_id=1; bool accepted=2; }
message VerifyContactRequest { string refresh_credential=1; string contact_id=2; string code=3; }
message VerifyContactResponse { bool verified=1; }
message SetPrimaryContactRequest { string refresh_credential=1; string contact_id=2; }
message SetPrimaryContactResponse { bool accepted=1; }
message RemoveContactRequest { string refresh_credential=1; string contact_id=2; }
message RemoveContactResponse { bool accepted=1; }
