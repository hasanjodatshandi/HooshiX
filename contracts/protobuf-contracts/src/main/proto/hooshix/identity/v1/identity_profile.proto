syntax = "proto3";

package hooshix.identity.v1;

import "buf/validate/validate.proto";

option java_multiple_files = true;
option java_package = "com.sajtech.identity.contract.v1";

service IdentityProfileService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
  rpc AddContact(AddContactRequest) returns (AddContactResponse);
  rpc ResendContactVerification(ResendContactVerificationRequest) returns (ResendContactVerificationResponse);
  rpc VerifyContact(VerifyContactRequest) returns (VerifyContactResponse);
  rpc SetPrimaryContact(SetPrimaryContactRequest) returns (SetPrimaryContactResponse);
  rpc RemoveContact(RemoveContactRequest) returns (RemoveContactResponse);
}

message GetProfileRequest {
  string refresh_credential = 1 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9_-]{43}$"}];
}

message GetProfileResponse {
  string profile_id = 1;
  string first_name = 2;
  string last_name = 3;
  string father_name = 4;
}

message UpdateProfileRequest {
  string refresh_credential = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{43}$"];
  string first_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 120
  }];
  string last_name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 120
  }];
  string father_name = 4 [(buf.validate.field).string = {max_len: 120}];
  string request_id = 5 [(buf.validate.field).string = {pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"}];
}

message UpdateProfileResponse {
  bool updated = 1;
}

message Contact {
  string contact_id = 1;
  string value = 2;
  string type = 3;
  bool verified = 4;
  bool primary = 5;
}

message ListContactsRequest {
  string refresh_credential = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{43}$"];
}

message ListContactsResponse {
  repeated Contact contacts = 1;
}

message AddContactRequest {
  string refresh_credential = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{43}$"];
  string value = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 254
  }];
  string type = 3 [(buf.validate.field).string = {
    in: [
      "EMAIL",
      "PHONE"
    ]
  }];
  string request_id = 4 [(buf.validate.field).string = {pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"}];
  string locale = 5 [(buf.validate.field).string = {
    in: [
      "fa",
      "en"
    ]
  }];
}

message AddContactResponse {
  string contact_id = 1;
  bool accepted = 2;
}

message ResendContactVerificationRequest {
  string refresh_credential = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{43}$"];
  string contact_id = 2 [(buf.validate.field).string.uuid = true];
  string request_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}

message ResendContactVerificationResponse {
  bool accepted = 1;
}

message VerifyContactRequest {
  string refresh_credential = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{43}$"];
  string contact_id = 2 [(buf.validate.field).string.uuid = true];
  string code = 3 [(buf.validate.field).string = {pattern: "^[0-9]{8}$"}];
  string request_id = 4 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}

message VerifyContactResponse {
  bool verified = 1;
}

message SetPrimaryContactRequest {
  string refresh_credential = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{43}$"];
  string contact_id = 2 [(buf.validate.field).string.uuid = true];
  string request_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}

message SetPrimaryContactResponse {
  bool accepted = 1;
}

message RemoveContactRequest {
  string refresh_credential = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{43}$"];
  string contact_id = 2 [(buf.validate.field).string.uuid = true];
  string request_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}

message RemoveContactResponse {
  bool accepted = 1;
}
