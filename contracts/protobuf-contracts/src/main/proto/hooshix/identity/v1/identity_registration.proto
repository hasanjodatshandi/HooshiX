syntax = "proto3";

package hooshix.identity.v1;

import "buf/validate/validate.proto";

option java_multiple_files = true;
option java_package = "com.sajtech.identity.contract.v1";

service IdentityRegistrationService {
  rpc RegisterLocal(RegisterLocalRequest) returns (RegisterLocalResponse);
  rpc ResendRegistrationVerification(ResendRegistrationVerificationRequest) returns (ResendRegistrationVerificationResponse);
  rpc ConfirmRegistration(ConfirmRegistrationRequest) returns (ConfirmRegistrationResponse);
}

enum RegistrationChannel {
  REGISTRATION_CHANNEL_UNSPECIFIED = 0;
  REGISTRATION_CHANNEL_EMAIL = 1;
  REGISTRATION_CHANNEL_PHONE = 2;
}

enum RegistrationLocale {
  REGISTRATION_LOCALE_UNSPECIFIED = 0;
  REGISTRATION_LOCALE_FA = 1;
  REGISTRATION_LOCALE_EN = 2;
}

message TrustedClientAddress {
  option (buf.validate.message).cel = {
    id: "trusted_client_address.address_length"
    message: "address must contain exactly one IPv4 or IPv6 address"
    expression: "size(this.address) == 4 || size(this.address) == 16"
  };

  bytes address = 1;
}

message RegisterLocalRequest {
  string request_id = 1 [(buf.validate.field).string = {pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"}];
  RegistrationChannel channel = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string contact = 3 [(buf.validate.field).string = {
    min_len: 3
    max_len: 254
  }];
  string password = 4 [(buf.validate.field).string = {
    min_len: 12
    max_len: 128
    max_bytes: 4096
  }];
  RegistrationLocale locale = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string first_name = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 120
  }];
  string last_name = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 120
  }];
  optional string father_name = 8 [(buf.validate.field).string = {max_len: 120}];
  TrustedClientAddress client_address = 9 [(buf.validate.field).required = true];
}

message RegisterLocalResponse {
  bool accepted = 1;
}

message ResendRegistrationVerificationResponse {
  bool accepted = 1;
}

message ResendRegistrationVerificationRequest {
  string request_id = 1 [(buf.validate.field).string = {pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"}];
  RegistrationChannel channel = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string contact = 3 [(buf.validate.field).string = {
    min_len: 3
    max_len: 254
  }];
  TrustedClientAddress client_address = 4 [(buf.validate.field).required = true];
}

message ConfirmRegistrationRequest {
  string request_id = 1 [(buf.validate.field).string = {pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"}];
  RegistrationChannel channel = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string contact = 3 [(buf.validate.field).string = {
    min_len: 3
    max_len: 254
  }];
  string code = 4 [(buf.validate.field).string = {pattern: "^[0-9]{8}$"}];
  TrustedClientAddress client_address = 5 [(buf.validate.field).required = true];
}

message ConfirmRegistrationResponse {
  bool confirmed = 1;
}
