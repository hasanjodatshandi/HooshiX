syntax = "proto3";

package hooshix.conversation.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.sajtech.conversation.contract.v1";

// Private Conversation operations. Caller identity and tenant authority are authenticated metadata.
service ConversationService {
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc ArchiveConversation(ArchiveConversationRequest) returns (ArchiveConversationResponse);
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc CreateModelRun(CreateModelRunRequest) returns (CreateModelRunResponse);
  rpc GetModelRun(GetModelRunRequest) returns (GetModelRunResponse);
  rpc CancelModelRun(CancelModelRunRequest) returns (CancelModelRunResponse);
  rpc SubmitRunFeedback(SubmitRunFeedbackRequest) returns (SubmitRunFeedbackResponse);
}

enum ConversationLifecycle {
  CONVERSATION_LIFECYCLE_UNSPECIFIED = 0;
  CONVERSATION_LIFECYCLE_ACTIVE = 1;
  CONVERSATION_LIFECYCLE_ARCHIVED = 2;
  CONVERSATION_LIFECYCLE_DELETED = 3;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_ASSISTANT = 2;
}

enum ModelRunState {
  MODEL_RUN_STATE_UNSPECIFIED = 0;
  MODEL_RUN_STATE_QUEUED = 1;
  MODEL_RUN_STATE_RUNNING = 2;
  MODEL_RUN_STATE_SUCCEEDED = 3;
  MODEL_RUN_STATE_FAILED = 4;
  MODEL_RUN_STATE_CANCELED = 5;
  MODEL_RUN_STATE_OUTCOME_UNKNOWN = 6;
}

enum ModelRunFailureCode {
  MODEL_RUN_FAILURE_CODE_UNSPECIFIED = 0;
  MODEL_RUN_FAILURE_CODE_PROVIDER_UNAVAILABLE = 1;
  MODEL_RUN_FAILURE_CODE_PROVIDER_REJECTED = 2;
  MODEL_RUN_FAILURE_CODE_PROVIDER_RESPONSE_INVALID = 3;
  MODEL_RUN_FAILURE_CODE_SAFETY_REJECTED = 4;
  MODEL_RUN_FAILURE_CODE_BUDGET_UNAVAILABLE = 5;
  MODEL_RUN_FAILURE_CODE_EXECUTION_DISABLED = 6;
  MODEL_RUN_FAILURE_CODE_TENANT_INACTIVE = 7;
}

enum RunFeedbackValue {
  RUN_FEEDBACK_VALUE_UNSPECIFIED = 0;
  RUN_FEEDBACK_VALUE_HELPFUL = 1;
  RUN_FEEDBACK_VALUE_NOT_HELPFUL = 2;
  RUN_FEEDBACK_VALUE_UNSAFE = 3;
  RUN_FEEDBACK_VALUE_FACTUALLY_WRONG = 4;
}

message ConversationView {
  string conversation_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string title = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 120
    pattern: "^[^\\x00-\\x1F\\x7F]+$"
  }];
  ConversationLifecycle lifecycle = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  int64 version = 4 [(buf.validate.field).int64.gt = 0];
  google.protobuf.Timestamp created_at = 5 [(buf.validate.field).required = true];
  google.protobuf.Timestamp last_activity_at = 6 [(buf.validate.field).required = true];
}

message MessageView {
  string message_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string conversation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  MessageRole role = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string content = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 16000
    pattern: "^[^\\x00]+$"
  }];
  int64 ordinal = 5 [(buf.validate.field).int64.gt = 0];
  google.protobuf.Timestamp created_at = 6 [(buf.validate.field).required = true];
}

message ModelRunView {
  option (buf.validate.message).cel = {
    id: "model_run_view.terminal_time"
    message: "terminal runs require completed_at"
    expression: "this.state in [3, 4, 5, 6] ? has(this.completed_at) : !has(this.completed_at)"
  };

  string run_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string conversation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  ModelRunState state = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  string model_alias = 4 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9-]{0,63}$"];
  string prompt_version = 5 [(buf.validate.field).string.pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"];
  string price_version = 6 [(buf.validate.field).string.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];
  int64 reserved_cost_micro_usd = 7 [(buf.validate.field).int64.gte = 0];
  int64 charged_cost_micro_usd = 8 [(buf.validate.field).int64.gte = 0];
  ModelRunFailureCode failure_code = 9 [(buf.validate.field).enum.defined_only = true];
  bool cancellation_requested = 10;
  google.protobuf.Timestamp created_at = 11 [(buf.validate.field).required = true];
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp completed_at = 13;
}

message CreateConversationRequest {
  string request_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string title = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 120
    pattern: "^[^\\x00-\\x1F\\x7F]+$"
  }];
}

message CreateConversationResponse {
  ConversationView conversation = 1 [(buf.validate.field).required = true];
}

message ListConversationsRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string page_token = 2 [(buf.validate.field).string = {
    pattern: "^$|^[A-Za-z0-9_-]{1,256}$"
    max_bytes: 256
  }];
}

message ListConversationsResponse {
  repeated ConversationView conversations = 1 [(buf.validate.field).repeated.max_items = 100];
  string next_page_token = 2 [(buf.validate.field).string = {
    pattern: "^$|^[A-Za-z0-9_-]{1,256}$"
    max_bytes: 256
  }];
}

message GetConversationRequest {
  string conversation_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}

message GetConversationResponse {
  ConversationView conversation = 1 [(buf.validate.field).required = true];
}

message ArchiveConversationRequest {
  string request_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string conversation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  int64 expected_version = 3 [(buf.validate.field).int64.gt = 0];
}

message ArchiveConversationResponse {
  ConversationView conversation = 1 [(buf.validate.field).required = true];
}

message DeleteConversationRequest {
  string request_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string conversation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  int64 expected_version = 3 [(buf.validate.field).int64.gt = 0];
}

message DeleteConversationResponse {
  bool accepted = 1;
}

message ListMessagesRequest {
  string conversation_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string page_token = 3 [(buf.validate.field).string = {
    pattern: "^$|^[A-Za-z0-9_-]{1,256}$"
    max_bytes: 256
  }];
}

message ListMessagesResponse {
  repeated MessageView messages = 1 [(buf.validate.field).repeated.max_items = 100];
  string next_page_token = 2 [(buf.validate.field).string = {
    pattern: "^$|^[A-Za-z0-9_-]{1,256}$"
    max_bytes: 256
  }];
}

message CreateModelRunRequest {
  string request_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string conversation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string user_message = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 16000
    pattern: "^[^\\x00]+$"
  }];
}

message CreateModelRunResponse {
  ModelRunView run = 1 [(buf.validate.field).required = true];
}

message GetModelRunRequest {
  string conversation_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string run_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}

message GetModelRunResponse {
  ModelRunView run = 1 [(buf.validate.field).required = true];
}

message CancelModelRunRequest {
  string request_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string conversation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string run_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
}

message CancelModelRunResponse {
  ModelRunView run = 1 [(buf.validate.field).required = true];
}

message SubmitRunFeedbackRequest {
  string request_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string conversation_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  string run_id = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"];
  RunFeedbackValue value = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
}

message SubmitRunFeedbackResponse {
  bool accepted = 1;
}
