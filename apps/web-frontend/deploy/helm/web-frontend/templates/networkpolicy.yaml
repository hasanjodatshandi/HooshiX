apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "web-frontend.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "web-frontend.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "edge.namespace is required" .Values.edge.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml (required "edge.podLabels is required" .Values.edge.podLabels) | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.service.applicationPort }}}
        - {protocol: TCP, port: 15008}
  egress: []
