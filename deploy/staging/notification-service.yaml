database:
  jdbcUrl: jdbc:postgresql://postgresql.platform-data.svc.cluster.local:5432/notification
  podLabels: {app.kubernetes.io/name: postgresql}
  runtimeSecretName: notification-db-runtime
  migrationSecretName: notification-db-migration
runtime: {erasureRuntimeEnabled: true, deliveryRuntimeEnabled: false}
kafka: {connectionSecretName: notification-kafka}
secrets: {fingerprintSecretName: notification-fingerprint, deliverySecretName: notification-delivery, providerSecretName: notification-providers}
providers:
  email: {host: smtp.gmail.com, port: 587}
  sms: {host: api.sms.ir, port: 443}
observability:
  tracing: {enabled: true, otlpEndpoint: http://otel-collector.platform-observability-node.svc.cluster.local:4318/v1/traces, collector: {namespace: platform-observability-node, podLabels: {app.kubernetes.io/name: otel-collector}, port: 4318}}
  metrics: {enabled: true, prometheus: {namespace: platform-observability, podLabels: {app.kubernetes.io/name: prometheus}, principal: prod.sajtech.internal/ns/platform-observability/sa/prometheus}}
