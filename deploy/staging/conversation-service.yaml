webBff:
  principal: prod.sajtech.internal/ns/platform-apps/sa/web-bff
ambient:
  waypointName: platform-apps-waypoint
  waypointPrincipal: prod.sajtech.internal/ns/platform-apps/sa/platform-apps-waypoint
runtime:
  eventRuntimeEnabled: true
  providerRuntimeEnabled: false
  providerCanaryPercent: 0
  providerMaximumConcurrentCalls: 1
  providerMaximumConcurrentPerTenant: 1
database:
  jdbcUrl: jdbc:postgresql://postgresql.platform-data.svc.cluster.local:5432/conversation
  podLabels: {app.kubernetes.io/name: postgresql}
  runtimeSecretName: conversation-db-runtime
  migrationSecretName: conversation-db-migration
kafka:
  bootstrapServers: kafka.platform-data.svc.cluster.local:9093
  connectionSecretName: conversation-kafka
identity:
  jwtVerifierConfigMapName: identity-jwt-public
  jwtIssuer: https://identity.sajtech.internal
secrets:
  contentKeyRingSecretName: conversation-content
  providerApiKeySecretName: conversation-provider
observability:
  tracing: {enabled: true, otlpEndpoint: http://otel-collector.platform-observability-node.svc.cluster.local:4318/v1/traces, collector: {namespace: platform-observability-node, podLabels: {app.kubernetes.io/name: otel-collector}, port: 4318}}
  metrics: {enabled: true, prometheus: {namespace: platform-observability, podLabels: {app.kubernetes.io/name: prometheus}, principal: prod.sajtech.internal/ns/platform-observability/sa/prometheus}}
