runtime:
  enabled: true
  maxConcurrentCallsPerConnection: 128
  checkPermission: {globalConcurrency: 8, perCallerConcurrency: 4, globalQueueCapacity: 8, perCallerQueueCapacity: 2, maxCallerBuckets: 64, queueWait: PT0.025S}
database:
  jdbcUrl: jdbc:postgresql://postgresql.platform-data.svc.cluster.local:5432/authorization
  podLabels: {app.kubernetes.io/name: postgresql}
  runtimeSecretName: authorization-db-runtime
  migrationSecretName: authorization-db-migration
quota:
  redis: {podLabels: {app.kubernetes.io/name: security-redis}, connectionSecretName: authorization-quota-redis}
  maxActiveBuckets: 10000
  maxNewBucketsPerMinute: 1000
  hostTimeStatus: {configMapName: authorization-host-time}
secrets: {fingerprintSecretName: authorization-fingerprint, quotaKeySecretName: authorization-quota-key}
identity: {jwtVerifierConfigMapName: authorization-identity-jwt}
observability:
  tracing: {enabled: true, otlpEndpoint: http://otel-collector.platform-observability-node.svc.cluster.local:4318/v1/traces, collector: {namespace: platform-observability-node, podLabels: {app.kubernetes.io/name: otel-collector}, port: 4318}}
  metrics: {enabled: true, prometheus: {namespace: platform-observability, podLabels: {app.kubernetes.io/name: prometheus}, principal: prod.sajtech.internal/ns/platform-observability/sa/prometheus}}
