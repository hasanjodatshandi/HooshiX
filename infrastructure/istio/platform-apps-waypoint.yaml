apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-apps-waypoint-options
  namespace: platform-apps
data:
  deployment: |
    spec:
      replicas: 1
      template:
        metadata:
          annotations:
            sidecar.istio.io/proxyImage: docker.io/istio/proxyv2@sha256:775ded17b9127cf9d4d31ba3d162f4f80b443a717264dab2965179586f0dbe2e
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: istio-proxy
              image: docker.io/istio/proxyv2@sha256:775ded17b9127cf9d4d31ba3d162f4f80b443a717264dab2965179586f0dbe2e
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-apps-waypoint
  namespace: platform-apps
  labels:
    istio.io/waypoint-for: service
spec:
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: platform-apps-waypoint-options
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
