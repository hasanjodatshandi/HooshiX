apiVersion: v1
kind: ServiceAccount
metadata: {name: postgres-bootstrap, namespace: platform-data}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata: {name: postgres-bootstrap, namespace: platform-data}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-bootstrap
        istio.io/dataplane-mode: ambient
    spec:
      serviceAccountName: postgres-bootstrap
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          env:
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: postgres-admin, key: password}}}
            - {name: AUTH_MIG, valueFrom: {secretKeyRef: {name: authorization-db-migration, key: spring.datasource.password}}}
            - {name: AUTH_RUN, valueFrom: {secretKeyRef: {name: authorization-db-runtime, key: spring.datasource.password}}}
            - {name: ID_MIG, valueFrom: {secretKeyRef: {name: identity-db-migration, key: spring.datasource.password}}}
            - {name: ID_RUN, valueFrom: {secretKeyRef: {name: identity-db-runtime, key: spring.datasource.password}}}
            - {name: NOTIF_MIG, valueFrom: {secretKeyRef: {name: notification-db-migration, key: spring.datasource.password}}}
            - {name: NOTIF_RUN, valueFrom: {secretKeyRef: {name: notification-db-runtime, key: spring.datasource.password}}}
          command: [sh, -ec]
          args:
            - |
              psql -h postgresql -U postgres -d postgres -v ON_ERROR_STOP=1 <<SQL
              DO \$\$ BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authorization_migration') THEN CREATE ROLE authorization_migration LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD '$AUTH_MIG'; END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authorization_runtime') THEN CREATE ROLE authorization_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD '$AUTH_RUN'; END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='identity_migration') THEN CREATE ROLE identity_migration LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD '$ID_MIG'; END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='identity_runtime') THEN CREATE ROLE identity_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD '$ID_RUN'; END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='notification_migration') THEN CREATE ROLE notification_migration LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD '$NOTIF_MIG'; END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='notification_runtime') THEN CREATE ROLE notification_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD '$NOTIF_RUN'; END IF;
              END \$\$;
              SELECT 'CREATE DATABASE "authorization" OWNER authorization_migration' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='authorization')\gexec
              SELECT 'CREATE DATABASE identity OWNER identity_migration' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='identity')\gexec
              SELECT 'CREATE DATABASE notification OWNER notification_migration' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='notification')\gexec
              REVOKE CONNECT ON DATABASE "authorization" FROM PUBLIC; GRANT CONNECT ON DATABASE "authorization" TO authorization_migration, authorization_runtime;
              REVOKE CONNECT ON DATABASE identity FROM PUBLIC; GRANT CONNECT ON DATABASE identity TO identity_migration, identity_runtime;
              REVOKE CONNECT ON DATABASE notification FROM PUBLIC; GRANT CONNECT ON DATABASE notification TO notification_migration, notification_runtime;
              SQL
              for spec in 'authorization authorization_migration authorization_runtime' 'identity identity_migration identity_runtime' 'notification notification_migration notification_runtime'; do
                set -- $spec; db=$1; mig=$2; run=$3
                psql -h postgresql -U postgres -d "$db" -v ON_ERROR_STOP=1 -c "REVOKE CREATE ON SCHEMA public FROM PUBLIC; GRANT USAGE ON SCHEMA public TO $run; ALTER DEFAULT PRIVILEGES FOR ROLE $mig IN SCHEMA public GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO $run; ALTER DEFAULT PRIVILEGES FOR ROLE $mig IN SCHEMA public GRANT USAGE,SELECT,UPDATE ON SEQUENCES TO $run;"
              done
