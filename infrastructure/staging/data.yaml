apiVersion: v1
kind: ServiceAccount
metadata: {name: postgresql, namespace: platform-data}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: security-redis, namespace: platform-data}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: kafka, namespace: platform-data}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgresql, namespace: platform-data}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgresql}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        istio.io/dataplane-mode: ambient
    spec:
      serviceAccountName: postgresql
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgresql
          image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
          env:
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-admin, key: password}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, postgres, -d, postgres]}, periodSeconds: 3, failureThreshold: 20}
          livenessProbe: {exec: {command: [pg_isready, -U, postgres, -d, postgres]}, periodSeconds: 10, failureThreshold: 5}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgresql, namespace: platform-data}
spec:
  selector: {app.kubernetes.io/name: postgresql}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: security-redis, namespace: platform-data}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: security-redis}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-redis
        istio.io/dataplane-mode: ambient
    spec:
      serviceAccountName: security-redis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:8.2.8-bookworm@sha256:2f7462b9e93e0a7ae2edf3a0a0babc8a4d29f8bfc50849b906b7caaef925edc1
          args: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory, 256mb, --maxmemory-policy, noeviction, --save, "", --aclfile, /run/redis/users.acl]
          ports: [{name: redis, containerPort: 6379}]
          env:
            - {name: REDIS_HEALTH_PASSWORD, valueFrom: {secretKeyRef: {name: redis-health, key: password}}}
            - {name: REDIS_VERIFY_PASSWORD, valueFrom: {secretKeyRef: {name: redis-verify, key: password}}}
          readinessProbe:
            exec: {command: [sh, -c, 'redis-cli --user health --pass "$REDIS_HEALTH_PASSWORD" --no-auth-warning ping | grep -qx PONG']}
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec: {command: [sh, -c, 'redis-cli --user health --pass "$REDIS_HEALTH_PASSWORD" --no-auth-warning ping | grep -qx PONG']}
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: acl, mountPath: /run/redis, readOnly: true}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: acl, secret: {secretName: redis-acl, defaultMode: 0440}}
---
apiVersion: v1
kind: Service
metadata: {name: security-redis, namespace: platform-data}
spec:
  selector: {app.kubernetes.io/name: security-redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka, namespace: platform-data}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: kafka}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        istio.io/dataplane-mode: ambient
    spec:
      serviceAccountName: kafka
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kafka
          image: apache/kafka:4.2.1@sha256:9916d60eca5d599550e2c320230808fda342124ba550bb4ac4ea8591803262a0
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9094"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT"}
            - {name: KAFKA_LISTENERS, value: "CONTROLLER://:9094,BROKER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "BROKER://kafka.platform-data.svc.cluster.local:9093"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: BROKER}
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR, value: "1"}
            - {name: KAFKA_MIN_INSYNC_REPLICAS, value: "1"}
            - {name: KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE, value: "false"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx256m"}
          ports:
            - {name: broker, containerPort: 9093}
            - {name: controller, containerPort: 9094}
          startupProbe:
            exec: {command: [/opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, localhost:9093]}
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [/opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, localhost:9093]}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: [/opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, localhost:9093]}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
            - {name: config, mountPath: /opt/kafka/config}
            - {name: logs, mountPath: /opt/kafka/logs}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: config, emptyDir: {sizeLimit: 16Mi}}
        - {name: logs, emptyDir: {sizeLimit: 128Mi}}
        - {name: temporary, emptyDir: {sizeLimit: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: platform-data}
spec:
  selector: {app.kubernetes.io/name: kafka}
  ports: [{name: broker, port: 9093, targetPort: broker}]
