apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: traefik-egress, namespace: traefik-system}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-edge}}
          podSelector: {matchLabels: {app.kubernetes.io/name: edge-waf}}
      ports: [{protocol: TCP, port: 8080}, {protocol: TCP, port: 15008}]
