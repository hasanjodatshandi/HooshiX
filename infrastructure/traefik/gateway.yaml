apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: hooshix-traefik
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hooshix-public
  namespace: traefik-system
spec:
  gatewayClassName: hooshix-traefik
  listeners:
    - name: web
      port: 8000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              platform.local/gateway-access: "true"
    - name: websecure
      hostname: hooshix.local
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hooshix-local-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              platform.local/gateway-access: "true"
