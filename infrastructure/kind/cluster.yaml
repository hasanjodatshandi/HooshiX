kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform-local
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
  serviceSubnet: 10.96.0.0/16
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /dev/shm/hooshix-kind-etcd
        containerPath: /var/lib/etcd

    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        listenAddress: 127.0.0.1
        protocol: TCP
  - role: worker
  - role: worker
