apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hooshix-production
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
spec:
  project: hooshix-production
  source:
    repoURL: https://github.com/hasanjodatshandi/HooshiX.git
    targetRevision: main
    path: deploy/clusters/production
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
