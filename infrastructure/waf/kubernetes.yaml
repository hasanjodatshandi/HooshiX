apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-waf
  namespace: platform-edge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-waf
  namespace: platform-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-waf
      app.kubernetes.io/component: runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-waf
        app.kubernetes.io/component: runtime
        app.kubernetes.io/part-of: hooshix
    spec:
      serviceAccountName: edge-waf
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: edge-waf
          image: localhost:5001/hooshix/edge-waf@sha256:7c8585e9b6fd6ff662e31cab5496b658cc5a89729fefdc899b8b7c3fddaaff51
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
            - {name: health, containerPort: 9090}
          readinessProbe: {httpGet: {path: /healthz, port: health}, periodSeconds: 3, failureThreshold: 10}
          livenessProbe: {httpGet: {path: /healthz, port: health}, periodSeconds: 10, failureThreshold: 3}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, emptyDir: {}}
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: edge-waf
  namespace: platform-edge
spec:
  selector:
    app.kubernetes.io/name: edge-waf
    app.kubernetes.io/component: runtime
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: health, port: 9090, targetPort: health}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: edge-waf
  namespace: platform-edge
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: edge-waf}
  mtls: {mode: STRICT}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: edge-waf
  namespace: platform-edge
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: edge-waf}
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["prod.sajtech.internal/ns/traefik-system/sa/traefik"]
      to:
        - operation: {ports: ["8080"]}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hooshix-public
  namespace: platform-edge
spec:
  parentRefs:
    - {name: hooshix-public, namespace: traefik-system, sectionName: websecure}
  hostnames: ["hooshix.local"]
  rules:
    - backendRefs:
        - {name: edge-waf, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-waf
  namespace: platform-edge
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: edge-waf}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{protocol: TCP, port: 8080}, {protocol: TCP, port: 15008}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-apps}}
          podSelector: {matchLabels: {app.kubernetes.io/name: web-bff}}
      ports: [{protocol: TCP, port: 8080}, {protocol: TCP, port: 15008}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-apps}}
          podSelector: {matchLabels: {gateway.networking.k8s.io/gateway-name: platform-apps-waypoint}}
      ports: [{protocol: TCP, port: 15008}]
