apiVersion: v1
kind: ServiceAccount
metadata: {name: loki, namespace: platform-observability}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: tempo, namespace: platform-observability}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: alertmanager, namespace: platform-observability}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: grafana, namespace: platform-observability}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: {name: loki-config, namespace: platform-observability}
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore: {store: inmemory}
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index: {prefix: index_, period: 24h}
    limits_config:
      allow_structured_metadata: true
      retention_period: 2h
      volume_enabled: true
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loki, namespace: platform-observability}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: loki}}
  template:
    metadata: {labels: {app.kubernetes.io/name: loki}}
    spec:
      serviceAccountName: loki
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: loki
          image: grafana/loki:3.7.4@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc
          args: [-config.file=/etc/loki/config.yaml]
          ports: [{name: http, containerPort: 3100}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 3, failureThreshold: 20}
          livenessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 10, failureThreshold: 5}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 500m, memory: 384Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: config, mountPath: /etc/loki, readOnly: true}, {name: data, mountPath: /var/loki}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: config, configMap: {name: loki-config}}, {name: data, emptyDir: {}}, {name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: loki, namespace: platform-observability}
spec: {selector: {app.kubernetes.io/name: loki}, ports: [{name: http, port: 3100, targetPort: http}]}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: tempo-config, namespace: platform-observability}
data:
  tempo.yaml: |
    stream_over_http_enabled: true
    server: {http_listen_port: 3200}
    distributor:
      receivers:
        otlp:
          protocols:
            grpc: {endpoint: 0.0.0.0:4317}
            http: {endpoint: 0.0.0.0:4318}
    storage:
      trace:
        backend: local
        wal: {path: /var/tempo/wal}
        local: {path: /var/tempo/blocks}
    backend_worker:
      compaction:
        block_retention: 2h
    usage_report: {reporting_enabled: false}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tempo, namespace: platform-observability}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: tempo}}
  template:
    metadata: {labels: {app.kubernetes.io/name: tempo}}
    spec:
      serviceAccountName: tempo
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: tempo
          image: grafana/tempo:3.0.2@sha256:cda87c212d8c584dc0b89e337e7ed648a5100feb657e5d528480ee4fa03dbbe3
          args: [-config.file=/etc/tempo/tempo.yaml, -target=all]
          ports: [{name: http, containerPort: 3200}, {name: otlp-grpc, containerPort: 4317}, {name: otlp-http, containerPort: 4318}]
          startupProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 2, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 3, failureThreshold: 20}
          livenessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 10, failureThreshold: 5}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 500m, memory: 384Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: config, mountPath: /etc/tempo, readOnly: true}, {name: data, mountPath: /var/tempo}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: config, configMap: {name: tempo-config}}, {name: data, emptyDir: {}}, {name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: tempo, namespace: platform-observability}
spec:
  selector: {app.kubernetes.io/name: tempo}
  ports: [{name: http, port: 3200}, {name: otlp-grpc, port: 4317}, {name: otlp-http, port: 4318}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: alertmanager-config, namespace: platform-observability}
data:
  alertmanager.yml: |
    route: {receiver: local-null}
    receivers: [{name: local-null}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: alertmanager, namespace: platform-observability}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: alertmanager}}
  template:
    metadata: {labels: {app.kubernetes.io/name: alertmanager}}
    spec:
      serviceAccountName: alertmanager
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
          args: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager, --web.listen-address=0.0.0.0:9093]
          ports: [{name: http, containerPort: 9093}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}, periodSeconds: 3, failureThreshold: 20}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}, periodSeconds: 10, failureThreshold: 5}
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: config, mountPath: /etc/alertmanager, readOnly: true}, {name: data, mountPath: /alertmanager}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: config, configMap: {name: alertmanager-config}}, {name: data, emptyDir: {}}, {name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: alertmanager, namespace: platform-observability}
spec: {selector: {app.kubernetes.io/name: alertmanager}, ports: [{name: http, port: 9093, targetPort: http}]}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-datasources, namespace: platform-observability}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.platform-observability.svc.cluster.local:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.platform-observability.svc.cluster.local:3100
        editable: false
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.platform-observability.svc.cluster.local:3200
        editable: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: platform-observability}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: grafana}}
  template:
    metadata: {labels: {app.kubernetes.io/name: grafana}}
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 472, runAsGroup: 472, fsGroup: 472, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: grafana
          image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: grafana-admin, key: password}}}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_LOG_MODE, value: console}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_PLUGINS_PLUGIN_ADMIN_ENABLED, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - {name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE, value: "false"}
          ports: [{name: http, containerPort: 3000}]
          startupProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 2, failureThreshold: 90}
          readinessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 3, failureThreshold: 20}
          livenessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 10, failureThreshold: 5}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 500m, memory: 384Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: datasources, configMap: {name: grafana-datasources}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: platform-observability}
spec: {selector: {app.kubernetes.io/name: grafana}, ports: [{name: http, port: 3000, targetPort: http}]}
