apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: platform-observability}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: platform-observability}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files: [/etc/prometheus/rules.yml]
    alerting:
      alertmanagers:
        - static_configs: [{targets: ['alertmanager.platform-observability.svc.cluster.local:9093']}]
    scrape_configs:
      - job_name: authorization-service
        metrics_path: /actuator/prometheus
        static_configs: [{targets: ['authorization-service.platform-apps.svc.cluster.local:9092']}]
      - job_name: compromised-password-service
        metrics_path: /actuator/prometheus
        static_configs: [{targets: ['compromised-password-service.platform-apps.svc.cluster.local:9091']}]
      - job_name: identity-service
        metrics_path: /actuator/prometheus
        static_configs: [{targets: ['identity-service.platform-apps.svc.cluster.local:9092']}]
      - job_name: notification-service
        metrics_path: /actuator/prometheus
        static_configs: [{targets: ['notification-service.platform-apps.svc.cluster.local:9092']}]
      - job_name: web-bff
        metrics_path: /actuator/prometheus
        static_configs: [{targets: ['web-bff.platform-apps.svc.cluster.local:9092']}]
      - job_name: otel-collector
        dns_sd_configs:
          - names: ['otel-collector-metrics.platform-observability-node.svc.cluster.local']
            type: A
            port: 8888
            refresh_interval: 15s
  rules.yml: |
    groups:
      - name: platform-observability
        rules:
          - alert: CollectorTargetDown
            expr: up{job="otel-collector"} == 0
            for: 1m
            labels: {severity: warning}
            annotations: {summary: "OpenTelemetry Collector target is down"}
          - alert: CollectorExporterFailures
            expr: increase(otelcol_exporter_send_failed_spans[5m]) > 0 or increase(otelcol_exporter_send_failed_log_records[5m]) > 0
            for: 1m
            labels: {severity: warning}
            annotations: {summary: "OpenTelemetry Collector exporter is dropping telemetry"}
          - alert: CollectorExporterQueuePressure
            expr: otelcol_exporter_queue_capacity > 0 and (otelcol_exporter_queue_size / otelcol_exporter_queue_capacity) > 0.8
            for: 2m
            labels: {severity: warning}
            annotations: {summary: "OpenTelemetry Collector exporter queue is above 80 percent"}
          - alert: ErasureWorkExhausted
            expr: sum(increase({__name__=~"identity_erasure_(outbox|participant|receipt)_exhausted_total|authorization_erasure_exhausted_total|notification_erasure_exhausted_total|web_bff_erasure_exhausted_total"}[5m])) > 0
            labels: {severity: critical}
            annotations: {summary: "A data-subject erasure command, participant, or receipt exhausted finite retries"}
          - alert: ErasureReceiptPublicationFailures
            expr: sum(increase({__name__=~"identity_erasure_receipt_outbox_failures_total|authorization_erasure_receipt_outbox_failures_total|notification_erasure_receipt_outbox_failures_total|web_bff_erasure_receipt_outbox_failures_total"}[5m])) > 3
            for: 2m
            labels: {severity: warning}
            annotations: {summary: "Erasure receipt publication is repeatedly failing"}
          - alert: ErasureRequestInFlightTooLong
            expr: identity_erasure_in_flight > 0
            for: 1h
            labels: {severity: warning}
            annotations: {summary: "At least one data-subject erasure request has remained in flight for one hour"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: platform-observability}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: prometheus}}
  template:
    metadata: {labels: {app.kubernetes.io/name: prometheus}}
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=2h, --web.listen-address=0.0.0.0:9090]
          ports: [{name: http, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}, periodSeconds: 3, failureThreshold: 20}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}, periodSeconds: 10, failureThreshold: 5}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: platform-observability}
spec:
  selector: {app.kubernetes.io/name: prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
