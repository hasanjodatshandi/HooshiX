apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: platform-observability-node}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: otel-collector, namespace: platform-observability-node}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: otel-collector}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-apps}}
          podSelector: {matchLabels: {app.kubernetes.io/name: authorization-service}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-apps}}
          podSelector: {matchLabels: {app.kubernetes.io/name: compromised-password-service}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-apps}}
          podSelector: {matchLabels: {app.kubernetes.io/name: identity-service}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-apps}}
          podSelector: {matchLabels: {app.kubernetes.io/name: notification-service}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-apps}}
          podSelector: {matchLabels: {app.kubernetes.io/name: web-bff}}
      ports: [{protocol: TCP, port: 4317}, {protocol: TCP, port: 4318}, {protocol: TCP, port: 15008}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 8888}, {protocol: TCP, port: 15008}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: tempo}}
      ports: [{protocol: TCP, port: 4317}, {protocol: TCP, port: 15008}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: loki}}
      ports: [{protocol: TCP, port: 3100}, {protocol: TCP, port: 15008}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: platform-observability}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: loki, namespace: platform-observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: loki}}
  policyTypes: [Ingress, Egress]
  egress: []
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-observability-node}}
          podSelector: {matchLabels: {app.kubernetes.io/name: otel-collector}}
      ports: [{protocol: TCP, port: 3100}, {protocol: TCP, port: 15008}]
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
      ports: [{protocol: TCP, port: 3100}, {protocol: TCP, port: 15008}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: tempo, namespace: platform-observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: tempo}}
  policyTypes: [Ingress, Egress]
  egress: []
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-observability-node}}
          podSelector: {matchLabels: {app.kubernetes.io/name: otel-collector}}
      ports: [{protocol: TCP, port: 4317}, {protocol: TCP, port: 4318}, {protocol: TCP, port: 15008}]
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
      ports: [{protocol: TCP, port: 3200}, {protocol: TCP, port: 15008}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: prometheus, namespace: platform-observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
      ports: [{protocol: TCP, port: 9090}, {protocol: TCP, port: 15008}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-apps}}
      ports: [{protocol: TCP, port: 9091}, {protocol: TCP, port: 9092}, {protocol: TCP, port: 15008}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-apps}}
          podSelector: {matchLabels: {gateway.networking.k8s.io/gateway-name: platform-apps-waypoint}}
      ports: [{protocol: TCP, port: 15008}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-observability-node}}
          podSelector: {matchLabels: {app.kubernetes.io/name: otel-collector}}
      ports: [{protocol: TCP, port: 8888}, {protocol: TCP, port: 15008}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: alertmanager}}
      ports: [{protocol: TCP, port: 9093}, {protocol: TCP, port: 15008}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: alertmanager, namespace: platform-observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: alertmanager}}
  policyTypes: [Ingress, Egress]
  egress: []
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 9093}, {protocol: TCP, port: 15008}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: grafana, namespace: platform-observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 9090}, {protocol: TCP, port: 15008}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: loki}}
      ports: [{protocol: TCP, port: 3100}, {protocol: TCP, port: 15008}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: tempo}}
      ports: [{protocol: TCP, port: 3200}, {protocol: TCP, port: 15008}]
