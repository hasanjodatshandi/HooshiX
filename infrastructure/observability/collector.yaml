apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: platform-observability-node
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: platform-observability-node
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
      filelog/application:
        include: [/var/log/pods/platform-apps_*/*/*.log]
        start_at: end
        include_file_path: true
        operators:
          - type: container
            id: container-parser
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 96
        spike_limit_mib: 24
      filter/privacy:
        error_mode: ignore
        traces:
          span:
            - 'attributes["enduser.id"] != nil'
            - 'attributes["user.email"] != nil'
            - 'attributes["user.phone"] != nil'
            - 'attributes["client.address"] != nil'
            - 'attributes["http.request.header.authorization"] != nil'
        logs:
          log_record:
            - 'IsMatch(body, "(?i)(HOOSHIX_PII_CANARY|password[=:]|authorization[=:]|cookie[=:]|set-cookie[=:]|secret[=:]|credential[=:])")'
      transform/privacy:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - delete_key(attributes, "network.peer.address")
              - delete_key(attributes, "url.full")
              - delete_key(attributes, "http.request.header.cookie")
        log_statements:
          - context: log
            statements:
              - delete_key(attributes, "client.address")
              - delete_key(attributes, "network.peer.address")
              - delete_key(attributes, "http.request.header.authorization")
              - delete_key(attributes, "http.request.header.cookie")
      resource/filelog:
        attributes:
          - key: service.name
            value: hooshix-kubernetes-pod-log
            action: upsert
      batch:
        timeout: 1s
        send_batch_size: 512
        send_batch_max_size: 1024
    exporters:
      otlp/tempo:
        endpoint: tempo.platform-observability.svc.cluster.local:4317
        tls: {insecure: true}
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 512
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 5s
          max_elapsed_time: 30s
      otlphttp/loki:
        endpoint: http://loki.platform-observability.svc.cluster.local:3100/otlp
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 512
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 5s
          max_elapsed_time: 30s
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_type_suffix: true
                    without_units: true
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/privacy, transform/privacy, batch]
          exporters: [otlp/tempo]
        logs/otlp:
          receivers: [otlp]
          processors: [memory_limiter, filter/privacy, transform/privacy, batch]
          exporters: [otlphttp/loki]
        logs/filelog:
          receivers: [filelog/application]
          processors: [memory_limiter, resource/filelog, filter/privacy, transform/privacy, batch]
          exporters: [otlphttp/loki]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: platform-observability-node
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: otel-collector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-collector}
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        supplementalGroups: [0]
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
          args: [--config=/etc/otelcol-contrib/config.yaml]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8888}
            - {name: health, containerPort: 13133}
          startupProbe: {httpGet: {path: /, port: health}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /, port: health}, periodSeconds: 3, failureThreshold: 20}
          livenessProbe: {httpGet: {path: /, port: health}, periodSeconds: 10, failureThreshold: 5}
          resources:
            requests: {cpu: 40m, memory: 128Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol-contrib, readOnly: true}
            - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: otel-collector-config}}
        - name: pod-logs
          hostPath: {path: /var/log/pods, type: Directory}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: platform-observability-node
spec:
  selector: {app.kubernetes.io/name: otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: metrics, port: 8888, targetPort: metrics}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-metrics
  namespace: platform-observability-node
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: otel-collector}
  ports:
    - {name: metrics, port: 8888, targetPort: metrics}
