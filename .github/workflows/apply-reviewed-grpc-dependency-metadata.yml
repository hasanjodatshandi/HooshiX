name: Apply reviewed gRPC dependency metadata

on:
  workflow_run:
    workflows:
      - Refresh Compromised Password dependency locks
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  apply:
    name: Validate and apply generated gRPC metadata
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch == 'agent/security-performance-freshness-audit' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact audited workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify exact audited workflow head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Download generated dependency metadata from triggering run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: compromised-password-dependency-metadata
          path: /tmp/generated-dependency-metadata
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify exact reviewed artifact contents
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '9e142981e0d00a96cf5420af5f279fc69ef19ee0345ae2a36971d5ae9da1ef7d' \
            '/tmp/generated-dependency-metadata/gradle.lockfile' | sha256sum --check --strict -
          printf '%s  %s\n' \
            'dd1ee3904abaabcbb3f34a0e4c4a284d931bd60ce2aea5703895217503e5f8d6' \
            '/tmp/generated-dependency-metadata/gradle/verification-metadata.xml' | sha256sum --check --strict -

      - name: Apply only reviewed generated files
        run: |
          set -euo pipefail
          lock_path='services/compromised-password-service/gradle.lockfile'
          metadata_path='services/compromised-password-service/gradle/verification-metadata.xml'
          cp /tmp/generated-dependency-metadata/gradle.lockfile "${lock_path}"
          cp /tmp/generated-dependency-metadata/gradle/verification-metadata.xml "${metadata_path}"
          git diff --check
          changed="$(git diff --name-only)"
          test -n "${changed}"
          while IFS= read -r path; do
            case "${path}" in
              "${lock_path}"|"${metadata_path}") ;;
              *)
                printf 'Unexpected generated-file change: %s\n' "${path}" >&2
                exit 1
                ;;
            esac
          done <<< "${changed}"
          grep -Fxq "${lock_path}" <<< "${changed}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${lock_path}" "${metadata_path}"
          git commit -m 'Regenerate gRPC dependency verification metadata'
          git push origin HEAD:agent/security-performance-freshness-audit
