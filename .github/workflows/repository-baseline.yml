name: Repository baseline

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-quality:
    name: Protobuf contract validation and examples
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Eclipse Temurin 25.0.4
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4'

      - name: Verify generated contracts, validation, and consumer examples
        working-directory: contracts/protobuf-contracts
        run: |
          set -euo pipefail
          ../../services/identity-service/gradlew clean test \
            --dependency-verification strict \
            --no-daemon \
            --no-configuration-cache

  repository-structure:
    name: Repository structure verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show Python runtime
        run: python3 --version

      - name: Verify shell, Python, and workflow sources
        run: make script-static-verify

      - name: Inspect baseline verifier inputs
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum scripts/baseline/verify_repository.py
          python3 - <<'PYEOF'
          from pathlib import Path
          print(Path("scripts/baseline/verify_repository.py").read_text(encoding="utf-8").splitlines()[-25:])
          PYEOF

      - name: Verify baseline tests
        run: make baseline-test

      - name: Verify platform tests
        run: make platform-test

      - name: Install integrity-pinned audit YAML parser for fixtures only
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps --only-binary=:all: \
            --require-hashes --timeout 15 --retries 0 --target "$RUNNER_TEMP/audit-yaml" -r /dev/stdin <<'REQUIREMENTS'
          PyYAML @ https://files.pythonhosted.org/packages/8b/9d/b3589d3877982d4f2329302ef98a8026e7f4443c765c46cfecc8858c6b4b/pyyaml-6.0.3-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc
          REQUIREMENTS
          echo "PYTHONPATH=$RUNNER_TEMP/audit-yaml" >> "$GITHUB_ENV"

      - name: Verify production
        run: make production-verify

      - name: Render pinned K3s mesh commissioning candidate without cluster writes
        run: |
          set -euo pipefail
          mesh_tools=$(mktemp -d "$RUNNER_TEMP/mesh-tools.XXXXXXXX")
          trap 'rm -rf -- "$mesh_tools"' EXIT
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 60 \
            https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz -o "$mesh_tools/helm.tar.gz"
          printf '%s  %s\n' c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3 \
            "$mesh_tools/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$mesh_tools/helm.tar.gz" -C "$mesh_tools" linux-amd64/helm
          PATH="$mesh_tools/linux-amd64:$PATH" python3 scripts/production/render_mesh_candidate.py \
            > "$RUNNER_TEMP/mesh-commissioning-candidate.json"

      - name: Retain public mesh candidate only, no deployment approval
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mesh-commissioning-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mesh-commissioning-candidate.json
          retention-days: 7
          if-no-files-found: error

      - name: Render isolated OpenBao candidate without secrets or cluster access
        run: python3 scripts/production/render_openbao_candidate.py --candidate --storage-class ci-review-only > /dev/null

      - name: Verify native JIT expiry on disposable runner
        run: sudo env GITHUB_ACTIONS=true python3 scripts/production/test_jit_systemd_expiry.py --system

      - name: Verify context tests
        run: make context-test

      - name: Verify context engine
        run: make context-verify

      - name: Verify context matrix
        run: make context-matrix-check

      - name: Verify local runtime
        run: make local-runtime-test

      - name: Verify repository baseline index
        run: python3 scripts/baseline/verify_repository.py

  openbao-recovery:
    name: OpenBao TLS and Raft recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rehearse pinned OpenBao recovery with disposable secrets only
        run: python3 scripts/production/rehearse_openbao_recovery.py --ci

  openbao-artifact:
    name: OpenBao pinned artifact security
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GRYPE_DB_AUTO_UPDATE: 'false'
      GRYPE_DB_VALIDATE_AGE: 'true'
      GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 120h
      GRYPE_CHECK_FOR_APP_UPDATE: 'false'
      SYFT_CHECK_FOR_APP_UPDATE: 'false'
    steps:
      - name: Check out repository without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install integrity-pinned release tools on disposable runner
        run: |
          set -euo pipefail
          scripts/production/install_release_tools.sh "$RUNNER_TEMP/openbao-tools"
          echo "$RUNNER_TEMP/openbao-tools" >> "$GITHUB_PATH"
      - name: Catalog exact public digest and require fresh vulnerability scan
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/openbao-artifact"
          mkdir -m 0700 "$evidence"
          image=$(python3 -c 'import json; print(json.load(open("infrastructure/production/secrets/openbao-image.json"))["image"])')
          timeout 180 grype db update
          grype db status -o json > "$evidence/database.json"
          syft version -o json > "$evidence/syft-version.json"
          grype version -o json > "$evidence/grype-version.json"
          timeout 300 syft scan "$image" --from registry --platform linux/amd64 \
            -o "syft-json=$evidence/syft.json" -o "cyclonedx-json=$evidence/cyclonedx.json"
          timeout 180 grype "sbom:$evidence/syft.json" --fail-on high -o json > "$evidence/grype.json"
          python3 scripts/production/verify_openbao_artifact.py \
            --evidence-dir "$evidence" --revision "$(git rev-parse HEAD)" > "$evidence/receipt.json"
      - name: Report public blocking findings without approving promotion
        if: ${{ always() }}
        run: |
          python3 scripts/production/verify_openbao_artifact.py --report \
            --evidence-dir "$RUNNER_TEMP/openbao-artifact" --revision "$(git rev-parse HEAD)"
      - name: Retain public scan evidence including failed scans
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openbao-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openbao-artifact/
          retention-days: 30
          if-no-files-found: error

  openbao-kubernetes:
    name: OpenBao Kubernetes foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify storage limit and fail-closed guard on a 64MiB disposable filesystem
        run: |
          set -euo pipefail
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            python3 scripts/production/rehearse_openbao_storage.py --ci \
            | tee "$RUNNER_TEMP/openbao-storage-receipt.json"
      - name: Retain public storage evidence only, never disk images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openbao-storage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openbao-storage-receipt.json
          retention-days: 30
          if-no-files-found: error
      - name: Install checksum-pinned fixture tools only on disposable runner
        run: |
          set -euo pipefail
          source infrastructure/kind/pins.env
          install -d -m 0700 "$RUNNER_TEMP/openbao-kubernetes-tools"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 \
            "https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}/kind-linux-amd64" \
            -o "$RUNNER_TEMP/openbao-kubernetes-tools/kind"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 \
            "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            -o "$RUNNER_TEMP/openbao-kubernetes-tools/kubectl"
          printf '%s  %s\n' "$KIND_LINUX_AMD64_SHA256" "$RUNNER_TEMP/openbao-kubernetes-tools/kind" \
            "$KUBECTL_LINUX_AMD64_SHA256" "$RUNNER_TEMP/openbao-kubernetes-tools/kubectl" | sha256sum --check --strict
          chmod 0700 "$RUNNER_TEMP/openbao-kubernetes-tools/kind" "$RUNNER_TEMP/openbao-kubernetes-tools/kubectl"
      - name: Rehearse public candidate with disposable TLS and Shamir data
        run: |
          python3 scripts/production/rehearse_openbao_kubernetes.py --ci \
            --tools-dir "$RUNNER_TEMP/openbao-kubernetes-tools" \
            --receipt "$RUNNER_TEMP/openbao-kubernetes-receipt.json"
      - name: Retain only successful public Kubernetes evidence, never fixture files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openbao-kubernetes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openbao-kubernetes-receipt.json
          retention-days: 30
          if-no-files-found: error

  compromised-password-security:
    name: Compromised Password security suite
    uses: ./.github/workflows/compromised-password-service.yml

  notification-security:
    name: Notification security suite
    uses: ./.github/workflows/notification-service.yml

  identity-security:
    name: Identity security suite
    uses: ./.github/workflows/identity-service.yml

  authorization-security:
    name: Authorization security suite
    uses: ./.github/workflows/authorization-service.yml

  conversation-security:
    name: Conversation security suite
    uses: ./.github/workflows/conversation-service.yml

  web-bff-security:
    name: Web BFF security suite
    uses: ./.github/workflows/web-bff.yml

  offline-ca-security:
    name: Offline CA tooling security suite
    uses: ./.github/workflows/offline-ca.yml

  edge-waf-security:
    name: WAF privacy and cookie boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned WAF build and embedded regression tests
        run: |
          source infrastructure/waf/pins.env
          docker build --provenance=false --pull=false \
            --build-arg "SOURCE_DATE_EPOCH=${WAF_SOURCE_DATE_EPOCH}" \
            -t hooshix-waf-verification infrastructure/waf
      - name: Validate packaged Caddy and Coraza configuration
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m
          --entrypoint caddy hooshix-waf-verification
          validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify isolated WAF block and backend-outage log privacy
        run: python3 scripts/platform/waf_image_smoke.py hooshix-waf-verification

  baseline:
    name: Baseline verify
    if: ${{ always() }}
    needs:
      - contract-quality
      - repository-structure
      - openbao-recovery
      - openbao-artifact
      - openbao-kubernetes
      - compromised-password-security
      - notification-security
      - identity-security
      - authorization-security
      - conversation-security
      - web-bff-security
      - offline-ca-security
      - edge-waf-security
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require repository and service verification
        env:
          CONTRACT_RESULT: ${{ needs.contract-quality.result }}
          REPOSITORY_RESULT: ${{ needs.repository-structure.result }}
          OPENBAO_RESULT: ${{ needs.openbao-recovery.result }}
          OPENBAO_ARTIFACT_RESULT: ${{ needs.openbao-artifact.result }}
          OPENBAO_KUBERNETES_RESULT: ${{ needs.openbao-kubernetes.result }}
          COMPROMISED_PASSWORD_RESULT: ${{ needs.compromised-password-security.result }}
          NOTIFICATION_RESULT: ${{ needs.notification-security.result }}
          IDENTITY_RESULT: ${{ needs.identity-security.result }}
          AUTHORIZATION_RESULT: ${{ needs.authorization-security.result }}
          CONVERSATION_RESULT: ${{ needs.conversation-security.result }}
          WEB_BFF_RESULT: ${{ needs.web-bff-security.result }}
          OFFLINE_CA_RESULT: ${{ needs.offline-ca-security.result }}
          EDGE_WAF_RESULT: ${{ needs.edge-waf-security.result }}
        run: |
          set -euo pipefail
          if [ "${CONTRACT_RESULT}" != 'success' ]; then
            echo "Protobuf contract quality result: ${CONTRACT_RESULT}" >&2
            exit 1
          fi
          if [ "${REPOSITORY_RESULT}" != 'success' ]; then
            echo "Repository structure verification result: ${REPOSITORY_RESULT}" >&2
            exit 1
          fi
          if [ "${OPENBAO_RESULT}" != 'success' ]; then
            echo "OpenBao TLS and Raft recovery result: ${OPENBAO_RESULT}" >&2
            exit 1
          fi
          if [ "${OPENBAO_ARTIFACT_RESULT}" != 'success' ]; then
            echo "OpenBao pinned artifact security result: ${OPENBAO_ARTIFACT_RESULT}" >&2
            exit 1
          fi
          if [ "${OPENBAO_KUBERNETES_RESULT}" != 'success' ]; then
            echo "OpenBao Kubernetes foundation result: ${OPENBAO_KUBERNETES_RESULT}" >&2
            exit 1
          fi
          if [ "${COMPROMISED_PASSWORD_RESULT}" != 'success' ]; then
            echo "Compromised Password security result: ${COMPROMISED_PASSWORD_RESULT}" >&2
            exit 1
          fi
          if [ "${NOTIFICATION_RESULT}" != 'success' ]; then
            echo "Notification security result: ${NOTIFICATION_RESULT}" >&2
            exit 1
          fi
          if [ "${IDENTITY_RESULT}" != 'success' ]; then
            echo "Identity security result: ${IDENTITY_RESULT}" >&2
            exit 1
          fi
          if [ "${AUTHORIZATION_RESULT}" != 'success' ]; then
            echo "Authorization security result: ${AUTHORIZATION_RESULT}" >&2
            exit 1
          fi
          if [ "${CONVERSATION_RESULT}" != 'success' ]; then
            echo "Conversation security result: ${CONVERSATION_RESULT}" >&2
            exit 1
          fi
          if [ "${WEB_BFF_RESULT}" != 'success' ]; then
            echo "Web BFF security result: ${WEB_BFF_RESULT}" >&2
            exit 1
          fi
          if [ "${EDGE_WAF_RESULT}" != 'success' ]; then
            echo "WAF privacy/cookie verification result: ${EDGE_WAF_RESULT}" >&2
            exit 1
          fi
          if [ "${OFFLINE_CA_RESULT}" != 'success' ]; then
            echo "Offline CA tooling security result: ${OFFLINE_CA_RESULT}" >&2
            exit 1
          fi
          echo 'Required repository and service security verification passed.'
