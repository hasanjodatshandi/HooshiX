name: Repository baseline

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-structure:
    name: Repository structure verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show Python runtime
        run: python3 --version

      - name: Inspect baseline verifier inputs
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum scripts/baseline/verify_repository.py
          python3 - <<'PYEOF'
          from pathlib import Path
          print(Path("scripts/baseline/verify_repository.py").read_text(encoding="utf-8").splitlines()[-25:])
          PYEOF

      - name: Verify baseline tests
        run: make baseline-test

      - name: Verify platform tests
        run: make platform-test

      - name: Verify production
        run: make production-verify

      - name: Verify context tests
        run: make context-test

      - name: Verify context engine
        run: make context-verify

      - name: Verify context matrix
        run: make context-matrix-check

      - name: Verify local runtime
        run: make local-runtime-test

      - name: Verify repository baseline index
        run: python3 scripts/baseline/verify_repository.py

  compromised-password-security:
    name: Compromised Password security suite
    uses: ./.github/workflows/compromised-password-service.yml

  notification-security:
    name: Notification security suite
    uses: ./.github/workflows/notification-service.yml

  identity-security:
    name: Identity security suite
    uses: ./.github/workflows/identity-service.yml

  authorization-security:
    name: Authorization security suite
    uses: ./.github/workflows/authorization-service.yml

  web-bff-security:
    name: Web BFF security suite
    uses: ./.github/workflows/web-bff.yml

  baseline:
    name: Baseline verify
    if: ${{ always() }}
    needs:
      - repository-structure
      - compromised-password-security
      - notification-security
      - identity-security
      - authorization-security
      - web-bff-security
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require repository and service verification
        env:
          REPOSITORY_RESULT: ${{ needs.repository-structure.result }}
          COMPROMISED_PASSWORD_RESULT: ${{ needs.compromised-password-security.result }}
          NOTIFICATION_RESULT: ${{ needs.notification-security.result }}
          IDENTITY_RESULT: ${{ needs.identity-security.result }}
          AUTHORIZATION_RESULT: ${{ needs.authorization-security.result }}
          WEB_BFF_RESULT: ${{ needs.web-bff-security.result }}
        run: |
          set -euo pipefail
          if [ "${REPOSITORY_RESULT}" != 'success' ]; then
            echo "Repository structure verification result: ${REPOSITORY_RESULT}" >&2
            exit 1
          fi
          if [ "${COMPROMISED_PASSWORD_RESULT}" != 'success' ]; then
            echo "Compromised Password security result: ${COMPROMISED_PASSWORD_RESULT}" >&2
            exit 1
          fi
          if [ "${NOTIFICATION_RESULT}" != 'success' ]; then
            echo "Notification security result: ${NOTIFICATION_RESULT}" >&2
            exit 1
          fi
          if [ "${IDENTITY_RESULT}" != 'success' ]; then
            echo "Identity security result: ${IDENTITY_RESULT}" >&2
            exit 1
          fi
          if [ "${AUTHORIZATION_RESULT}" != 'success' ]; then
            echo "Authorization security result: ${AUTHORIZATION_RESULT}" >&2
            exit 1
          fi
          if [ "${WEB_BFF_RESULT}" != 'success' ]; then
            echo "Web BFF security result: ${WEB_BFF_RESULT}" >&2
            exit 1
          fi
          echo 'Required repository and service security verification passed.'
