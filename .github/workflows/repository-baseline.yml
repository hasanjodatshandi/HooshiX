name: Repository baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Show Python runtime
        run: python3 --version

      - name: Verify repository baseline
        run: make baseline-verify

  harden-main:
    name: Enforce main branch protection
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Apply and verify main branch protection
        env:
          GH_TOKEN: ${{ secrets.HOOSHIX_REPO_ADMIN_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'HOOSHIX_REPO_ADMIN_TOKEN is required.' >&2
            exit 1
          fi

          cat > /tmp/branch-protection.json <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["Baseline verify"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": false,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 0,
              "require_last_push_approval": false
            },
            "restrictions": null,
            "required_linear_history": false,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": true,
            "lock_branch": false,
            "allow_fork_syncing": false
          }
          JSON

          status="$({
            curl --silent --show-error \
              --request PUT \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @/tmp/branch-protection.json \
              --dump-header /tmp/protection-headers.txt \
              --output /tmp/applied-protection.json \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/${REPOSITORY}/branches/main/protection"
          } 2>/tmp/protection-curl-error.txt)"

          if [ "${status}" != '200' ]; then
            echo "GitHub branch-protection update failed with HTTP ${status}." >&2
            grep -i '^x-accepted-github-permissions:' /tmp/protection-headers.txt >&2 || true
            grep -i '^x-oauth-scopes:' /tmp/protection-headers.txt >&2 || true
            cat /tmp/protection-curl-error.txt >&2
            cat /tmp/applied-protection.json >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/branches/main/protection" \
            > /tmp/verified-protection.json

          python3 - <<'PY'
          import json

          with open('/tmp/verified-protection.json', encoding='utf-8') as handle:
              protection = json.load(handle)

          checks = protection.get('required_status_checks') or {}
          contexts = set(checks.get('contexts') or [])
          assert checks.get('strict') is True, protection
          assert 'Baseline verify' in contexts, protection
          assert (protection.get('enforce_admins') or {}).get('enabled') is True, protection
          assert protection.get('required_pull_request_reviews') is not None, protection
          assert (protection.get('required_conversation_resolution') or {}).get('enabled') is True, protection
          assert (protection.get('allow_force_pushes') or {}).get('enabled') is False, protection
          assert (protection.get('allow_deletions') or {}).get('enabled') is False, protection
          print('Main branch protection verified.')
          PY
