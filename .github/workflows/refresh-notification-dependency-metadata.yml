name: Refresh Notification dependency metadata

on:
  pull_request:

permissions:
  contents: read

jobs:
  refresh:
    name: Generate Notification dependency metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Eclipse Temurin 25.0.4
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4'

      - name: Resolve formatter dependencies and generate verification metadata
        working-directory: services/notification-service
        run: |
          set -euo pipefail
          ./gradlew spotlessApply \
            --write-locks \
            --write-verification-metadata sha256 \
            --no-daemon
          ./gradlew dependencies \
            --write-locks \
            --write-verification-metadata sha256 \
            --no-daemon

      - name: Upload generated dependency metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notification-dependency-metadata
          if-no-files-found: error
          retention-days: 1
          path: |
            services/notification-service/gradle.lockfile
            services/notification-service/gradle/verification-metadata.xml
