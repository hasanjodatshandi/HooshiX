name: Identity service

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: identity-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_DIR: services/identity-service
  BUF_VERSION: '1.72.0'
  BUF_SHA256: 8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af
  HELM_VERSION: '4.2.4'
  HELM_SHA256: c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
  GITLEAKS_VERSION: '8.30.0'
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
  OSV_SCANNER_VERSION: '2.4.0'
  OSV_SCANNER_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
  PROMETHEUS_VERSION: '3.13.2'
  PROMETHEUS_SHA256: 0e8c4d46101bd025ea8265e377d2caabc57f488fc1be1c367f37db69ea41be6f
  SEMGREP_IMAGE: semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a

jobs:
  verify:
    name: Build, architecture, security, migration, and render
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Eclipse Temurin 25.0.4
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4'


      - name: Publish HooshiX Protobuf contract package to local Maven cache
        run: |
          set -euo pipefail
          cd contracts/protobuf-contracts
          ../../services/identity-service/gradlew publishToMavenLocal \
            --dependency-verification strict --no-daemon --no-configuration-cache

      - name: Verify Java and Gradle wrapper pins
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail
          java -version 2>&1 | tee /tmp/identity-java-version.txt
          grep -F '25.0.4' /tmp/identity-java-version.txt
          printf '%s  %s\n' \
            '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7' \
            'gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict -
          grep -F 'distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -F 'distributionSha256Sum=9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14' gradle/wrapper/gradle-wrapper.properties

      - name: Verify Gitleaks image and detection fixtures
        run: scripts/ci/security/service_security.sh gitleaks-fixtures
      - name: Scan current tree and Git history for secrets
        run: scripts/ci/security/service_security.sh gitleaks-scan
      - name: Install and verify OSV-Scanner
        run: scripts/ci/security/service_security.sh osv-install
      - name: Scan locked dependencies for known vulnerabilities
        run: scripts/ci/security/service_security.sh osv-scan
      - name: Capture Gradle lock baseline
        working-directory: ${{ env.SERVICE_DIR }}
        run: cp gradle.lockfile /tmp/identity-gradle.lockfile

      - name: Verify formatting
        working-directory: ${{ env.SERVICE_DIR }}
        run: ./gradlew spotlessCheck --write-locks --dependency-verification strict --no-daemon --no-configuration-cache

      - name: Verify unit tests
        working-directory: ${{ env.SERVICE_DIR }}
        run: ./gradlew test --write-locks --dependency-verification strict --no-daemon --no-configuration-cache

      - name: Verify PostgreSQL migrations and integration tests
        working-directory: ${{ env.SERVICE_DIR }}
        run: ./gradlew integrationTest --write-locks --dependency-verification strict --no-daemon --no-configuration-cache

      - name: Verify risk-based coverage thresholds
        working-directory: ${{ env.SERVICE_DIR }}
        run: ./gradlew jacocoRiskCoverage --write-locks --dependency-verification strict --no-daemon --no-configuration-cache

      - name: Verify architecture tests
        working-directory: ${{ env.SERVICE_DIR }}
        run: ./gradlew architectureTest --write-locks --dependency-verification strict --no-daemon --no-configuration-cache

      - name: Verify selective security mutation thresholds
        working-directory: ${{ env.SERVICE_DIR }}
        run: ./gradlew pitest --write-locks --dependency-verification strict --no-daemon --no-configuration-cache

      - name: Verify SpotBugs and runtime JAR
        working-directory: ${{ env.SERVICE_DIR }}
        run: ./gradlew spotbugsMain bootJar --write-locks --dependency-verification strict --no-daemon --no-configuration-cache

      - name: Install and verify Buf
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output /tmp/buf \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "${BUF_SHA256}" /tmp/buf | sha256sum --check --strict -
          chmod 0755 /tmp/buf
          /tmp/buf --version | grep -F "${BUF_VERSION}"

      - name: Lint and check Protobuf compatibility
        working-directory: contracts/protobuf-contracts
        run: |
          set -euo pipefail
          /tmp/buf lint
          /tmp/buf build -o /tmp/identity-contract.binpb
          ../../scripts/contracts/verify_protobuf_compatibility.sh \
            /tmp/buf /tmp/identity-contract-baseline.binpb

      - name: Run pinned Semgrep policy
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            --workdir /src \
            --env HOME=/tmp \
            --env SEMGREP_SEND_METRICS=off \
            "${SEMGREP_IMAGE}" \
            semgrep scan \
              --disable-version-check \
              --metrics=off \
              --error \
              --config .semgrep/identity-service.yml \
              services/identity-service/src/main/java

      - name: Install and verify Helm
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output /tmp/helm.tar.gz \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "${HELM_SHA256}" /tmp/helm.tar.gz | sha256sum --check --strict -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          /tmp/linux-amd64/helm version --short | grep -F "v${HELM_VERSION}"

      - name: Lint and verify hardened Helm render
        run: |
          set -euo pipefail
          chart="${SERVICE_DIR}/deploy/helm/identity-service"
          /tmp/linux-amd64/helm lint "${chart}" -f "${chart}/ci/test-values.yaml"
          /tmp/linux-amd64/helm template identity-service "${chart}" \
            -f "${chart}/ci/test-values.yaml" > /tmp/identity-rendered.yaml
          python3 "${SERVICE_DIR}/scripts/verify_rendered_manifest.py" /tmp/identity-rendered.yaml

      - name: Install and verify Prometheus tooling
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          printf '%s  %s\n' "${PROMETHEUS_SHA256}" /tmp/prometheus.tar.gz | sha256sum --check --strict -
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          mv "/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /tmp/promtool

      - name: Verify service alert rules and dashboard JSON
        run: |
          set -euo pipefail
          /tmp/promtool check rules "${SERVICE_DIR}/observability/alerts/identity-service.yaml"
          python3 -m json.tool "${SERVICE_DIR}/observability/grafana/identity-service.json" > /dev/null

      - name: Build digest-verified Temurin runtime image
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail
          source container/pins.env
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output /tmp/temurin.tar.gz "${TEMURIN_ARCHIVE_URL}"
          printf '%s  %s\n' "${TEMURIN_ARCHIVE_SHA256}" /tmp/temurin.tar.gz | sha256sum --check --strict -
          rm -rf .runtime-jdk
          mkdir .runtime-jdk
          tar -xzf /tmp/temurin.tar.gz -C .runtime-jdk --strip-components=1
          docker build --pull=false \
            --build-arg "RUNTIME_BASE_IMAGE=${RUNTIME_BASE_IMAGE}" \
            --build-arg "APP_JAR=build/libs/identity-service-0.1.0-SNAPSHOT.jar" \
            --build-arg "RUNTIME_JDK_DIR=.runtime-jdk" \
            -t identity-service:ci .
          rm -rf .runtime-jdk

      - name: Verify generated files are committed
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail
          cmp /tmp/identity-gradle.lockfile gradle.lockfile
          git diff --exit-code -- gradle.lockfile gradle/verification-metadata.xml
