name: Format Notification source

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Produce Notification formatter output
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Eclipse Temurin 25.0.4
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4'

      - name: Apply formatter in read-only CI workspace
        working-directory: services/notification-service
        run: |
          set -euo pipefail
          ./gradlew spotlessApply --dependency-verification strict --no-daemon

      - name: Package only formatter changes
        run: |
          set -euo pipefail
          mkdir -p .format-output/files
          git diff --name-only -- services/notification-service > .format-output/changed-files.txt
          test -s .format-output/changed-files.txt
          while IFS= read -r path; do
            mkdir -p ".format-output/files/$(dirname "${path}")"
            cp "${path}" ".format-output/files/${path}"
          done < .format-output/changed-files.txt

      - name: Upload formatter output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notification-format-output
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
          path: .format-output/
