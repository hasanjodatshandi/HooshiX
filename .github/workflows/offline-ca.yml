name: Offline CA tooling

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-ca:
    name: Windows offline CA integrity and cryptography
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build verified public fixture package
        shell: powershell
        run: |
          .\scripts\production\offline-ca\build-package.ps1 -InstallationId ci-fixture -OutputDirectory "$env:RUNNER_TEMP\HooshiX-public-ca"
      - name: Execute crypto and integrity negative fixtures on Windows PowerShell
        shell: powershell
        run: |
          .\scripts\production\tests\test_offline_ca.ps1 -PackageDirectory "$env:RUNNER_TEMP\HooshiX-public-ca"
      - name: Build public owner-installation signing package after fixtures pass
        shell: powershell
        run: |
          .\scripts\production\offline-ca\build-package.ps1 -InstallationId hooshix-production -OutputDirectory "$env:RUNNER_TEMP\HooshiX-production-offline-ca" -ToolBundleDirectory "$env:RUNNER_TEMP\HooshiX-public-ca"
      - name: Retain only the public signing tool package, never fixture keys
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hooshix-public-offline-signing-${{ github.sha }}
          path: ${{ runner.temp }}/HooshiX-production-offline-ca.zip
          if-no-files-found: error
          retention-days: 14
      - name: Validate production PowerShell launchers without remote execution
        shell: powershell
        run: |
          .\scripts\production\run-host-inspection.ps1 -ValidateOnly
          .\scripts\production\run-guard-maintenance.ps1 -ValidateOnly
          .\scripts\production\run-intermediate-csr.ps1 -ValidateOnly
          .\scripts\production\run-audit-prerequisite.ps1 -ValidateOnly
          .\scripts\production\run-audit-prerequisite.ps1 -ValidateOnly -VerifyOnly
          try {
            .\scripts\production\run-audit-prerequisite.ps1 -ValidateOnly -Install -VerifyOnly
            throw 'CONFLICTING_MODE_NOT_REJECTED'
          } catch {
            if ($_.Exception.Message -ne 'INSTALL_AND_VERIFY_ONLY_ARE_MUTUALLY_EXCLUSIVE') { throw }
          }
