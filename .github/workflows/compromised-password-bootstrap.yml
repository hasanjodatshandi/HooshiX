name: Compromised Password bootstrap

on:
  push:
    branches:
      - agent/compromised-password-vertical-slice

permissions:
  contents: read

jobs:
  bootstrap:
    name: Generate verified service metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Eclipse Temurin 25.0.4
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4'

      - name: Verify and regenerate Gradle wrapper scripts
        working-directory: services/compromised-password-service
        run: |
          printf '%s  %s\n' \
            '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7' \
            'gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict -
          ./gradlew wrapper \
            --gradle-version 9.6.1 \
            --distribution-type bin \
            --gradle-distribution-sha256-sum 9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14 \
            --no-daemon
          printf '%s  %s\n' \
            '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7' \
            'gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict -

      - name: Format and resolve service metadata
        working-directory: services/compromised-password-service
        run: |
          ./gradlew spotlessApply \
            --write-locks \
            --write-verification-metadata sha256 \
            --no-daemon

      - name: Resolve Semgrep image digest
        run: |
          docker pull semgrep/semgrep:1.173.0 >/dev/null
          docker image inspect semgrep/semgrep:1.173.0 --format '{{index .RepoDigests 0}}'

      - name: Execute service verification
        working-directory: services/compromised-password-service
        run: |
          ./gradlew test architectureTest integrationTest spotbugsMain \
            --write-locks \
            --write-verification-metadata sha256 \
            --no-daemon \
            --stacktrace

      - name: Upload bootstrap snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compromised-password-bootstrap
          if-no-files-found: error
          retention-days: 1
          path: |
            services/compromised-password-service
            !services/compromised-password-service/.gradle/**
            !services/compromised-password-service/build/**
