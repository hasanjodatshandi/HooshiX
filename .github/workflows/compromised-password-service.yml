name: Compromised Password service

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: compromised-password-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_DIR: services/compromised-password-service
  BUF_VERSION: '1.72.0'
  BUF_SHA256: 8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af
  HELM_VERSION: '4.2.4'
  HELM_SHA256: c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
  GITLEAKS_VERSION: '8.30.0'
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
  OSV_SCANNER_VERSION: '2.4.0'
  OSV_SCANNER_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
  PROMETHEUS_VERSION: '3.13.2'
  PROMETHEUS_SHA256: 0e8c4d46101bd025ea8265e377d2caabc57f488fc1be1c367f37db69ea41be6f
  SEMGREP_IMAGE: semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a

jobs:
  verify:
    name: Build, architecture, security, and render
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Eclipse Temurin 25.0.4
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4'


      - name: Publish HooshiX Protobuf contract package to local Maven cache
        run: |
          set -euo pipefail
          cd contracts/protobuf-contracts
          ../../services/identity-service/gradlew publishToMavenLocal \
            --dependency-verification strict --no-daemon --no-configuration-cache

      - name: Verify Java and Gradle wrapper pins
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail
          java -version 2>&1 | tee /tmp/java-version.txt
          grep -F '25.0.4' /tmp/java-version.txt
          printf '%s  %s\n' \
            '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7' \
            'gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict -
          grep -F 'distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -F 'distributionSha256Sum=9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14' gradle/wrapper/gradle-wrapper.properties

      - name: Verify no corpus or generated SQLite artifact is committed
        run: |
          set -euo pipefail
          forbidden="$(git ls-files "${SERVICE_DIR}" | grep -Ei '(^|/)(pwnedpasswords[^/]*|[^/]+\.(sqlite|sqlite3|db))$|/dataset/local/' || true)"
          if [[ -n "${forbidden}" ]]; then
            printf 'Raw corpus/generated dataset artifacts must stay outside Git:\n%s\n' "${forbidden}" >&2
            exit 1
          fi
          unexpected_dataset_file="$(git ls-files "${SERVICE_DIR}/dataset" | grep -Ev "^${SERVICE_DIR}/dataset/(README\.md|dataset-release-manifest\.schema\.json)$" || true)"
          if [[ -n "${unexpected_dataset_file}" ]]; then
            printf 'Only dataset documentation and manifest schema may be tracked under dataset/:\n%s\n' "${unexpected_dataset_file}" >&2
            exit 1
          fi

      - name: Verify Gitleaks image and detection fixtures
        run: scripts/ci/security/service_security.sh gitleaks-fixtures
      - name: Scan current tree and Git history for secrets
        run: scripts/ci/security/service_security.sh gitleaks-scan
      - name: Install and verify OSV-Scanner
        run: scripts/ci/security/service_security.sh osv-install
      - name: Scan locked dependencies for known vulnerabilities
        run: scripts/ci/security/service_security.sh osv-scan
      - name: Capture Gradle lock baseline
        working-directory: ${{ env.SERVICE_DIR }}
        run: cp gradle.lockfile /tmp/gradle.lockfile

      - name: Verify formatting
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail
          ./gradlew spotlessCheck \
            --write-locks \
            --dependency-verification strict \
            --no-daemon

      - name: Verify unit tests
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail
          ./gradlew test \
            --write-locks \
            --dependency-verification strict \
            --no-daemon

      - name: Verify architecture and integration tests
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail
          ./gradlew architectureTest integrationTest \
            --write-locks \
            --dependency-verification strict \
            --no-daemon

      - name: Verify SpotBugs and runtime JAR
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail
          ./gradlew spotbugsMain bootJar \
            --write-locks \
            --dependency-verification strict \
            --no-daemon
          cmp /tmp/gradle.lockfile gradle.lockfile
          if jar tf build/libs/compromised-password-service-0.1.0-SNAPSHOT.jar \
              | grep -F 'com/sajtech/compromisedpassword/infrastructure/lookup/datasetbuild/'; then
            echo 'Dataset builder must not be present in the runtime JAR.' >&2
            exit 1
          fi
          python3 -m json.tool dataset/dataset-release-manifest.schema.json >/dev/null

      - name: Verify offline dataset builder CLI
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail
          fixture_root=/tmp/compromised-password-dataset-cli
          rm -rf "${fixture_root}"
          mkdir -p "${fixture_root}/output"
          trap 'rm -rf "${fixture_root}"' EXIT
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          rows = [
              (b"fixture-alpha", 2),
              (b"fixture-alpha", 3),
              (b"fixture-beta", 7),
          ]
          source = Path("/tmp/compromised-password-dataset-cli/source.txt")
          with source.open("wb") as handle:
              for value, count in rows:
                  digest = hashlib.sha1(value).hexdigest().upper()
                  handle.write(f"{digest}:{count}\r\n".encode("ascii"))
          PY
          source_sha256="$(sha256sum "${fixture_root}/source.txt" | cut -d' ' -f1)"
          tool_sha256="$(printf '%s' 'ci-generated-fixture' | sha256sum | cut -d' ' -f1)"
          build_git_revision='${{ github.event.pull_request.head.sha || github.sha }}'
          ./gradlew buildCompromisedPasswordDataset \
            --args="--source-kind GENERATED_TEST_FIXTURE --input ${fixture_root}/source.txt --output ${fixture_root}/output/compromised-password.sqlite --manifest ${fixture_root}/output/compromised-password.manifest.json --source-sha256 ${source_sha256} --retrieval-started-at 2026-08-15T00:00:00Z --retrieval-completed-at 2026-08-15T00:01:00Z --acquisition-tool-name ci-generated-fixture --acquisition-tool-version 1.0.0 --acquisition-tool-sha256 ${tool_sha256} --build-git-revision ${build_git_revision} --max-prefix-cardinality 64 --max-serialized-response-bytes 16384" \
            --dependency-verification strict \
            --no-daemon
          test -s "${fixture_root}/output/compromised-password.sqlite"
          python3 -m json.tool "${fixture_root}/output/compromised-password.manifest.json" >/dev/null
          grep -F '"manifest_version": 2' "${fixture_root}/output/compromised-password.manifest.json"
          grep -F '"source_kind": "GENERATED_TEST_FIXTURE"' "${fixture_root}/output/compromised-password.manifest.json"
          if grep -F 'HIBP_PWNED_PASSWORDS_COMPLETE_DOWNLOAD' "${fixture_root}/output/compromised-password.manifest.json"; then
            echo 'Generated CI fixture must not claim complete HIBP acquisition evidence.' >&2
            exit 1
          fi
          grep -F '"source_line_count": 3' "${fixture_root}/output/compromised-password.manifest.json"
          grep -F '"record_count": 2' "${fixture_root}/output/compromised-password.manifest.json"
          grep -F '"duplicate_line_count": 1' "${fixture_root}/output/compromised-password.manifest.json"
          grep -F '"prefix_cardinality_bound": 64' "${fixture_root}/output/compromised-password.manifest.json"
          grep -F '"serialized_response_bytes_bound": 16384' "${fixture_root}/output/compromised-password.manifest.json"

      - name: Install and verify Buf
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output /tmp/buf \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "${BUF_SHA256}" /tmp/buf | sha256sum --check --strict -
          chmod 0755 /tmp/buf
          /tmp/buf --version | grep -F "${BUF_VERSION}"

      - name: Lint and check Protobuf compatibility
        working-directory: contracts/protobuf-contracts
        run: |
          set -euo pipefail
          /tmp/buf lint
          /tmp/buf build -o /tmp/compromised-password-contract.binpb
          ../../scripts/contracts/verify_protobuf_compatibility.sh \
            /tmp/buf /tmp/compromised-password-contract-baseline.binpb

      - name: Run pinned Semgrep policy
        run: |
          set -euo pipefail
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            --workdir /src \
            --env HOME=/tmp \
            --env SEMGREP_SEND_METRICS=off \
            "${SEMGREP_IMAGE}" \
            semgrep scan --error \
              --config .semgrep/compromised-password-service.yml \
              services/compromised-password-service/src/main/java

      - name: Install and verify Helm
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output /tmp/helm.tar.gz \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "${HELM_SHA256}" /tmp/helm.tar.gz | sha256sum --check --strict -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          /tmp/linux-amd64/helm version --short | grep -F "v${HELM_VERSION}"

      - name: Lint and verify hardened Helm render
        run: |
          set -euo pipefail
          chart="${SERVICE_DIR}/deploy/helm/compromised-password-service"
          /tmp/linux-amd64/helm lint "${chart}" --values "${chart}/ci/test-values.yaml"
          /tmp/linux-amd64/helm template compromised-password-service "${chart}" \
            --namespace platform-apps \
            --values "${chart}/ci/test-values.yaml" > /tmp/compromised-password-rendered.yaml
          python3 "${SERVICE_DIR}/scripts/verify_rendered_manifest.py" /tmp/compromised-password-rendered.yaml

      - name: Verify service alert rules and dashboard JSON
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          printf '%s  %s\n' "${PROMETHEUS_SHA256}" /tmp/prometheus.tar.gz | sha256sum --check --strict -
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          promtool="/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          "${promtool}" check rules "${SERVICE_DIR}/observability/alerts/compromised-password-service.yaml"
          python3 -m json.tool "${SERVICE_DIR}/observability/grafana/compromised-password-service.json" >/dev/null

      - name: Build digest-verified Temurin 25.0.4+7 runtime image
        run: |
          set -euo pipefail
          source "${SERVICE_DIR}/container/pins.env"
          test "${TEMURIN_JAVA_VERSION}" = '25.0.4'
          test "${TEMURIN_BUILD}" = '7'
          test "${TEMURIN_ARCHIVE_URL}" = 'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4%2B7/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4_7.tar.gz'
          test "${TEMURIN_ARCHIVE_SHA256}" = 'e58fcdcd637b25c03ca84cbbcefc70d11efb8f4b4cbd05decc9f661769d77f94'
          cleanup_runtime_jdk() {
            rm -rf "${SERVICE_DIR}/.runtime-jdk" /tmp/temurin-runtime-jdk.tar.gz
          }
          trap cleanup_runtime_jdk EXIT
          cleanup_runtime_jdk
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output /tmp/temurin-runtime-jdk.tar.gz \
            "${TEMURIN_ARCHIVE_URL}"
          printf '%s  %s\n' "${TEMURIN_ARCHIVE_SHA256}" /tmp/temurin-runtime-jdk.tar.gz \
            | sha256sum --check --strict -
          mkdir -p "${SERVICE_DIR}/.runtime-jdk"
          tar -xzf /tmp/temurin-runtime-jdk.tar.gz \
            --strip-components=1 \
            -C "${SERVICE_DIR}/.runtime-jdk"
          "${SERVICE_DIR}/.runtime-jdk/bin/java" -version 2>&1 | tee /tmp/verified-runtime-java.txt
          grep -F 'Temurin-25.0.4+7' /tmp/verified-runtime-java.txt
          docker pull "${RUNTIME_BASE_IMAGE}" >/dev/null
          docker build \
            --build-arg "RUNTIME_BASE_IMAGE=${RUNTIME_BASE_IMAGE}" \
            --tag compromised-password-service:ci \
            "${SERVICE_DIR}"
          docker run --rm --entrypoint java compromised-password-service:ci -version 2>&1 | tee /tmp/runtime-java.txt
          grep -F 'Temurin-25.0.4+7' /tmp/runtime-java.txt
          test "$(docker image inspect compromised-password-service:ci --format '{{.Config.User}}')" = '10001:10001'

      - name: Verify generated files are committed
        run: |
          set -euo pipefail
          git diff --exit-code -- "${SERVICE_DIR}/gradle.lockfile"
          git diff --exit-code
