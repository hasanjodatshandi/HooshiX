name: Compromised Password service

on:
  pull_request:
    paths:
      - '.github/workflows/compromised-password-service.yml'
      - '.semgrep/compromised-password-service.yml'
      - 'services/compromised-password-service/**'
      - 'docs/architecture/implementation-status.md'
      - '.sdkmanrc'
      - '.gitignore'
      - 'FILE_INDEX.txt'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/compromised-password-service.yml'
      - '.semgrep/compromised-password-service.yml'
      - 'services/compromised-password-service/**'
      - 'docs/architecture/implementation-status.md'
      - '.sdkmanrc'
      - '.gitignore'
      - 'FILE_INDEX.txt'

permissions:
  contents: read

concurrency:
  group: compromised-password-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_DIR: services/compromised-password-service
  BUF_VERSION: '1.72.0'
  BUF_SHA256: 8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af
  HELM_VERSION: '4.2.4'
  HELM_SHA256: c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
  PROMETHEUS_VERSION: '3.13.2'
  PROMETHEUS_SHA256: 0e8c4d46101bd025ea8265e377d2caabc57f488fc1be1c367f37db69ea41be6f
  SEMGREP_IMAGE: semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a

jobs:
  verify:
    name: Build, architecture, security, and render
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Eclipse Temurin 25.0.4
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4'

      - name: Verify Java and Gradle wrapper pins
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail
          java -version 2>&1 | tee /tmp/java-version.txt
          grep -F '25.0.4' /tmp/java-version.txt
          printf '%s  %s\n' \
            '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7' \
            'gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict -
          grep -F 'distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -F 'distributionSha256Sum=9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14' gradle/wrapper/gradle-wrapper.properties

      - name: Verify Gradle locks, dependencies, tests, and analysis
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail
          cp gradle.lockfile /tmp/gradle.lockfile
          ./gradlew \
            spotlessCheck \
            test \
            architectureTest \
            integrationTest \
            spotbugsMain \
            bootJar \
            --write-locks \
            --dependency-verification strict \
            --no-daemon
          cmp /tmp/gradle.lockfile gradle.lockfile

      - name: Install and verify Buf
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output /tmp/buf \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          printf '%s  %s\n' "${BUF_SHA256}" /tmp/buf | sha256sum --check --strict -
          chmod 0755 /tmp/buf
          /tmp/buf --version | grep -F "${BUF_VERSION}"

      - name: Lint and check Protobuf compatibility
        run: |
          set -euo pipefail
          /tmp/buf lint "${SERVICE_DIR}"
          if git cat-file -e "origin/main:${SERVICE_DIR}/buf.yaml" 2>/dev/null; then
            rm -rf /tmp/base
            mkdir -p /tmp/base
            git archive origin/main "${SERVICE_DIR}/buf.yaml" "${SERVICE_DIR}/src/main/proto" | tar -x -C /tmp/base
            /tmp/buf breaking "${SERVICE_DIR}" --against "/tmp/base/${SERVICE_DIR}"
          fi

      - name: Run pinned Semgrep policy
        run: |
          set -euo pipefail
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --tmpfs /root/.semgrep:rw,noexec,nosuid,size=16m \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            --workdir /src \
            --env SEMGREP_SEND_METRICS=off \
            "${SEMGREP_IMAGE}" \
            semgrep scan --error \
              --config .semgrep/compromised-password-service.yml \
              services/compromised-password-service/src/main/java

      - name: Install and verify Helm
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output /tmp/helm.tar.gz \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "${HELM_SHA256}" /tmp/helm.tar.gz | sha256sum --check --strict -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          /tmp/linux-amd64/helm version --short | grep -F "v${HELM_VERSION}"

      - name: Lint and verify hardened Helm render
        run: |
          set -euo pipefail
          chart="${SERVICE_DIR}/deploy/helm/compromised-password-service"
          /tmp/linux-amd64/helm lint "${chart}" --values "${chart}/ci/test-values.yaml"
          /tmp/linux-amd64/helm template compromised-password-service "${chart}" \
            --namespace platform-apps \
            --values "${chart}/ci/test-values.yaml" > /tmp/compromised-password-rendered.yaml
          python3 "${SERVICE_DIR}/scripts/verify_rendered_manifest.py" /tmp/compromised-password-rendered.yaml

      - name: Verify service alert rules and dashboard JSON
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          printf '%s  %s\n' "${PROMETHEUS_SHA256}" /tmp/prometheus.tar.gz | sha256sum --check --strict -
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          promtool="/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          "${promtool}" check rules "${SERVICE_DIR}/observability/alerts/compromised-password-service.yaml"
          python3 -m json.tool "${SERVICE_DIR}/observability/grafana/compromised-password-service.json" >/dev/null

      - name: Build exact Temurin 25.0.4 runtime image
        run: |
          set -euo pipefail
          source "${SERVICE_DIR}/container/pins.env"
          test "${TEMURIN_JAVA_VERSION}" = '25.0.4'
          test "${TEMURIN_BUILD}" = '7'
          docker pull "${RUNTIME_BASE_IMAGE}" >/dev/null
          rm -rf "${SERVICE_DIR}/.runtime-jdk"
          mkdir -p "${SERVICE_DIR}/.runtime-jdk"
          cp -a "${JAVA_HOME}/." "${SERVICE_DIR}/.runtime-jdk/"
          docker build \
            --build-arg "RUNTIME_BASE_IMAGE=${RUNTIME_BASE_IMAGE}" \
            --tag compromised-password-service:ci \
            "${SERVICE_DIR}"
          docker run --rm --entrypoint java compromised-password-service:ci -version 2>&1 | tee /tmp/runtime-java.txt
          grep -F '25.0.4' /tmp/runtime-java.txt
          test "$(docker image inspect compromised-password-service:ci --format '{{.Config.User}}')" = '10001:10001'
          rm -rf "${SERVICE_DIR}/.runtime-jdk"

      - name: Verify generated files are committed
        run: |
          set -euo pipefail
          git diff --exit-code -- "${SERVICE_DIR}/gradle.lockfile"
          git diff --exit-code
