name: Production release evidence
on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: Applications release or unchanged OpenBao/mesh import candidate (never deploys)
        required: true
        default: applications
        type: choice
        options:
          - applications
          - openbao-candidate
          - mesh-candidate
          - patched-platform-candidate
      release_manifest_path:
        description: Tracked reviewed production release manifest under deploy/releases/production
        required: false
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.release_kind == 'applications'
    runs-on: ubuntu-24.04
    environment: production-release
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release metadata
        id: metadata
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest_path }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$RELEASE_MANIFEST" =~ ^deploy/releases/production/[A-Za-z0-9._/-]+\.json$ ]]
          [[ "$RELEASE_MANIFEST" != *'..'* ]]
          git ls-files --error-unmatch -- "$RELEASE_MANIFEST" >/dev/null
          python3 scripts/production/verify_release.py --manifest "$RELEASE_MANIFEST"
          python3 - "$RELEASE_MANIFEST" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          manifest=json.load(open(sys.argv[1],encoding='utf-8'))
          if not all(image.startswith('ghcr.io/hasanjodatshandi/hooshix/')
                     for image in manifest['images'].values()):
              raise SystemExit('Release images must use the owner-selected GHCR namespace')
          with open(sys.argv[2],'a',encoding='utf-8') as output:
              print('git_revision='+manifest['git_revision'],file=output)
              print('cosign_identity='+manifest['cosign']['certificate_identity'],file=output)
              print('cosign_issuer='+manifest['cosign']['certificate_oidc_issuer'],file=output)
          PY
      - name: Install pinned release tools
        shell: bash
        run: |
          set -euo pipefail
          scripts/production/install_release_tools.sh "$RUNNER_TEMP/hooshix-release-bin"
          echo "$RUNNER_TEMP/hooshix-release-bin" >> "$GITHUB_PATH"
      - name: Authenticate with ephemeral repository package token
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "$GHCR_TOKEN" ]]
          install -d -m 0700 "$RUNNER_TEMP/docker-config"
          printf '%s' "$GHCR_TOKEN" | timeout 30 docker --config "$RUNNER_TEMP/docker-config" \
            login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          chmod 0600 "$RUNNER_TEMP/docker-config/config.json"
      - name: Require private owned packages before signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST: ${{ inputs.release_manifest_path }}
        run: |
          set -euo pipefail
          python3 - "$RELEASE_MANIFEST" > "$RUNNER_TEMP/ghcr-packages.txt" <<'PY'
          import json,sys,urllib.parse
          manifest=json.load(open(sys.argv[1],encoding='utf-8'))
          for image in manifest['images'].values():
              package=image.split('@sha256:',1)[0].removeprefix('ghcr.io/hasanjodatshandi/')
              print(urllib.parse.quote(package,safe=''))
          PY
          mapfile -t packages < "$RUNNER_TEMP/ghcr-packages.txt"
          [[ "${#packages[@]}" == 7 ]] || { echo 'Seven private packages required' >&2; exit 1; }
          for package in "${packages[@]}"; do
            visibility=$(timeout 20 gh api "users/hasanjodatshandi/packages/container/$package" --jq '.visibility')
            [[ "$visibility" == private ]] || { echo 'Private package verification failed' >&2; exit 1; }
          done
      - name: Refresh vulnerability database once
        shell: bash
        run: |
          set -euo pipefail
          grype db update
          grype db status -o json | python3 -m json.tool >/dev/null
      - name: Generate SBOM, block High/Critical, sign and attest exact digests
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest_path }}
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
          GIT_REVISION: ${{ steps.metadata.outputs.git_revision }}
          COSIGN_IDENTITY: ${{ steps.metadata.outputs.cosign_identity }}
          COSIGN_ISSUER: ${{ steps.metadata.outputs.cosign_issuer }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/release-evidence"
          while IFS=$'\t' read -r component image; do
            provenance="$RUNNER_TEMP/provenance-$(printf '%s' "$image" | sha256sum | awk '{print $1}').json"
            python3 scripts/production/build_provenance.py \
              --manifest "$RELEASE_MANIFEST" \
              --image "$image" \
              --invocation-id "github:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
              --output "$provenance"
            COMPONENT_NAME="$component" IMAGE_REF="$image" PROVENANCE_FILE="$provenance" EVIDENCE_DIR="$RUNNER_TEMP/release-evidence" \
              scripts/production/release_supply_chain.sh
          done < <(python3 - "$RELEASE_MANIFEST" <<'PY'
          import json,sys
          sys.path.insert(0,'scripts/production')
          import verify_release
          manifest=json.load(open(sys.argv[1],encoding='utf-8'))
          for component in verify_release.RELEASE_COMPONENTS:
              print(component+'\t'+manifest['images'][component])
          PY
          )
          cat "$RUNNER_TEMP"/release-evidence/*.receipt
      - name: Retain immutable release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary registry authentication
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/docker-config/config.json"

  openbao-candidate:
    if: github.ref == 'refs/heads/main' && (inputs.release_kind == 'openbao-candidate' || inputs.release_kind == 'mesh-candidate' || inputs.release_kind == 'patched-platform-candidate')
    runs-on: ubuntu-24.04
    environment: production-release
    timeout-minutes: ${{ inputs.release_kind == 'patched-platform-candidate' && 180 || 35 }}
    permissions:
      contents: read
      actions: read
      id-token: write
      packages: write
    env:
      SYFT_GOLANG_CAPTURE_SYMBOLS: all
      GRYPE_DB_AUTO_UPDATE: 'false'
      GRYPE_DB_VALIDATE_AGE: 'true'
      GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 120h
      GRYPE_CHECK_FOR_APP_UPDATE: 'false'
      SYFT_CHECK_FOR_APP_UPDATE: 'false'
      GOMAXPROCS: '2'
    steps:
      - name: Check out protected main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful baseline for this exact main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout 20 gh run list --workflow repository-baseline.yml --commit "$GITHUB_SHA" \
            --event push --status success --limit 5 --json headSha,conclusion,status \
            | python3 -c 'import json,os,sys; runs=json.load(sys.stdin); assert any(r["headSha"]==os.environ["GITHUB_SHA"] and r["conclusion"]=="success" and r["status"]=="completed" for r in runs), "Exact main baseline must pass first"'
      - name: Install existing integrity-pinned release tools
        run: |
          set -euo pipefail
          scripts/production/install_release_tools.sh "$RUNNER_TEMP/openbao-release-bin"
          echo "$RUNNER_TEMP/openbao-release-bin" >> "$GITHUB_PATH"
      - name: Authenticate with ephemeral package token only
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/docker-config"
          printf '%s' "$GHCR_TOKEN" | timeout 30 docker --config "$RUNNER_TEMP/docker-config" \
            login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          chmod 0600 "$RUNNER_TEMP/docker-config/config.json"
      - name: Import scan sign and verify unchanged private candidate
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
          RELEASE_KIND: ${{ inputs.release_kind }}
        run: |
          set -euo pipefail
          case "$RELEASE_KIND" in
            openbao-candidate) python3 scripts/production/publish_openbao_candidate.py ;;
            mesh-candidate) python3 scripts/production/publish_mesh_candidate.py ;;
            patched-platform-candidate)
              timeout 180 grype db update
              python3 scripts/production/build_patched_platform.py --publish \
                --directory "$RUNNER_TEMP/patched-release-evidence"
              ;;
            *) exit 1 ;;
          esac
      - name: Remove temporary registry authentication
        if: always()
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/docker-config/config.json"
          test ! -e "$RUNNER_TEMP/docker-config/config.json"
      - name: Retain public candidate evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.release_kind == 'patched-platform-candidate' && 'patched' || inputs.release_kind == 'mesh-candidate' && 'mesh' || 'openbao' }}-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ inputs.release_kind == 'patched-platform-candidate' && 'patched' || inputs.release_kind == 'mesh-candidate' && 'mesh' || 'openbao' }}-release-evidence/
          retention-days: 30
          if-no-files-found: error
