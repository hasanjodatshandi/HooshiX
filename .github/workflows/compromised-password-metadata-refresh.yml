name: Compromised Password metadata refresh

on:
  push:
    branches:
      - agent/compromised-password-vertical-slice

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Eclipse Temurin 25.0.4
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.4'

      - name: Refresh exact dependency metadata and formatting
        working-directory: services/compromised-password-service
        run: |
          set -euo pipefail
          ./gradlew \
            spotlessApply \
            test \
            architectureTest \
            integrationTest \
            spotbugsMain \
            bootJar \
            --write-locks \
            --write-verification-metadata sha256 \
            --no-daemon

      - name: Upload refreshed service tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compromised-password-metadata-refresh
          retention-days: 1
          if-no-files-found: error
          path: |
            services/compromised-password-service
            !services/compromised-password-service/.gradle/**
            !services/compromised-password-service/build/**
