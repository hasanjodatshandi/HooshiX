name: Platform commissioning staging

on:
  pull_request:
    paths:
      - .github/workflows/platform-commissioning.yml
      - scripts/production/rehearse_openbao_kubernetes.py
      - scripts/production/rehearse_platform_admission.py
      - scripts/production/render_mesh_candidate.py
      - scripts/production/render_platform_admission.py
      - scripts/production/verify_platform_publication_run.py
      - scripts/production/commission_platform.py
      - scripts/production/build_platform_commissioning_bundle.py
      - scripts/production/run-platform-commissioning.ps1
      - scripts/production/tests/test_platform_commissioning.py
      - infrastructure/istio/**
      - infrastructure/kyverno/**
      - infrastructure/production/secrets/**
  workflow_dispatch:
    inputs:
      mesh_run:
        description: Successful reviewed-main Production release mesh publication run
        required: true
        default: '37588183736'
      openbao_run:
        description: Successful reviewed-main Production release private OpenBao publication run
        required: true
        default: '37228262995'

permissions:
  contents: read

jobs:
  staging:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Signed Calico Ambient Kyverno OpenBao staging
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Check out exact requested source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download successful main publications from the exact release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          MESH_RUN: ${{ inputs.mesh_run || '37588183736' }}
          OPENBAO_RUN: ${{ inputs.openbao_run || '37228262995' }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/platform-publications"
          python3 scripts/production/verify_platform_publication_run.py \
            --mesh-run "$MESH_RUN" --openbao-run "$OPENBAO_RUN" \
            --output "$RUNNER_TEMP/platform-publications"
      - name: Install pinned disposable fixture tools and YAML parser
        run: |
          set -euo pipefail
          source infrastructure/kind/pins.env
          install -d -m 0700 "$RUNNER_TEMP/platform-tools"
          curl --fail --location --max-redirs 5 --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 90 \
            "https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}/kind-linux-amd64" \
            -o "$RUNNER_TEMP/platform-tools/kind"
          curl --fail --location --max-redirs 5 --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 90 \
            "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            -o "$RUNNER_TEMP/platform-tools/kubectl"
          curl --fail --location --max-redirs 5 --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 90 \
            https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz -o "$RUNNER_TEMP/platform-tools/helm.tar.gz"
          printf '%s  %s\n' "$KIND_LINUX_AMD64_SHA256" "$RUNNER_TEMP/platform-tools/kind" \
            "$KUBECTL_LINUX_AMD64_SHA256" "$RUNNER_TEMP/platform-tools/kubectl" \
            c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3 \
            "$RUNNER_TEMP/platform-tools/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/platform-tools/helm.tar.gz" -C "$RUNNER_TEMP/platform-tools" linux-amd64/helm
          chmod 0700 "$RUNNER_TEMP/platform-tools/kind" "$RUNNER_TEMP/platform-tools/kubectl"
          echo "$RUNNER_TEMP/platform-tools/linux-amd64" >> "$GITHUB_PATH"
          python3 -m pip install --disable-pip-version-check --no-deps --only-binary=:all: \
            --require-hashes --timeout 15 --retries 0 --target "$RUNNER_TEMP/platform-yaml" -r /dev/stdin <<'REQUIREMENTS'
          PyYAML @ https://files.pythonhosted.org/packages/8b/9d/b3589d3877982d4f2329302ef98a8026e7f4443c765c46cfecc8858c6b4b/pyyaml-6.0.3-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc
          REQUIREMENTS
          echo "PYTHONPATH=$RUNNER_TEMP/platform-yaml" >> "$GITHUB_ENV"
      - name: Verify pinned Kyverno upstream release signatures
        run: |
          set -euo pipefail
          source infrastructure/production/release-tools.env
          source infrastructure/kyverno/pins.env
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 90 \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
            -o "$RUNNER_TEMP/platform-tools/cosign"
          printf '%s  %s\n' "$COSIGN_LINUX_AMD64_SHA256" "$RUNNER_TEMP/platform-tools/cosign" | sha256sum --check --strict
          chmod 0700 "$RUNNER_TEMP/platform-tools/cosign"
          export COSIGN_REPOSITORY=ghcr.io/kyverno/signatures
          for pair in "kyverno:$KYVERNO_ADMISSION_INDEX_DIGEST" "kyvernopre:$KYVERNO_PRE_INDEX_DIGEST" \
            "background-controller:$KYVERNO_BACKGROUND_INDEX_DIGEST" "cleanup-controller:$KYVERNO_CLEANUP_INDEX_DIGEST" \
            "reports-controller:$KYVERNO_REPORTS_INDEX_DIGEST"; do
            timeout 120s "$RUNNER_TEMP/platform-tools/cosign" verify \
              --certificate-identity "https://github.com/kyverno/kyverno/.github/workflows/release.yaml@refs/tags/v${KYVERNO_VERSION}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "reg.kyverno.io/kyverno/${pair%%:*}@${pair#*:}" > /dev/null
          done
      - name: Rehearse exact private images with real Calico Ambient and fail-closed Kyverno
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/production/rehearse_openbao_kubernetes.py --ci \
            --tools-dir "$RUNNER_TEMP/platform-tools" \
            --platform-publications "$RUNNER_TEMP/platform-publications" \
            --receipt "$RUNNER_TEMP/platform-staging-receipt.json"
      - name: Retain content-free evidence only after private fixture cleanup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-staging-receipt.json
          retention-days: 30
          if-no-files-found: error
