name: Platform commissioning staging

on:
  pull_request:
    paths:
      - .github/workflows/platform-commissioning.yml
      - scripts/production/rehearse_openbao_kubernetes.py
      - scripts/production/rehearse_platform_admission.py
      - scripts/production/*postgresql*secrets*.py
      - scripts/production/postgresql_secret_delivery.py
      - scripts/production/tests/test_postgresql_secrets.py
      - scripts/production/*redis*secrets*.py
      - scripts/production/redis_secret_delivery.py
      - scripts/production/render_redis_acl.py
      - scripts/production/tests/test_redis_secrets.py
      - scripts/production/*redis*tls*.py
      - scripts/production/tests/test_redis_tls.py
      - scripts/production/*redis*runtime*.py
      - scripts/production/verify_published_redis.py
      - scripts/production/run-redis-runtime.ps1
      - scripts/production/tests/test_redis_runtime.py
      - scripts/production/*kafka*tls*.py
      - scripts/production/kafka_secret_delivery.py
      - scripts/production/tests/test_kafka_tls.py
      - scripts/production/test_redis_security_native.py
      - scripts/production/render_redis_security.py
      - infrastructure/production/redis/runtime.json
      - scripts/production/install_redis_local_volume.py
      - scripts/production/*postgresql*quarantine*.py
      - scripts/production/tests/test_postgresql_quarantine.py
      - scripts/production/run-postgresql-quarantine.ps1
      - scripts/production/install_postgresql_local_volume.py
      - scripts/production/rehearsal_probes.py
      - scripts/production/tests/test_rehearsal_probes.py
      - scripts/production/render_mesh_candidate.py
      - scripts/production/render_platform_admission.py
      - scripts/production/render_mesh_security_upgrade.py
      - scripts/production/upgrade_mesh_security.py
      - scripts/production/build_mesh_security_upgrade_bundle.py
      - scripts/production/run-mesh-security-upgrade.ps1
      - scripts/production/verify_mesh_security_publication.py
      - scripts/production/tests/test_mesh_security_upgrade.py
      - scripts/production/verify_platform_publication_run.py
      - scripts/production/commission_platform.py
      - scripts/production/*eso*.py
      - scripts/production/run-eso-commissioning.ps1
      - scripts/production/run-cert-manager-commissioning.ps1
      - scripts/production/tests/test_eso*.py
      - scripts/production/*cert_manager*.py
      - scripts/production/*cnpg*.py
      - scripts/production/*barman*.py
      - scripts/production/run-barman-control-plane.ps1
      - scripts/production/tests/test_barman_control_plane.py
      - scripts/production/run-cnpg-control-plane.ps1
      - scripts/production/tests/test_cnpg_control_plane.py
      - scripts/production/tests/test_cert_manager_commissioning.py
      - infrastructure/production/data/cert-manager*.json
      - scripts/production/platform_image_egress.py
      - scripts/production/upgrade_kyverno.py
      - scripts/production/build_platform_commissioning_bundle.py
      - scripts/production/run-platform-commissioning.ps1
      - scripts/production/tests/test_platform_commissioning.py
      - infrastructure/istio/**
      - infrastructure/kyverno/**
      - infrastructure/production/secrets/**
  workflow_dispatch:
    inputs:
      mesh_security_upgrade:
        description: Rehearse limited source-patched mesh upgrade preserving initialized OpenBao
        type: boolean
        default: true
      eso_commissioning:
        description: Rehearse namespace-scoped signed ESO on the patched Ambient mesh
        type: boolean
        default: true
      cert_manager_commissioning:
        description: Rehearse three signed internal cert-manager components with scoped TLS and webhook exception
        type: boolean
        default: false
      cnpg_control_plane:
        description: Rehearse the signed namespace-scoped CNPG controller without a database instance
        type: boolean
        default: false
      barman_control_plane:
        description: Rehearse signed internal Barman with owner-approved metadata cache and no Secret API access
        type: boolean
        default: false
      postgresql_quarantine:
        description: Rehearse only the owner-approved empty closed PostgreSQL quarantine
        type: boolean
        default: false
      mesh_run:
        description: Successful reviewed-main Production release mesh publication run
        required: true
        default: '37588183736'
      openbao_run:
        description: Successful reviewed-main Production release private OpenBao publication run
        required: true
        default: '37611729931'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  staging:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Signed Calico Ambient Kyverno OpenBao staging
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      GRYPE_DB_AUTO_UPDATE: 'false'
      GRYPE_DB_VALIDATE_AGE: 'true'
      GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 120h
      GRYPE_CHECK_FOR_APP_UPDATE: 'false'
    steps:
      - name: Check out exact requested source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Parse public operator wrapper without target execution
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/production/run-mesh-security-upgrade.ps1'),
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'MESH_OPERATOR_WRAPPER_SYNTAX_FAILED' }
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/production/run-eso-commissioning.ps1'),
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'ESO_OPERATOR_WRAPPER_SYNTAX_FAILED' }
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/production/run-cert-manager-commissioning.ps1'),
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'CERT_MANAGER_OPERATOR_WRAPPER_SYNTAX_FAILED' }
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/production/run-cnpg-control-plane.ps1'),
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'CNPG_OPERATOR_WRAPPER_SYNTAX_FAILED' }
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/production/run-postgresql-quarantine.ps1'),
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'POSTGRESQL_QUARANTINE_WRAPPER_SYNTAX_FAILED' }
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/production/run-redis-runtime.ps1'),
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'REDIS_RUNTIME_WRAPPER_SYNTAX_FAILED' }
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts/production/run-barman-control-plane.ps1'),
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'BARMAN_OPERATOR_WRAPPER_SYNTAX_FAILED' }
      - name: Install pinned disposable fixture tools and YAML parser
        run: |
          set -euo pipefail
          source infrastructure/kind/pins.env
          install -d -m 0700 "$RUNNER_TEMP/platform-tools"
          curl --fail --location --max-redirs 5 --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 90 \
            "https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}/kind-linux-amd64" \
            -o "$RUNNER_TEMP/platform-tools/kind"
          curl --fail --location --max-redirs 5 --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 90 \
            "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            -o "$RUNNER_TEMP/platform-tools/kubectl"
          curl --fail --location --max-redirs 5 --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 90 \
            https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz -o "$RUNNER_TEMP/platform-tools/helm.tar.gz"
          printf '%s  %s\n' "$KIND_LINUX_AMD64_SHA256" "$RUNNER_TEMP/platform-tools/kind" \
            "$KUBECTL_LINUX_AMD64_SHA256" "$RUNNER_TEMP/platform-tools/kubectl" \
            c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3 \
            "$RUNNER_TEMP/platform-tools/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/platform-tools/helm.tar.gz" -C "$RUNNER_TEMP/platform-tools" linux-amd64/helm
          install -m 0700 "$RUNNER_TEMP/platform-tools/linux-amd64/helm" "$RUNNER_TEMP/platform-tools/helm"
          chmod 0700 "$RUNNER_TEMP/platform-tools/kind" "$RUNNER_TEMP/platform-tools/kubectl"
          echo "$RUNNER_TEMP/platform-tools/linux-amd64" >> "$GITHUB_PATH"
          python3 -m pip install --disable-pip-version-check --no-deps --only-binary=:all: \
            --require-hashes --timeout 15 --retries 0 --target "$RUNNER_TEMP/platform-yaml" -r /dev/stdin <<'REQUIREMENTS'
          PyYAML @ https://files.pythonhosted.org/packages/8b/9d/b3589d3877982d4f2329302ef98a8026e7f4443c765c46cfecc8858c6b4b/pyyaml-6.0.3-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc
          REQUIREMENTS
          echo "PYTHONPATH=$RUNNER_TEMP/platform-yaml" >> "$GITHUB_ENV"
      - name: Install existing pinned publication scan tools
        run: |
          timeout 300 scripts/production/install_release_tools.sh "$RUNNER_TEMP/publication-tools"
          echo "$RUNNER_TEMP/publication-tools" >> "$GITHUB_PATH"
      - name: Download authenticated publications and rescan unchanged source images
        env:
          GH_TOKEN: ${{ github.token }}
          MESH_RUN: ${{ inputs.mesh_run || '37588183736' }}
          OPENBAO_RUN: ${{ inputs.openbao_run || '37611729931' }}
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name == 'pull_request' || inputs.mesh_security_upgrade }}' == 'true' ]]; then
            python3 scripts/production/verify_mesh_security_publication.py --output "$RUNNER_TEMP/platform-publications"
          else
            install -d -m 0700 "$RUNNER_TEMP/platform-publications"
            python3 scripts/production/verify_platform_publication_run.py \
              --mesh-run "$MESH_RUN" --openbao-run "$OPENBAO_RUN" \
              --output "$RUNNER_TEMP/platform-publications"
          fi
      - name: Retain public source rescan evidence without credentials
        if: ${{ always() && (github.event_name == 'pull_request' || inputs.mesh_security_upgrade) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-publication-rescan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/platform-publications/rescan.json
            ${{ runner.temp }}/platform-publications/publication.json
            ${{ runner.temp }}/platform-publications/*/grype.json
            ${{ runner.temp }}/platform-publications/*/database.json
          if-no-files-found: error
          retention-days: 30
      - name: Prepare pinned ESO chart and verify exact published source evidence
        if: ${{ github.event_name == 'pull_request' || inputs.eso_commissioning }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 \
            https://github.com/external-secrets/external-secrets/releases/download/helm-chart-2.12.0/external-secrets-2.12.0.tgz \
            -o "$RUNNER_TEMP/platform-tools/eso-chart.tgz"
          printf '%s  %s\n' 4b584136b7311c0af8c8719d377cc5b1a7ef12c2de18f1fdb30614eab75bdeb3 \
            "$RUNNER_TEMP/platform-tools/eso-chart.tgz" | sha256sum --check --strict
          python3 -c 'import os,sys; from pathlib import Path; sys.path.insert(0,"scripts/production"); import render_eso_commissioning as eso; eso.validate_publication(Path(os.environ["RUNNER_TEMP"])/"platform-publications")'
      - name: Verify pinned Kyverno upstream release signatures
        run: |
          set -euo pipefail
          source infrastructure/production/release-tools.env
          source infrastructure/kyverno/pins.env
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 90 \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
            -o "$RUNNER_TEMP/platform-tools/cosign"
          printf '%s  %s\n' "$COSIGN_LINUX_AMD64_SHA256" "$RUNNER_TEMP/platform-tools/cosign" | sha256sum --check --strict
          chmod 0700 "$RUNNER_TEMP/platform-tools/cosign"
          # Cosign 3 OCI bundles live in upstream's separate signatures repository;
          # COSIGN_REPOSITORY only redirects legacy .sig tags, not OCI referrers.
          for pair in "kyverno:$KYVERNO_ADMISSION_INDEX_DIGEST" "kyvernopre:$KYVERNO_PRE_INDEX_DIGEST" \
            "background-controller:$KYVERNO_BACKGROUND_INDEX_DIGEST" "cleanup-controller:$KYVERNO_CLEANUP_INDEX_DIGEST" \
            "reports-controller:$KYVERNO_REPORTS_INDEX_DIGEST"; do
            timeout 120s "$RUNNER_TEMP/platform-tools/cosign" verify \
              --certificate-identity "https://github.com/kyverno/kyverno/.github/workflows/release.yaml@refs/tags/v${KYVERNO_VERSION}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "ghcr.io/kyverno/signatures@${pair#*:}" > /dev/null
          done
      - name: Prepare exact internal cert-manager manifest and published acceptance
        if: ${{ github.event_name == 'pull_request' || inputs.cert_manager_commissioning || inputs.cnpg_control_plane || inputs.barman_control_plane || inputs.postgresql_quarantine }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 \
            https://github.com/cert-manager/cert-manager/releases/download/v1.20.3/cert-manager.yaml \
            -o "$RUNNER_TEMP/platform-tools/cert-manager.yaml"
          printf '%s  %s\n' 7ee74ba06845213e96d8ceaff3d20dd51e682765c1418eddda4e8780ba082261 \
            "$RUNNER_TEMP/platform-tools/cert-manager.yaml" | sha256sum --check --strict
          gh run download 38409447796 --repo hasanjodatshandi/HooshiX \
            --name cert-manager-publication-38409447796-1 --dir "$RUNNER_TEMP/cert-manager-publication"
          scripts/production/install_release_tools.sh "$RUNNER_TEMP/cert-manager-tools"
          export PATH="$RUNNER_TEMP/cert-manager-tools:$PATH"
          python3 scripts/production/verify_published_cert_manager.py \
            --evidence-dir "$RUNNER_TEMP/cert-manager-publication" --output-dir "$RUNNER_TEMP/cert-manager-acceptance"
      - name: Prepare exact CNPG manifest and published data-set acceptance
        if: ${{ github.event_name == 'pull_request' || inputs.cnpg_control_plane || inputs.barman_control_plane || inputs.postgresql_quarantine }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 \
            https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/v1.30.1/releases/cnpg-1.30.1.yaml \
            -o "$RUNNER_TEMP/platform-tools/cnpg.yaml"
          printf '%s  %s\n' 37237f145d8138256ea25ae830f87759255665ff08f8d552fdd8224a5ec032fb \
            "$RUNNER_TEMP/platform-tools/cnpg.yaml" | sha256sum --check --strict
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 \
            https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.15.1/manifest.yaml \
            -o "$RUNNER_TEMP/platform-tools/barman.yaml"
          printf '%s  %s\n' 8f377ff4a7d0d3f74fc64b0f7ac4f449fc38ca9e83a40107cca2f9315a9bd920 \
            "$RUNNER_TEMP/platform-tools/barman.yaml" | sha256sum --check --strict
          gh run download 38382418665 --repo hasanjodatshandi/HooshiX \
            --name postgresql-publication-38382418665-1 --dir "$RUNNER_TEMP/postgresql-publication"
          export PATH="$RUNNER_TEMP/cert-manager-tools:$PATH"
          python3 scripts/production/verify_published_postgresql.py \
            --evidence-dir "$RUNNER_TEMP/postgresql-publication" --output-dir "$RUNNER_TEMP/postgresql-acceptance"
      - name: Reaccept the existing signed Redis image without rebuilding or publishing
        if: ${{ github.event_name == 'pull_request' || inputs.postgresql_quarantine }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/cert-manager-tools:$PATH"
          python3 scripts/production/verify_published_redis.py --output "$RUNNER_TEMP/redis-acceptance"
      - name: Retain fresh public image scans and acceptance receipts only
        if: ${{ always() && (github.event_name == 'pull_request' || inputs.cert_manager_commissioning || inputs.cnpg_control_plane || inputs.barman_control_plane || inputs.postgresql_quarantine) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-image-reacceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cert-manager-acceptance/acceptance.json
            ${{ runner.temp }}/cert-manager-acceptance/*/registry/*.json
            ${{ runner.temp }}/postgresql-acceptance/acceptance.json
            ${{ runner.temp }}/postgresql-acceptance/*/registry/*.json
            ${{ runner.temp }}/redis-acceptance/acceptance.json
            ${{ runner.temp }}/redis-acceptance/registry/*.json
          retention-days: 30
          if-no-files-found: error
      - name: Rehearse exact private images with real Calico Ambient and fail-closed Kyverno
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          options=()
          if [[ '${{ github.event_name == 'pull_request' || inputs.mesh_security_upgrade }}' == 'true' ]]; then
            options+=(--mesh-security-upgrade)
          fi
          if [[ '${{ github.event_name == 'pull_request' || inputs.eso_commissioning }}' == 'true' ]]; then
            options+=(--eso-chart "$RUNNER_TEMP/platform-tools/eso-chart.tgz")
          fi
          if [[ '${{ github.event_name == 'pull_request' || inputs.cert_manager_commissioning || inputs.cnpg_control_plane || inputs.barman_control_plane || inputs.postgresql_quarantine }}' == 'true' ]]; then
            options+=(--cert-manager-manifest "$RUNNER_TEMP/platform-tools/cert-manager.yaml")
          fi
          if [[ '${{ github.event_name == 'pull_request' || inputs.cnpg_control_plane || inputs.barman_control_plane || inputs.postgresql_quarantine }}' == 'true' ]]; then
            options+=(--cnpg-manifest "$RUNNER_TEMP/platform-tools/cnpg.yaml")
          fi
          if [[ '${{ github.event_name == 'pull_request' || inputs.barman_control_plane || inputs.postgresql_quarantine }}' == 'true' ]]; then
            options+=(--barman-manifest "$RUNNER_TEMP/platform-tools/barman.yaml")
          fi
          if [[ '${{ github.event_name == 'pull_request' || inputs.postgresql_quarantine }}' == 'true' ]]; then
            options+=(--postgresql-quarantine)
          fi
          python3 scripts/production/rehearse_openbao_kubernetes.py --ci \
            --tools-dir "$RUNNER_TEMP/platform-tools" \
            --platform-publications "$RUNNER_TEMP/platform-publications" \
            --receipt "$RUNNER_TEMP/platform-staging-receipt.json" "${options[@]}"
      - name: Retain content-free evidence only after private fixture cleanup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-staging-receipt.json
          retention-days: 30
          if-no-files-found: error
